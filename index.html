<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Integral Vet</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Integral Vet">

<style>
  :root{
    --bg: #10151B;
    --bg2: #161D25;
    --card: #1B232C;
    --card2: #212B36;
    --line: #2C3844;
    --ink: #ECEFF2;
    --ink-soft: #8B96A3;
    --teal: #159AA6;
    --teal-dk: #12444A;
    --green: #3F8F5F;
    --green-dk: #1E3A29;
    --purple: #6C5CA6;
    --purple-dk: #2E2748;
    --blue: #3568B0;
    --blue-dk: #1B2C49;
    --amber: #C99A3B;
    --red: #B5482A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  #app{max-width:460px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}
  header.topbar{
    background: var(--bg2); padding:16px 20px 14px; position:sticky; top:0; z-index:5;
    border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
  }
  header.topbar .brand{font-size:16.5px; font-weight:800; letter-spacing:0.3px;}
  header.topbar .brand span{color:var(--teal);}
  header.topbar .who{font-size:11px; color:var(--ink-soft); text-align:right;}
  .backbtn{background:none; border:none; color:var(--teal); font-size:14.5px; font-weight:700; cursor:pointer; padding:0; margin-bottom:14px;}
  main{flex:1; padding:18px 18px 78px; display:flex; flex-direction:column;}

  /* LOGIN */
  .splash{text-align:center; padding:60px 24px 24px; position:relative;}
  .selloMV{position:absolute; top:8px; right:14px; width:100px; height:100px; opacity:0.95;}
  .splash h1{font-size:26px; font-weight:800; margin:0;}
  .splash h1 span{color:var(--teal);}
  .splash p{font-size:12.5px; color:var(--ink-soft); margin-top:4px; letter-spacing:0.5px;}
  .splash .wm{font-size:11px; color:#3A4552; margin-top:30px; line-height:1.6;}
  .loginbox{margin-top:14px; text-align:left;}
  .remember{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12.5px; color:var(--ink-soft);}
  .remember input{width:auto;}

  label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:14px 0 6px;}
  label:first-of-type{margin-top:4px;}
  input[type=text], input[type=password], input[type=date], input[type=number], select, textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:14.5px; background:var(--card); color:var(--ink); font-family:inherit;
  }
  textarea{min-height:90px; resize:vertical; line-height:1.4;}
  input::placeholder, textarea::placeholder{color:#5A6472;}
  .btn{display:block; width:100%; padding:13px; border:none; border-radius:7px; font-size:14.5px; font-weight:700; cursor:pointer; margin-top:14px; font-family:inherit;}
  .btn-teal{background:var(--teal); color:#08181A;}
  .btn-green{background:var(--green); color:#08170F;}
  .btn-amber{background:var(--amber); color:#2A1E05;}
  .btn-outline{background:none; color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:none; color:var(--red); border:1px solid var(--red);}

  /* HOME GRID */
  .grid2{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px; margin-top:6px; flex:1; min-height:250px; max-height:340px;}
  .tile{border:none; border-radius:16px; padding:16px 14px; text-align:left; cursor:pointer; height:100%; display:flex; flex-direction:column; justify-content:space-between; color:#fff;}
  .tile .icon{font-size:28px;}
  .tile .label{font-weight:800; font-size:16.5px; margin-top:10px;}
  .tile .desc{font-size:12.5px; opacity:0.85; margin-top:3px; line-height:1.35;}
  .tile.teal{background:linear-gradient(160deg, var(--teal), var(--teal-dk));}
  .tile.green{background:linear-gradient(160deg, var(--green), var(--green-dk));}
  .tile.purple{background:linear-gradient(160deg, var(--purple), var(--purple-dk));}
  .tile.blue{background:linear-gradient(160deg, var(--blue), var(--blue-dk));}
  .tile:active{opacity:0.88;}

  .sectiontitle{font-size:12px; font-weight:700; color:var(--ink-soft); margin:22px 0 8px;}

  /* LISTS / CARDS */
  .searchbar{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; font-size:14px; background:var(--card); color:var(--ink); margin-bottom:10px;}
  .listcard{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:13px 14px; margin-bottom:9px; cursor:pointer;}
  .listcard .top{display:flex; justify-content:space-between; align-items:baseline;}
  .listcard .name{font-weight:700; font-size:14.5px;}
  .listcard .date{font-size:11px; color:var(--ink-soft);}
  .listcard .meta{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .tag{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:20px; margin-top:6px; margin-right:5px;}
  .tag.parcial{background:#3A2E14; color:var(--amber);}
  .tag.finalizado{background:var(--green-dk); color:#8FD9AA;}
  .empty{text-align:center; padding:40px 16px; color:var(--ink-soft); font-size:13.5px; line-height:1.5;}
  .twobtn{display:flex; gap:10px;}
  .twobtn .btn{flex:1;}

  /* Species picker */
  .speciesgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px;}
  .speciesbtn{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 10px; text-align:center; cursor:pointer; color:var(--ink);}
  .speciesbtn .emoji{font-size:34px; display:block;}
  .speciesbtn .lab{font-weight:700; font-size:13.5px; margin-top:8px; display:block;}
  .speciesbtn.disabled{opacity:0.4;}

  /* category menu */
  .catlist .cattile{
    display:flex; align-items:center; justify-content:space-between; background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:14px 15px; margin-bottom:9px; cursor:pointer;
  }
  .cattile .left{display:flex; align-items:center; gap:12px;}
  .cattile .emoji{font-size:19px;}
  .cattile .lab{font-weight:700; font-size:14px;}
  .cattile .check{color:#8FD9AA; font-size:16px;}
  .statusbar{display:flex; justify-content:space-between; align-items:center; background:var(--card2); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:12px; color:var(--ink-soft);}

  /* option buttons (Regular/Bueno/Malo etc) */
  .optrow{display:flex; gap:8px; margin-bottom:4px;}
  .optbtn{flex:1; padding:11px 4px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-size:13px; font-weight:700; cursor:pointer; text-align:center;}
  .optbtn.selected{background:var(--teal); border-color:var(--teal); color:#08181A;}

  .sublist .subtile{
    display:flex; align-items:center; justify-content:space-between; background:var(--card);
    border:1px solid var(--line); border-radius:7px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-size:13.5px;
  }
  .subtile .check{color:#8FD9AA;}

  .animalrow{display:flex; gap:6px; align-items:center; margin-bottom:8px; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:8px;}
  .animalrow .tubolab{font-size:11px; font-weight:700; color:var(--ink-soft); width:38px; flex-shrink:0;}
  .animalrow input, .animalrow select{flex:1; padding:8px; font-size:12.5px;}
  .removeanimal{background:none; border:none; color:var(--red); font-size:17px; cursor:pointer; padding:0 3px;}
  .addanimalbtn{background:none; border:1px dashed var(--line); color:var(--ink-soft); width:100%; padding:9px; border-radius:7px; font-size:13px; cursor:pointer; margin-bottom:10px;}

  .vacrow{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:13px 14px; margin-bottom:9px;}
  .vacrow .top{display:flex; justify-content:space-between; align-items:center;}
  .vacrow .lab{font-weight:700; font-size:13.5px;}
  .vacrow .prox{font-size:11.5px; color:var(--amber); margin-top:5px;}
  .vacbtn{background:var(--green-dk); color:#8FD9AA; border:none; border-radius:6px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer;}
  .vacbtn.done{background:var(--green); color:#08170F;}

  .estabcard{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px;}
  .estabcard .esth{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .estabcard .esth b{font-size:13px;}
  .removeestab{background:none; border:none; color:var(--red); font-size:12px; cursor:pointer;}
  .addestabbtn{background:none; border:1px dashed var(--line); color:var(--ink-soft); width:100%; padding:9px; border-radius:7px; font-size:13px; cursor:pointer; margin:6px 0 4px;}

  nav.bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px; background:var(--bg2); border-top:1px solid var(--line); display:flex; z-index:10;}
  nav.bottomnav button{flex:1; background:none; border:none; padding:9px 2px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;}
  nav.bottomnav .navicon{font-size:18px; opacity:0.5;}
  nav.bottomnav .navlab{font-size:9.5px; color:var(--ink-soft); font-weight:600;}
  nav.bottomnav button.active .navicon{opacity:1;}
  nav.bottomnav button.active .navlab{color:var(--teal);}

  .reportbox{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; font-size:12.5px; line-height:1.6; white-space:pre-wrap; margin-top:14px;}
  .reportWatermark{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); opacity:0.07; text-align:center; pointer-events:none; z-index:0; width:100%;}
  .reportWatermark img{width:130px; height:130px; display:block; margin:6px auto;}
  .reportWatermark .wmLine{font-weight:800; font-size:13px; letter-spacing:1.5px; text-transform:uppercase;}
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#000; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:30; opacity:0; transition:opacity 0.25s;}
  .toast.show{opacity:0.92;}
  .fieldnote{font-size:11px; color:var(--ink-soft); margin-top:5px; line-height:1.4;}
  .fotogrid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .fotothumb{position:relative; width:64px; height:64px; border-radius:7px; overflow:hidden; border:1px solid var(--line); flex-shrink:0;}
  .fotothumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .fotoremove{position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.65); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; cursor:pointer; line-height:1; padding:0;}
  .fotoaddbtn{display:inline-block; margin-top:6px; padding:8px 14px; border:1px dashed var(--line); border-radius:7px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;}
  .alertcard{background:#3A2E14; border-left:3px solid var(--amber); padding:10px 12px; border-radius:6px; font-size:12.5px; margin-bottom:8px; color:var(--ink);}
  .alertcard b{display:block; font-size:13px; margin-bottom:2px;}
  .factbtn{padding:9px 12px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink-soft); font-size:12.5px; font-weight:700; cursor:pointer; flex:1;}
  .factbtn.on{background:var(--green-dk); color:#8FD9AA; border-color:var(--green);}
  .facturacionRow{display:flex; gap:8px; margin-top:10px;}
  .placeholder-note{background:var(--card2); border:1px dashed var(--line); border-radius:8px; padding:18px; font-size:13px; color:var(--ink-soft); text-align:center; margin-top:16px;}
</style>
</head>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
// ---------------- FIREBASE ----------------
const firebaseConfig = {
  apiKey: "AIzaSyA46A-OgUjghFBI5KSCQxzTfgSg42egNZY",
  authDomain: "integral-vet-562c9.firebaseapp.com",
  projectId: "integral-vet-562c9",
  storageBucket: "integral-vet-562c9.firebasestorage.app",
  messagingSenderId: "559439940184",
  appId: "1:559439940184:web:b27e177314622401ebd82d"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(err){
  console.warn('No se pudo fijar persistencia de sesión:', err.code);
});
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(function(err){
  console.warn('Persistencia offline no disponible:', err.code);
});

// ---------------- STATE ----------------
let clientes = [];
let trabajos = [];
let eventos = [];
let auth = null;          // {usuario}
let sesionActiva = false;
let view = 'login';
let editingId = null;
let trabajoActual = null;
let historialFiltro = 'todos';
let historialBusqueda = '';
let clienteBusqueda = '';
let clienteContexto = null; // clienteId preseleccionado al iniciar un trabajo
let clienteEstablecimientoContexto = null; // establecimientoId preseleccionado al iniciar un trabajo

const SISTEMAS = ['Respiratorio','Digestivo','Circulatorio','Locomotor','Urogenital','Neurológico','Tegumentario','Sentidos especiales'];
const ANESTESICOS_INDIVIDUALES = ['Acepromazina','Tramadol','Butorfanol','Xilacina','Ketamina','Diazepam','Lidocaína'];
const ANESTESICOS_COMBINACIONES = ['Xilacina + Butorfanol','Ketamina + Xilacina','Ketamina + Diazepam'];
const PODAL_TIPOS = [
  {id:'sobrecrecimiento', lab:'Sobrecrecimiento'},
  {id:'callo', lab:'Callo interdigital'},
  {id:'ulcera', lab:'Úlcera'},
  {id:'dobleSuela', lab:'Doble suela'},
  {id:'otro', lab:'Otro'},
];
const PODAL_MIEMBROS = [
  {id:'AI', lab:'Miembro anterior izquierdo'},
  {id:'AD', lab:'Miembro anterior derecho'},
  {id:'PI', lab:'Miembro posterior izquierdo'},
  {id:'PD', lab:'Miembro posterior derecho'},
];
const PODAL_PROCEDIMIENTOS_FULL = ['Desvasado funcional','Lavaje','Amputación','Cauterización','Colocación de sulfato de cobre','Vendaje','Antibiótico terapia'];
const SANIDAD_CATEGORIAS_BOVINO = ['Toro','Vaca','Vaquillona','Torito','Novillo','Ternero','Ternera'];
const SANIDAD_VACUNAS_BOVINO = ['Complejo respiratorio y queratoconjuntivitis','Clostridiales','Neonatal','Reproductiva','Diarrea viral bovina','Triple','Otra'];
const MUESTRA_TIPOS = [
  {id:'sangre', lab:'Sangre'},
  {id:'orina', lab:'Orina'},
  {id:'materiaFecal', lab:'Materia fecal'},
  {id:'tejido', lab:'Tejido'},
  {id:'exudado', lab:'Exudado'},
  {id:'medulaOsea', lab:'Médula ósea'},
  {id:'liquidoCefalorraquideo', lab:'Líquido cefalorraquídeo'},
  {id:'otro', lab:'Otro'},
];
const MUESTRA_ANALISIS_VENOPUNCION = ['Hemograma completo','Proteínas totales','Urea/Creatinina','Perfil hepático','Perfil renal','Ácidos grasos','Triglicéridos','Glucemia','Hemocultivo','Perfil de rendimiento','Minerales','Enfermedades venéreas','Bilirrubina','Otros'];
const MUESTRA_MINERALES = ['Calcio','Fósforo','Magnesio','Hierro','Cobre','Selenio','Otro'];
const MUESTRA_VENEREAS = ['P.I. común','Brucela','Neospora','Otro'];
const MUESTRA_ANALISIS_ORINA = ['Células','Sedimento','Cultivo','Glucosa','Cuerpos cetónicos','Pigmento','Otro'];
const MUESTRA_TECNICAS = {
  sangre: ['Venopunción','Punción'],
  orina: ['Sondaje','Punción'],
  materiaFecal: ['Directa','Indirecta'],
  tejido: ['Biopsia','Contacto','Hisopado','PAF','PAAF'],
  exudado: ['Contacto','Hisopado'],
  medulaOsea: ['Punción','Aspiración'],
  liquidoCefalorraquideo: ['Punción'],
};
const SISTEMA_ICONOS = {'Respiratorio':'🫁','Digestivo':'🍽️','Circulatorio':'🫀','Locomotor':'🦴','Urogenital':'💧','Neurológico':'🧠','Tegumentario':'🩹','Sentidos especiales':'👁️'};
function iconoSistema(s){
  if(s==='Digestivo'){
    const esp = trabajoActual ? trabajoActual.especie : null;
    if(esp==='Canino'||esp==='Felino') return '🍖';
    if(esp==='Equino'||esp==='Bovino') return '🌿';
    return '🌿';
  }
  return SISTEMA_ICONOS[s];
}
const COMPLEMENTARIO_ICONOS = {radiografia:'🩻', ecografia:'📡', sangrado:'🩸', sangradoMasivo:'🩸🩸', otros:'➕', otro:'➕', datosAnimal:'📋'};
const VACUNAS = [
  {key:'adenitis', label:'Adenitis', dias:365, tipo:'vacuna'},
  {key:'influenza', label:'Influenza', dias:90, tipo:'vacuna'},
  {key:'encefalomielitis', label:'Encefalomielitis', dias:365, tipo:'vacuna'},
  {key:'rabia', label:'Rabia', dias:365, tipo:'vacuna'},
  {key:'antitetanica', label:'Antitetánica', dias:365, tipo:'vacuna'},
  {key:'aie', label:'AIE (Anemia Infecciosa Equina)', dias:60, tipo:'análisis'},
];

// ---------------- STORAGE (Firebase, offline-first) ----------------
let unsubClientes = null;
let unsubTrabajos = null;
let unsubEventos = null;

function attachListeners(){
  if(unsubClientes) unsubClientes();
  if(unsubTrabajos) unsubTrabajos();
  if(unsubEventos) unsubEventos();
  unsubClientes = db.collection('clientes').onSnapshot(function(snap){
    clientes = snap.docs.map(function(d){ return d.data(); });
    if(sesionActiva) render();
  }, function(err){ console.error('Error sincronizando clientes', err); });
  unsubTrabajos = db.collection('trabajos').onSnapshot(function(snap){
    trabajos = snap.docs.map(function(d){ return d.data(); });
    if(sesionActiva) render();
  }, function(err){ console.error('Error sincronizando trabajos', err); });
  unsubEventos = db.collection('eventos').onSnapshot(function(snap){
    eventos = snap.docs.map(function(d){ return d.data(); });
    if(sesionActiva) render();
  }, function(err){ console.error('Error sincronizando eventos', err); });
}
function detachListeners(){
  if(unsubClientes){ unsubClientes(); unsubClientes=null; }
  if(unsubTrabajos){ unsubTrabajos(); unsubTrabajos=null; }
  if(unsubEventos){ unsubEventos(); unsubEventos=null; }
}
function saveClienteDoc(c){ db.collection('clientes').doc(c.id).set(c).catch(function(err){ console.error(err); }); }
function deleteClienteDoc(id){ db.collection('clientes').doc(id).delete().catch(function(err){ console.error(err); }); }
function saveTrabajoDoc(t){ db.collection('trabajos').doc(t.id).set(t).catch(function(err){ console.error(err); showToast('No se pudo guardar (¿informe muy pesado en fotos?)'); }); }
function updateTrabajoDoc(id, campos){ db.collection('trabajos').doc(id).update(campos).catch(function(err){ console.error(err); }); }
function deleteTrabajoDoc(id){ db.collection('trabajos').doc(id).delete().catch(function(err){ console.error(err); }); }
function saveEventoDoc(e){ db.collection('eventos').doc(e.id).set(e).catch(function(err){ console.error(err); }); }
function deleteEventoDoc(id){ db.collection('eventos').doc(id).delete().catch(function(err){ console.error(err); }); }

window.addEventListener('online', function(){ showToast('Conectado — sincronizando cambios'); });
window.addEventListener('offline', function(){ showToast('Sin conexión — los cambios se guardan en el dispositivo'); });

// ---------------- HELPERS ----------------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function fmtFecha(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function sumarDias(iso, dias){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+dias); return d.toISOString().slice(0,10); }
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ---------------- FOTOS (genérico, se usa en cualquier campo de texto) ----------------
function leerFotoInput(inputEl, callback){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxAncho = 900;
      const escala = Math.min(1, maxAncho / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * escala;
      canvas.height = img.height * escala;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.6));
      inputEl.value = '';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function agregarFotoA(path, dataUrl){
  let obj = trabajoActual;
  for(let i=0;i<path.length-1;i++){ if(!obj[path[i]]) obj[path[i]]={}; obj=obj[path[i]]; }
  const key = path[path.length-1];
  if(!obj[key] || typeof obj[key]!=='object') obj[key] = {texto:'', fotos:[]};
  if(!obj[key].fotos) obj[key].fotos=[];
  obj[key].fotos.push(dataUrl);
}
function quitarFotoDe(path, idx){
  let obj = trabajoActual;
  for(let i=0;i<path.length-1;i++){ obj=obj[path[i]]; }
  const key = path[path.length-1];
  if(obj[key] && obj[key].fotos) obj[key].fotos.splice(idx,1);
  render();
}
function fotosBlock(fotos, path){
  const pathLiteral = `[${path.map(p=>`'${p}'`).join(',')}]`;
  const inputId = 'fotoinput_' + path.join('_').replace(/[^a-zA-Z0-9_]/g,'');
  return `
    <div class="fotogrid">
      ${(fotos||[]).map((f,i)=>`<div class="fotothumb"><img src="${f}"><button class="fotoremove" onclick="quitarFotoDe(${pathLiteral}, ${i})">✕</button></div>`).join('')}
    </div>
    <label class="fotoaddbtn" for="${inputId}">📷 Agregar foto</label>
    <input type="file" accept="image/*" id="${inputId}" style="display:none" onchange="leerFotoInput(this, (data)=>{ agregarFotoA(${pathLiteral}, data); render(); })">
  `;
}

function establecimientoNombreDe(clienteId, establecimientoId){

function recordatoriosVacunasMasivas(){
  const out = [];
  trabajos.forEach(t=>{
    if(t.especie==='Bovino' && t.sanidad && t.sanidad.masivo && t.sanidad.masivo.vacunacion && t.sanidad.masivo.vacunacion.grupos){
      t.sanidad.masivo.vacunacion.grupos.forEach((g,gi)=>{
        if(g.repetir && !g.repetirHecho){
          out.push({trabajoId:t.id, grupoIndex:gi, clienteId:t.clienteId, establecimientoId:t.establecimientoId, fecha:t.fechaInicio, vacuna:labelVacunaGrupo(g), repetir:g.repetir, animales:g.animales.length});
        }
      });
    }
  });
  out.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  return out;
}
function marcarRecordatorioVacunaHecho(trabajoId, grupoIndex){
  const t = trabajos.find(x=>x.id===trabajoId);
  if(!t) return;
  t.sanidad.masivo.vacunacion.grupos[grupoIndex].repetirHecho = true;
  saveTrabajoDoc(t);
  render();
}
function proximasVacunas(){
  const hoy = hoyISO();
  const limite = sumarDias(hoy, 2);
  const resultado = [];
  trabajos.forEach(t=>{
    if(t.especie==='Equino' && t.sanidad){
      VACUNAS.forEach(v=>{
        const d = t.sanidad[v.key];
        if(d && d.proxima && d.proxima>=hoy && d.proxima<=limite){
          resultado.push({clienteId:t.clienteId, label:v.label, fecha:d.proxima, paciente:(t.datosPaciente&&t.datosPaciente.nombre)||''});
        }
      });
    }
    if((t.especie==='Canino'||t.especie==='Felino') && t.sanidad && t.sanidad.vacuna && typeof t.sanidad.vacuna==='object'){
      const lista = listaVacunasPara(t.especie) || [];
      lista.forEach(v=>{
        const d = t.sanidad.vacuna[v.key];
        if(d && d.proxima && d.proxima>=hoy && d.proxima<=limite){
          resultado.push({clienteId:t.clienteId, label:v.label, fecha:d.proxima, paciente:(t.informacionGeneral&&t.informacionGeneral.paciente&&t.informacionGeneral.paciente.nombre)||''});
        }
      });
    }
  });
  resultado.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return resultado;
}
function recordatoriosCalendario(){
  const hoy = hoyISO();
  const limite = sumarDias(hoy, 2);
  return eventos.filter(e=>e.fecha && e.fecha>=hoy && e.fecha<=limite).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

function guardarCliente(irANuevoTrabajo){
  const data = {
    nombre: document.getElementById('f_nombre').value.trim(),
    apellido: document.getElementById('f_apellido').value.trim(),
    telefono: document.getElementById('f_telefono').value.trim(),
    establecimientos: window._establecimientosTmp,
  };
  let id = editingId;
  let clienteFinal;
  if(editingId){
    clienteFinal = Object.assign(clienteById(editingId), data);
  } else {
    id = uid();
    clienteFinal = {id, ...data};
    clientes.push(clienteFinal);
  }
  saveClienteDoc(clienteFinal);
  showToast('Cliente guardado');
  if(irANuevoTrabajo){ clienteContexto = id; clienteEstablecimientoContexto=null; editingId=null; navigate('nuevoTrabajoEspecie'); }
  else { editingId=id; navigate('clientePerfil'); }
}
function eliminarCliente(id){
  if(!confirm('¿Eliminar este cliente? Los trabajos registrados se conservan.')) return;
  clientes = clientes.filter(c=>c.id!==id);
  deleteClienteDoc(id);
  navigate('clientes');
}

function hasData(obj){
  if(!obj) return false;
  if(typeof obj === 'string') return obj.trim().length>0;
  if(Array.isArray(obj)) return obj.length>0;
  if(typeof obj === 'object') return Object.values(obj).some(v=>hasData(v));
  return !!obj;
}

function botonesGuardar(saveFn, cancelFnName){
  const cancel = cancelFnName || 'cancelarCategorias';
  return `
    <div style="margin-top:22px; display:flex; flex-direction:column; gap:10px;">
      <button class="btn btn-amber" onclick="confirmarAccionGuardado('${saveFn}','parcial','${cancel}')">Guardar informe parcial</button>

      <button class="btn btn-danger" onclick="confirmarAccionGuardado('${saveFn}','salir','${cancel}')">Salir sin guardar</button>
    </div>`;
}
function confirmarAccionGuardado(fnName, accion, cancelFnName){
  const mensajes = {
    parcial: '¿Guardar este informe como parcial? Vas a poder seguir editándolo después.',
    finalizado: '¿Confirmás que finalizaste? Se va a cerrar este trabajo.',
    salir: '¿Salir sin guardar los cambios de esta pantalla?'
  };
  if(!confirm(mensajes[accion])) return;
  if(accion==='salir'){
    window[cancelFnName]();
  } else {
    window[fnName](accion);
  }
}

// --- Toma de muestra (compartido entre especies) ---
let muestraContexto = null; // 'equino'|'bovino'|'mascota'
let muestraStep = null; // 'tipos'|'config'|'modo'|'datos'|'observaciones'
let muestraConfigTipo = null;
function iniciarTomaMuestra(contexto, targetKey){
  muestraContexto = contexto;
  const ex = trabajoActual.examenesComplementarios;
  if(!ex[targetKey]) ex[targetKey] = {tipos:[], detalle:{}, modo:null, individual:{}, masivo:{animales:[]}, observaciones:''};
  window._muestraTargetKey = targetKey;
  muestraStep = 'tipos';
  render();
}
function muestraObjetoActual(){ return trabajoActual.examenesComplementarios[window._muestraTargetKey]; }
function volverDesdeMuestra(){
  const volverA = muestraContexto;
  muestraStep = null; muestraContexto = null; muestraConfigTipo=null;
  if(volverA==='equino') navigate('equino-complementarios');
  else if(volverA==='bovino') render();
  else render();
}
function catTomaMuestra(){
  const tm = muestraObjetoActual();
  if(muestraStep==='tipos') return muestraPasoTipos(tm);
  if(muestraStep==='config') return muestraPasoConfig(tm);
  if(muestraStep==='modo') return muestraPasoModo(tm);
  if(muestraStep==='datos') return muestraPasoDatos(tm);
  if(muestraStep==='observaciones') return muestraPasoObservaciones(tm);
  return '';
}
function toggleMuestraTipo(id){
  const tm = muestraObjetoActual();
  const i = tm.tipos.indexOf(id);
  if(i>=0) tm.tipos.splice(i,1); else tm.tipos.push(id);

function resumenTomaMuestra(tm){
  if(!tm || !tm.tipos || !tm.tipos.length) return '';
  let out = `  Toma de muestra:\n`;
  tm.tipos.forEach(tipoId=>{
    const lab = MUESTRA_TIPOS.find(t=>t.id===tipoId).lab;
    const d = tm.detalle[tipoId] || {};
    if(tipoId==='otro'){
      if(d.texto) out += `    Otro: ${d.texto}\n`;
      return;
    }
    let linea = `    ${lab}`;
    if(d.tecnica) linea += ` (${d.tecnica})`;
    out += linea+'\n';
    if(tipoId==='sangre'){
      if(d.tecnica==='Punción') out += `      Análisis: Frotis\n`;
      else if(d.analisis && d.analisis.length){
        out += `      Análisis: ${d.analisis.map(a=> a==='Otros'&&d.otroTexto ? `Otros: ${d.otroTexto}` : a).join(', ')}\n`;
        if(d.minerales && d.minerales.length) out += `      Minerales: ${d.minerales.join(', ')}\n`;
        if(d.venereas && d.venereas.length) out += `      Enfermedades venéreas: ${d.venereas.join(', ')}\n`;
      }
    } else if(tipoId==='orina' || tipoId==='materiaFecal' || tipoId==='medulaOsea'){
      if(d.analisis && d.analisis.length){
        out += `      Análisis: ${d.analisis.map(a=> (a==='Otro'||a==='Otros')&&d.otroTexto ? `${a}: ${d.otroTexto}` : a).join(', ')}\n`;
      }
    } else if(d.texto){
      out += `      ${d.texto}\n`;
    }
  });
  if(tm.modo==='individual' && tm.individual && hasData(tm.individual)){
    const ind = tm.individual;
    const idCampo = ind.caravana!==undefined ? `Caravana ${ind.caravana||'—'}` : `Nombre ${ind.nombre||'—'}`;
    out += `    Paciente: ${idCampo} · ${ind.raza||''} · ${ind.pelaje||''} · ${ind.sexo||''} · ${ind.edad||''}\n`;
  } else if(tm.modo==='masivo' && tm.masivo && tm.masivo.animales && tm.masivo.animales.length){
    out += `    Animales (${tm.masivo.animales.length}):\n`;
    tm.masivo.animales.forEach(a=>{
      if(a.caravana!==undefined) out += `      ${a.caravana}\n`;
      else out += `      ${a.nombre} · ${a.raza||''} · ${a.pelaje||''} · ${a.sexo||''} · ${a.edad||''}\n`;
    });
  }
  if(tm.observaciones) out += `    Observaciones: ${tm.observaciones}\n`;
  return out;
}

// --- Seguimiento de cirugía ---
let seguimientoCirugiaActivo = false;
let seguimientoFiltroFecha = '';
function listarCirugiasCliente(clienteId){
  const out = [];
  trabajos.forEach(t=>{
    if(t.clienteId!==clienteId) return;
    const pq = t.procedimientosQuirurgicos;
    if(!pq || !hasData(pq)) return;
    const animalIdGenerico = (t.datosPaciente&&t.datosPaciente.nombre) || (t.informacionGeneral&&t.informacionGeneral.paciente&&t.informacionGeneral.paciente.nombre) || '';
    Object.entries(pq).forEach(([k,v])=>{
      if(k==='patologiasPodales' && v && v.animales){
        v.animales.forEach((a,ai)=>{
          if(!a.hallazgos || !a.hallazgos.length) return;
          out.push({
            trabajoId:t.id, fecha:t.fechaInicio, especie:t.especie,
            sistema:'Locomotor (patologías podales)', animalId:a.caravana,
            alta: a.seguimiento ? a.seguimiento.alta : null, nota: a.seguimiento ? a.seguimiento.nota : '',
            tipo:'podal', animalIndex: ai
          });
        });
        return;
      }
      if(CLAVES_NO_SISTEMA_QX.includes(k)) return;
      if(!v || !v.texto) return;
      out.push({
        trabajoId:t.id, fecha:t.fechaInicio, especie:t.especie,
        sistema:k, animalId: v.caravana || animalIdGenerico,
        alta: v.seguimiento ? v.seguimiento.alta : null, nota: v.seguimiento ? v.seguimiento.nota : '',
        tipo:'sistema', sistemaKey:k
      });
    });
  });
  out.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return out;
}
function getSeguimientoObj(t, tipo, key){
  if(tipo==='podal'){
    const a = t.procedimientosQuirurgicos.patologiasPodales.animales[key];
    if(!a.seguimiento) a.seguimiento = {alta:null, nota:''};
    return a.seguimiento;
  }
  const v = t.procedimientosQuirurgicos[key];
  if(!v.seguimiento) v.seguimiento = {alta:null, nota:''};
  return v.seguimiento;
}
function marcarSeguimientoCirugia(trabajoId, tipo, key, alta){
  const t = trabajos.find(x=>x.id===trabajoId);
  if(!t) return;
  const seg = getSeguimientoObj(t, tipo, key);
  seg.alta = alta;
  saveTrabajoDoc(t);
  render();
}
function actualizarNotaSeguimiento(trabajoId, tipo, key, valor){
  const t = trabajos.find(x=>x.id===trabajoId);
  if(!t) return;
  const seg = getSeguimientoObj(t, tipo, key);
  seg.nota = valor;
  saveTrabajoDoc(t);
}
function catSeguimientoCirugia(volverJS){
  const clienteId = trabajoActual.clienteId;
  if(!clienteId){
    return `
      <button class="backbtn" onclick="${volverJS}">‹ Procedimientos quirúrgicos</button>
      <div class="sectiontitle">Seguimiento de cirugía</div>
      <div class="fieldnote">Este trabajo no tiene un cliente asociado, así que no hay historial de cirugías previas para mostrar.</div>
    `;
  }
  let cirugias = listarCirugiasCliente(clienteId);
  if(seguimientoFiltroFecha) cirugias = cirugias.filter(c=>c.fecha && c.fecha>=seguimientoFiltroFecha);
  return `
    <button class="backbtn" onclick="${volverJS}">‹ Procedimientos quirúrgicos</button>
    <div class="sectiontitle">Seguimiento de cirugía</div>
    <label>Filtrar desde fecha (opcional)</label>
    <input type="date" value="${seguimientoFiltroFecha}" onchange="seguimientoFiltroFecha=this.value; render()">
    ${cirugias.length ? cirugias.map(c=>{
      const keyLit = c.tipo==='podal' ? c.animalIndex : `'${c.sistemaKey}'`;
      return `
      <div class="listcard" style="cursor:default;">
        <div class="top"><div class="name">${escapeHtml(c.sistema)}</div><div class="date">${fmtFecha(c.fecha)}</div></div>
        <div class="meta">${c.animalId?escapeHtml(c.animalId):'Sin identificar'} · ${c.especie}</div>
        <div class="optrow" style="margin-top:8px;">
          <div class="optbtn ${c.alta===true?'selected':''}" onclick="marcarSeguimientoCirugia('${c.trabajoId}','${c.tipo}',${keyLit},true)">Alta</div>
          <div class="optbtn ${c.alta===false?'selected':''}" onclick="marcarSeguimientoCirugia('${c.trabajoId}','${c.tipo}',${keyLit},false)">Baja</div>
        </div>
        <input type="text" placeholder="Otro / motivo (opcional)" value="${escapeHtml(c.nota||'')}" style="margin-top:8px;" onchange="actualizarNotaSeguimiento('${c.trabajoId}','${c.tipo}',${keyLit}, this.value)">
      </div>`;
    }).join('') : '<div class="fieldnote">Este cliente no tiene cirugías previas registradas.</div>'}
  `;
}

let locomotorMenuBovino = false;

let podalAnimalActivo = null;
let podalWizard = null;
function agregarAnimalPodal(){
  const val = document.getElementById('podal_nueva_caravana').value.trim();

function iniciarPodalWizard(tipo){
  podalWizard = {tipo, step: tipo==='otro' ? 'otro' : 'miembros', miembros:[], procedimientos:[], otroTexto:''};
  render();
}
function confirmarPodalOtroTexto(){
  podalWizard.otroTexto = document.getElementById('podal_otro_texto').value.trim();
  podalWizard.step = 'miembros';
  render();
}
function togglePodalMiembro(id){
  const arr = podalWizard.miembros;
  const i = arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else arr.push(id);
  render();
}
function avanzarPodalProcedimiento(){
  if(!podalWizard.miembros.length) return;
  podalWizard.step = 'procedimientos';
  render();
}
function togglePodalProcedimiento(p){
  const arr = podalWizard.procedimientos;

  if(i>=0) arr.splice(i,1); else arr.push(p);
  render();
}
function guardarPodalHallazgo(procedimientos){
  const q = trabajoActual.procedimientosQuirurgicos;
  const animal = q.patologiasPodales.animales.find(a=>a.caravana===podalAnimalActivo);
  animal.hallazgos.push({tipo: podalWizard.tipo, otroTexto: podalWizard.otroTexto, miembros: podalWizard.miembros.slice(), procedimientos: procedimientos.slice()});

function quitarHallazgoPodal(i){

function catPodalWizard(){

function catPodalAnimal(){
  const q = trabajoActual.procedimientosQuirurgicos || {};

      ${animal.hallazgos.map((h,i)=>{
        const lab = PODAL_TIPOS.find(t=>t.id===h.tipo).lab + (h.tipo==='otro'&&h.otroTexto ? ' — '+escapeHtml(h.otroTexto) : '');
        const miembros = h.miembros.map(m=>PODAL_MIEMBROS.find(x=>x.id===m).lab).join(', ');
        return `<div class="listcard">
          <div class="meta"><b>${lab}</b><br>${miembros}<br>Procedimiento: ${h.procedimientos.join(', ')}</div>
          <button class="removeanimal" onclick="quitarHallazgoPodal(${i})">✕</button>
        </div>`;
      }).join('')}
    ` : ''}
    <button class="btn btn-teal" style="margin-top:16px;" onclick="podalAnimalActivo=null; render()">Listo, volver</button>
  `;
}
function catPatologiasPodales(){
  const q = trabajoActual.procedimientosQuirurgicos || {};
  const pp = q.patologiasPodales || {animales:[]};
  if(podalAnimalActivo) return catPodalAnimal();
  return `
    <button class="backbtn" onclick="patologiasPodalesActivo=false; render()">‹ Aparato locomotor</button>
    <div class="sectiontitle">Patologías podales</div>
    <label>Identificación / caravana del animal</label>
    <input type="text" id="podal_nueva_caravana" placeholder="Ej: 245">
    <button class="btn btn-teal" style="margin-top:10px;" onclick="agregarAnimalPodal()">+ Agregar animal</button>
    <div class="sublist" style="margin-top:16px;">
      ${(pp.animales||[]).map(a=>`
        <div class="subtile" onclick="podalAnimalActivo='${a.caravana}'; render()">
          <span>🐄 Caravana ${escapeHtml(a.caravana)}</span>
          <span class="check">${a.hallazgos.length} hallazgo${a.hallazgos.length===1?'':'s'}</span>
        </div>`).join('') || '<div class="fieldnote">Todavía no agregaste animales.</div>'}
    </div>
  `;
}
function resumenPatologiasPodales(pq){
  const pp = pq && pq.patologiasPodales;
  if(!pp || !pp.animales || !pp.animales.length) return '';
  let out = `  Patologías podales:\n`;
  pp.animales.forEach(a=>{
    if(!a.hallazgos.length) return;
    out += `    Caravana ${a.caravana}:\n`;
    a.hallazgos.forEach(h=>{
      const lab = PODAL_TIPOS.find(t=>t.id===h.tipo).lab + (h.tipo==='otro'&&h.otroTexto ? ` (${h.otroTexto})` : '');
      const miembros = h.miembros.map(m=>PODAL_MIEMBROS.find(x=>x.id===m).lab).join(', ');
      out += `      ${lab} — ${miembros} — Procedimiento: ${h.procedimientos.join(', ')}\n`;
    });
  });
  return out;
}

let vacMasivaWizard = null; // {step:'vacunas'|'animales'|'final', vacunas:[], otraTexto:'', animales:[{caravana,categoria}], dosis:'', repetir:''}

  vacMasivaWizard = {step:'vacunas', vacunas:[], otraTexto:'', animales:[], dosis:'', repetir:''};
  render();
}
function toggleVacMasivaVacuna(v){
  const arr = vacMasivaWizard.vacunas;
  const i = arr.indexOf(v);
  if(i>=0) arr.splice(i,1); else arr.push(v);
  render();
}
function avanzarVacMasivaAnimales(){
  if(!vacMasivaWizard.vacunas.length) return;
  if(vacMasivaWizard.vacunas.includes('Otra')){

  render();

function agregarAnimalVacMasiva(categoria){
  const input = document.getElementById('vacm_caravana_input');
  const val = input ? input.value.trim() : '';
  if(!val) return;
  vacMasivaWizard.animales.push({caravana: val, categoria});
  render();
  setTimeout(()=>{ const el=document.getElementById('vacm_caravana_input'); if(el){ el.value=''; el.focus(); } }, 0);
}
function quitarAnimalVacMasiva(i){
  vacMasivaWizard.animales.splice(i,1);
  render();
}
function avanzarVacMasivaFinal(){
  if(!vacMasivaWizard.animales.length) return;
  vacMasivaWizard.step = 'final';
  render();
}
function guardarGrupoVacMasiva(){
  const dosis = document.getElementById('vacm_dosis').value.trim();
  const repetir = document.getElementById('vacm_repetir').value.trim();
  if(!trabajoActual.sanidad) trabajoActual.sanidad = {individual:{},masivo:{}};

  trabajoActual.sanidad.masivo.vacunacion.grupos.push({

  vacMasivaWizard = null;

}

  trabajoActual.sanidad.masivo.vacunacion.grupos.splice(i,1);

}

function catSanidadBovino(){
  const s = trabajoActual.sanidad || {individual:{vacunacion:'',desparasitacion:'',otra:''}, masivo:{vacunacion:{grupos:[]},desparasitacion:{filas:[],observaciones:''},otra:{filas:[],observaciones:''}}};
  const labels={vacunacion:'Vacunación',desparasitacion:'Desparasitación',otra:'Otra'};
  if(sanidadModoBovino && sanidadTipoBovino){
    if(sanidadModoBovino==='individual'){
      const dato = (s.individual||{})[sanidadTipoBovino] || {texto:'', fotos:[]};
      return `
        <button class="backbtn" onclick="sanidadTipoBovino=null; render()">‹ Individual</button>

        <textarea id="san_ind_texto" placeholder="Qué se hizo...">${escapeHtml(dato.texto||'')}</textarea>

        <button class="btn btn-teal" style="margin-top:16px;" onclick="guardarSanidadIndividualBovino()">Listo, volver</button>
      `;
    } else {
      if(sanidadTipoBovino==='vacunacion'){
        return catVacunacionMasivaBovino();
      }
      const grupo = (s.masivo||{})[sanidadTipoBovino] || {filas:[],observaciones:''};
      window._sanMasivoTmp = grupo.filas && grupo.filas.length ? JSON.parse(JSON.stringify(grupo.filas)) : [{caravana:'',producto:'',dosis:'',repetir:''}];
      return `
        <button class="backbtn" onclick="sanidadTipoBovino=null; render()">‹ Masivo</button>
        <div class="sectiontitle">${labels[sanidadTipoBovino]} (masivo)</div>
        <div id="sanMasivoList"></div>

        <button class="btn btn-teal" onclick="guardarSanidadMasivaBovinoTipo()">Listo, volver</button>
      `;
    }
  }
  if(sanidadModoBovino && !sanidadTipoBovino){
    return `
      <button class="backbtn" onclick="sanidadModoBovino=null; render()">‹ Sanidad</button>
      <div class="sectiontitle">${sanidadModoBovino==='individual'?'Individual':'Masivo'}</div>
      <div class="sublist">
        <div class="subtile" onclick="sanidadTipoBovino='vacunacion'; render()"><span>Vacunación</span></div>
        <div class="subtile" onclick="sanidadTipoBovino='desparasitacion'; render()"><span>Desparasitación</span></div>
        <div class="subtile" onclick="sanidadTipoBovino='otra'; render()"><span>Otra</span></div>
      </div>
    `;
  }
  return `
    <button class="backbtn" onclick="volverACategorias()">‹ Categorías</button>
    <div class="sectiontitle">Sanidad</div>
    <div class="sublist">
      <div class="subtile" onclick="sanidadModoBovino='individual'; render()"><span>Individual</span></div>
      <div class="subtile" onclick="sanidadModoBovino='masivo'; render()"><span>Masivo</span></div>
    </div>
    ${botonGuardarSimple('guardarSanidadBovinoFinal')}
  `;
}

  if(!trabajoActual.sanidad.individual) trabajoActual.sanidad.individual={};

function guardarSanidadMasivaBovinoTipo(){

function resumenTrabajoMascota(t){
  let out = `Especie: ${t.especie}\n`;
  const g = t.informacionGeneral;
  if(g && hasData(g)){
    const p = g.propietario||{}, pa = g.paciente||{};
    out += `\nPropietario: ${[p.nombre,p.apellido].filter(Boolean).join(' ')||'—'}${p.telefono?' · '+p.telefono:''}${p.direccion?' · '+p.direccion:''}\n`;
    out += `Paciente: ${pa.nombre||'—'} · ${pa.raza||''} · ${pa.sexo||''} · ${pa.edad||''}\n`;
  }
  if(t.exploracionClinica && hasData(t.exploracionClinica)){
    out += `\nExploración clínica:\n`;
    if(t.exploracionClinica.estadoGeneral) out += `  Estado general: ${t.exploracionClinica.estadoGeneral}\n`;
    if(t.exploracionClinica.condicionCorporal) out += `  Condición corporal: ${t.exploracionClinica.condicionCorporal}\n`;
    if(t.exploracionClinica.temperatura) out += `  Temperatura: ${t.exploracionClinica.temperatura}\n`;
    Object.entries(t.exploracionClinica.examenClinico||{}).forEach(([k,v])=>{ if(hasData(v)) out += `  Sistema explorado: ${k}\n    Comentario: ${campoResumen(v)}\n`; });
  }
  if(t.examenesComplementarios && hasData(t.examenesComplementarios)){
    out += `\nExámenes complementarios:\n`;
    const etiquetasCompM = {radiografia:'radiografía', ecografia:'ecografía', sangrado:'análisis de sangre', otros:'otros'};
    Object.entries(t.examenesComplementarios).filter(([k])=>k!=='tomaMuestra').forEach(([k,v])=>{ if(hasData(v)) out += `  ${etiquetasCompM[k]||k}: ${campoResumen(v)}\n`; });
    out += resumenTomaMuestra(t.examenesComplementarios.tomaMuestra);
  }
  if(t.procedimientosQuirurgicos && hasData(t.procedimientosQuirurgicos)){
    out += `\nProcedimientos quirúrgicos:\n`;
    out += resumenProtocoloAnestesico(t.procedimientosQuirurgicos);
    Object.entries(t.procedimientosQuirurgicos).filter(([k])=>!CLAVES_NO_SISTEMA_QX.includes(k)).forEach(([k,v])=>{ if(hasData(v)) out += `  Sistema intervenido: ${k}\n    Qué se hizo: ${campoResumen(v)}\n`; });
  }
  if(t.sanidad && hasData(t.sanidad)){
    out += `\nSanidad:\n`;
    const lista = listaVacunasPara(t.especie);
    if(lista && t.sanidad.vacuna && typeof t.sanidad.vacuna==='object'){
      lista.forEach(v=>{ if(t.sanidad.vacuna[v.key]) out += `  ${v.label}: aplicada ${fmtFecha(t.sanidad.vacuna[v.key].fecha)}, próxima ${fmtFecha(t.sanidad.vacuna[v.key].proxima)}${t.sanidad.vacuna[v.key].observaciones?' — '+t.sanidad.vacuna[v.key].observaciones:''}\n`; });
    } else if(hasData(t.sanidad.vacuna)) out += `  Vacuna: ${campoResumen(t.sanidad.vacuna)}\n`;
    if(hasData(t.sanidad.desparasitaciones)) out += `  Desparasitaciones: ${campoResumen(t.sanidad.desparasitaciones)}\n`;
    if(hasData(t.sanidad.otros)) out += `  Otros: ${campoResumen(t.sanidad.otros)}\n`;
  }
  if(hasData(t.tratamientos)) out += `\nTratamientos: ${campoResumen(t.tratamientos)}\n`;
  out += resumenNecropsia(t.necropsia);
  out += resumenNutricion(t.nutricion);
  if(hasData(t.otroProcedimiento)) out += `\nOtros procedimientos: ${campoResumen(t.otroProcedimiento)}\n`;
  if(hasData(t.observacionesFinales)) out += `\nObservaciones: ${campoResumen(t.observacionesFinales)}\n`;
  return out;
}

function statsReproductivas(trabs){
  let out = '';
  const diag = {pren:0, vac:0, total:0};
  let preservicioTotal=0, gdr1=0, gdr2=0;
  const andrologicos = [];
  trabs.forEach(t=>{
    if(t.especie!=='Bovino') return;
    const r = t.exploracionReproductiva;
    if(r && r.diagnosticoGestacion && r.diagnosticoGestacion.registros){
      r.diagnosticoGestacion.registros.forEach(reg=>{
        diag.total++;
        if(reg.resultado==='Preñada') diag.pren++;
        else if(reg.resultado==='Vacía') diag.vac++;
      });
    }
    if(r && r.preservicio && r.preservicio.registros){
      r.preservicio.registros.forEach(reg=>{
        preservicioTotal++;
        if(reg.gdr===1) gdr1++;
        if(reg.gdr===2) gdr2++;
      });
    }
    if(t.examenAndrologico && hasData(t.examenAndrologico)){
      const a = t.examenAndrologico;
      andrologicos.push(`${fmtFecha(t.fechaInicio)} — Caravana ${a.caravana||'—'}: locomotor ${a.locomotor||'—'}, visión ${a.vision||'—'}, tono testicular ${a.tonoTesticular||'—'}`);
    }
  });
  if(diag.total) out += `Diagnóstico de gestación:\n  ${diag.total} animales evaluados — ${diag.pren} preñadas, ${diag.vac} vacías\n\n`;
  if(preservicioTotal) out += `Preservicio:\n  ${preservicioTotal} animales evaluados — GDR1: ${gdr1}, GDR2: ${gdr2}\n\n`;
  if(andrologicos.length) out += `Examen andrológico (${andrologicos.length} toros evaluados):\n` + andrologicos.map(a=>'  '+a).join('\n') + '\n';
  return out.trim();
}
function statsQuirurgicas(trabs){
  let out = '';
  let cirugias = [];
  trabs.forEach(t=>{
    const pq = t.procedimientosQuirurgicos;
    if(!pq || !hasData(pq)) return;
    Object.entries(pq).forEach(([k,v])=>{
      if(k==='patologiasPodales' && v && v.animales){
        v.animales.forEach(a=>{
          if(a.hallazgos && a.hallazgos.length){
            cirugias.push({fecha:t.fechaInicio, sistema:'Locomotor (podal)', animal:a.caravana, alta: a.seguimiento?a.seguimiento.alta:null});
          }
        });
        return;
      }
      if(CLAVES_NO_SISTEMA_QX.includes(k)) return;
      if(!v || !v.texto) return;
      cirugias.push({fecha:t.fechaInicio, sistema:k, animal: v.caravana||'', alta: v.seguimiento?v.seguimiento.alta:null});
    });
  });
  if(!cirugias.length) return '';
  out += `Procedimientos quirúrgicos (${cirugias.length}):\n`;
  cirugias.forEach(c=>{
    out += `  ${fmtFecha(c.fecha)} — ${c.sistema}${c.animal?' ('+c.animal+')':''}${c.alta===true?' — Alta':c.alta===false?' — Baja':''}\n`;
  });
  const conSeguimiento = cirugias.filter(c=>c.alta===true || c.alta===false);
  if(conSeguimiento.length){
    const altas = conSeguimiento.filter(c=>c.alta===true).length;
    const pct = Math.round((altas/conSeguimiento.length)*100);
    out += `\n% de éxito (sobre ${conSeguimiento.length} con seguimiento cargado): ${pct}% (${altas} altas)\n`;
  }
  return out.trim();
}
function statsSanitarias(trabs){
  let out = '';
  trabs.forEach(t=>{
    if(t.sanidad && hasData(t.sanidad)){
      out += `${fmtFecha(t.fechaInicio)} — Sanidad:\n`;
      if(t.sanidad.individual) Object.entries(t.sanidad.individual).forEach(([k,v])=>{ if(hasData(v)) out += `    Individual - ${k}: ${campoResumen(v)}\n`; });
      if(t.sanidad.masivo) Object.entries(t.sanidad.masivo).forEach(([k,v])=>{
        if(k==='vacunacion' && v && v.grupos && v.grupos.length){
          v.grupos.forEach(g=>{ out += `    Vacuna: ${labelVacunaGrupo(g)} — ${g.animales.length} animales\n`; });
        } else if(v && v.filas && v.filas.length){
          out += `    Masivo - ${k}: ${v.filas.length} animales\n`;
        }
      });
      const lista = listaVacunasPara(t.especie);
      if(lista && t.sanidad.vacuna && typeof t.sanidad.vacuna==='object'){
        lista.forEach(v=>{ if(t.sanidad.vacuna[v.key]) out += `    ${v.label}: aplicada ${fmtFecha(t.sanidad.vacuna[v.key].fecha)}\n`; });
      }
      VACUNAS.forEach(v=>{ if(t.sanidad[v.key]) out += `    ${v.label}: aplicada ${fmtFecha(t.sanidad[v.key].fecha)}\n`; });
    }
    if(t.tratamiento && hasData(t.tratamiento)){
      out += `${fmtFecha(t.fechaInicio)} — Tratamiento:\n`;
      if(hasData(t.tratamiento.individual)) out += `    Individual: ${campoResumen(t.tratamiento.individual)}\n`;
      if(t.tratamiento.masivo && t.tratamiento.masivo.grupos) t.tratamiento.masivo.grupos.forEach(g=>{ out += `    ${g.descripcion} — ${g.animales.length} animales\n`; });
    }
    if(hasData(t.tratamientos)) out += `${fmtFecha(t.fechaInicio)} — Tratamiento: ${campoResumen(t.tratamientos)}\n`;
  });
  return out.trim();
}

// --- Búsqueda profunda: recorre todo el trabajo (y el cliente asociado) buscando el texto ---
function textoIndexable(obj, profundidad){
  profundidad = profundidad || 0;
  if(obj==null || profundidad>8) return '';
  if(typeof obj==='string') return obj;
  if(typeof obj==='number') return String(obj);
  if(Array.isArray(obj)) return obj.map(o=>textoIndexable(o,profundidad+1)).join(' ');
  if(typeof obj==='object'){
    return Object.entries(obj).filter(([k])=>k!=='fotos').map(([,v])=>textoIndexable(v,profundidad+1)).join(' ');
  }
  return '';
}
function trabajoMatchesQuery(t, q){
  const cliente = t.clienteId ? clienteById(t.clienteId) : null;
  let texto = textoIndexable(t);
  if(cliente) texto += ' ' + textoIndexable(cliente);
  return texto.toLowerCase().includes(q.toLowerCase());
}
function renderResultadosHistorial(resultados){
  if(!resultados.length) return '<div class="empty">No se encontraron resultados.</div>';
  return `<div class="sectiontitle">${resultados.length} resultado${resultados.length===1?'':'s'}</div>` + resultados.map(renderTrabajoListCard).join('');
}

function ejecutarBusquedaAvanzada(){
  const clienteQ = document.getElementById('hist_av_cliente').value.trim().toLowerCase();
  const estabQ = document.getElementById('hist_av_establecimiento').value.trim().toLowerCase();
  const renspaQ = document.getElementById('hist_av_renspa').value.trim().toLowerCase();
  const especieQ = document.getElementById('hist_av_especie').value;
  const fechaQ = document.getElementById('hist_av_fecha').value;
  let resultados = trabajos.filter(t=>{
    if(especieQ && t.especie!==especieQ) return false;
    if(fechaQ && (!t.fechaInicio || t.fechaInicio < fechaQ)) return false;
    const cliente = t.clienteId ? clienteById(t.clienteId) : null;
    if(clienteQ && !(cliente && clienteNombreCompleto(cliente).toLowerCase().includes(clienteQ))) return false;
    if(estabQ){
      const estabs = (cliente&&cliente.establecimientos)||[];
      if(!estabs.some(e=>(e.nombre||'').toLowerCase().includes(estabQ))) return false;
    }
    if(renspaQ){
      const estabs = (cliente&&cliente.establecimientos)||[];
      if(!estabs.some(e=>(e.renspa||'').toLowerCase().includes(renspaQ))) return false;
    }
    return true;
  }).sort((a,b)=>(b.fechaInicio||'').localeCompare(a.fechaInicio||''));
  document.getElementById('histAvanzadaResultados').innerHTML = renderResultadosHistorial(resultados);
}

function campoResumen(v){
  if(!v) return '';
  if(typeof v==='string') return v;
  let s = v.texto||'';
  if(v.fotos && v.fotos.length) s += ` [${v.fotos.length} foto${v.fotos.length===1?'':'s'}]`;
  return s;
}
const CLAVES_NO_SISTEMA_QX = ['protocoloAnestesico','patologiasPodales','locomotorModo'];
function resumenProtocoloAnestesico(pq){
  const drogas = (pq && pq.protocoloAnestesico && pq.protocoloAnestesico.drogas) || [];
  return drogas.length ? `  Protocolo anestésico utilizado: ${drogas.join(', ')}\n` : '';
}
function resumenTrabajo(t){
  if(t.especie==='Bovino') return resumenTrabajoBovino(t);
  if(t.especie==='Canino'||t.especie==='Felino'||t.especie==='Otros') return resumenTrabajoMascota(t);
  let out = `Especie: ${t.especie}\n`;
  if(t.datosPaciente && hasData(t.datosPaciente)) out += `\nPaciente: ${t.datosPaciente.nombre||'—'} · ${t.datosPaciente.pelaje||''} · ${t.datosPaciente.edad||''} · ${t.datosPaciente.sexo||''}\n`;
  if(t.exploracionClinica && hasData(t.exploracionClinica)){
    out += `\nExploración clínica:\n`;
    if(t.exploracionClinica.estadoGeneral) out += `  Estado general: ${t.exploracionClinica.estadoGeneral}\n`;
    if(t.exploracionClinica.condicionCorporal) out += `  Condición corporal: ${t.exploracionClinica.condicionCorporal}\n`;
    if(t.exploracionClinica.temperatura) out += `  Temperatura: ${t.exploracionClinica.temperatura}\n`;
    Object.entries(t.exploracionClinica.examenClinico||{}).forEach(([k,v])=>{ if(hasData(v)) out += `  Sistema explorado: ${k}\n    Comentario: ${campoResumen(v)}\n`; });
  }
  if(t.exploracionReproductiva && hasData(t.exploracionReproductiva)){
    const r = t.exploracionReproductiva;
    out += `\nExploración reproductiva: ${r.estadoGestacional||''}\n`;
    if(r.observaciones) out += `  Observaciones: ${r.observaciones}\n`;
    if(r.edadGestacional) out += `  Edad gestacional: ${r.edadGestacional}\n`;
    if(r.examenReproductivo) out += `  Examen: ${r.examenReproductivo}\n`;
  }
  if(t.examenesComplementarios && hasData(t.examenesComplementarios)){
    out += `\nExámenes complementarios:\n`;
    const etiquetasComp = {radiografia:'radiografía', ecografia:'ecografía', sangrado:'análisis de sangre', otros:'otros'};
    ['radiografia','ecografia','sangrado','otros'].forEach(k=>{ if(hasData(t.examenesComplementarios[k])) out += `  ${etiquetasComp[k]}: ${campoResumen(t.examenesComplementarios[k])}\n`; });
    const sm = t.examenesComplementarios.sangradoMasivo;
    if(sm && sm.tubos && sm.tubos.length) out += `  Análisis de sangre grupal: ${sm.tubos.length} animales\n`;
    out += resumenTomaMuestra(t.examenesComplementarios.tomaMuestra);
  }
  if(t.procedimientosQuirurgicos && hasData(t.procedimientosQuirurgicos)){
    out += `\nProcedimientos quirúrgicos:\n`;
    out += resumenProtocoloAnestesico(t.procedimientosQuirurgicos);
    Object.entries(t.procedimientosQuirurgicos).filter(([k])=>!CLAVES_NO_SISTEMA_QX.includes(k)).forEach(([k,v])=>{ if(hasData(v)) out += `  Sistema intervenido: ${k}\n    Qué se hizo: ${campoResumen(v)}\n`; });
  }
  if(hasData(t.tratamiento)) out += `\nTratamiento: ${campoResumen(t.tratamiento)}\n`;
  if(t.sanidad && hasData(t.sanidad)){
    out += `\nSanidad:\n`;
    VACUNAS.forEach(v=>{ if(t.sanidad[v.key]) out += `  ${v.label}: aplicada ${fmtFecha(t.sanidad[v.key].fecha)}, próxima ${fmtFecha(t.sanidad[v.key].proxima)}${t.sanidad[v.key].observaciones?' — '+t.sanidad[v.key].observaciones:''}\n`; });
    if(t.sanidad.sanidadMasiva && t.sanidad.sanidadMasiva.filas && t.sanidad.sanidadMasiva.filas.length) out += `  Sanidad masiva: ${t.sanidad.sanidadMasiva.filas.length} animales\n`;
  }
  out += resumenNecropsia(t.necropsia);
  out += resumenNutricion(t.nutricion);
  if(hasData(t.otroProcedimiento)) out += `\nOtro procedimiento: ${campoResumen(t.otroProcedimiento)}\n`;
  if(hasData(t.observacionesFinales)) out += `\nObservaciones: ${campoResumen(t.observacionesFinales)}\n`;
  return out;
}
function resumenTrabajoBovino(t){
  let out = `Especie: Bovino\n`;
  if(t.registro && t.registro.caravana) out += `\nCaravana de registro: ${t.registro.caravana}\n`;
  if(t.exploracionClinica && hasData(t.exploracionClinica)){
    out += `\nExploración clínica:\n`;
    if(t.exploracionClinica.estadoGeneral) out += `  Estado general: ${t.exploracionClinica.estadoGeneral}\n`;
    if(t.exploracionClinica.condicionCorporal) out += `  Condición corporal: ${t.exploracionClinica.condicionCorporal}\n`;
    if(t.exploracionClinica.temperatura) out += `  Temperatura: ${t.exploracionClinica.temperatura}\n`;
    Object.entries(t.exploracionClinica.examenClinico||{}).forEach(([k,v])=>{ if(hasData(v)) out += `  Sistema explorado: ${k}\n    Comentario: ${campoResumen(v)}\n`; });
  }
  if(t.exploracionReproductiva && hasData(t.exploracionReproductiva)){
    const r = t.exploracionReproductiva;
    out += `\nExploración reproductiva:\n`;
    const dg = r.diagnosticoGestacion;
    if(dg && dg.registros && dg.registros.length){
      const pren = dg.registros.filter(x=>x.resultado==='Preñada').length;
      const vac = dg.registros.filter(x=>x.resultado==='Vacía').length;
      out += `  Diagnóstico de gestación: ${dg.registros.length} animales (${pren} preñadas, ${vac} vacías)\n`;
      if(dg.comentario) out += `    Comentario: ${dg.comentario}\n`;
    }
    if(r.preservicio && r.preservicio.registros && r.preservicio.registros.length) out += `  Preservicio: ${r.preservicio.registros.length} animales\n`;
    if(r.servicio){
      if(r.servicio.iatf && r.servicio.iatf.length) out += `  Servicio IATF: ${r.servicio.iatf.length} animales\n`;
      if(r.servicio.natural) out += `  Servicio natural: ${r.servicio.natural}\n`;
    }
    if(r.examenGinecologico && r.examenGinecologico.registros && r.examenGinecologico.registros.length) out += `  Examen ginecológico: ${r.examenGinecologico.registros.length} animales\n`;
    if(r.observacion) out += `  Observación general: ${r.observacion}\n`;
  }
  if(t.examenAndrologico && hasData(t.examenAndrologico)){
    const a = t.examenAndrologico;
    out += `\nExamen andrológico: caravana ${a.caravana||'—'}, raza ${a.raza||'—'}, edad ${a.edad||'—'}\n`;
    if(a.locomotor) out += `  Ap. locomotor: ${a.locomotor}\n`;
    if(a.vision) out += `  Ap. visión: ${a.vision}\n`;
    if(a.tonoTesticular) out += `  Tono testicular: ${a.tonoTesticular}\n`;
    if(a.glandulasAnexas) out += `  Exploración de glándulas anexas: ${a.glandulasAnexas}${a.glandulasAnexasObs?' — '+a.glandulasAnexasObs:''}\n`;
    if(hasData(a.circunferencia)) out += `  Circunferencia escrotal: ${campoResumen(a.circunferencia)}\n`;
    if(hasData(a.ecografia)) out += `  Ecografía testicular: ${campoResumen(a.ecografia)}\n`;
    if(hasData(a.calidadSeminal)) out += `  Calidad seminal: ${campoResumen(a.calidadSeminal)}\n`;
  }
  if(t.examenesComplementarios && hasData(t.examenesComplementarios)){
    const ex = t.examenesComplementarios;
    out += `\nExámenes complementarios:\n`;
    if(ex.datosAnimal && ex.datosAnimal.caravana) out += `  Caravana: ${ex.datosAnimal.caravana}\n`;
    const etiquetasCompB = {ecografia:'ecografía', radiografia:'radiografía', sangrado:'análisis de sangre', otro:'otro'};
    ['ecografia','radiografia','sangrado','otro'].forEach(k=>{ if(hasData(ex[k])) out += `  ${etiquetasCompB[k]}: ${campoResumen(ex[k])}\n`; });
    if(ex.sangradoMasivo && ex.sangradoMasivo.tubos && ex.sangradoMasivo.tubos.length) out += `  Análisis de sangre grupal: ${ex.sangradoMasivo.tubos.length} animales\n`;
    out += resumenTomaMuestra(ex.tomaMuestra);
  }
  if(t.procedimientosQuirurgicos && hasData(t.procedimientosQuirurgicos)){
    out += `\nProcedimientos quirúrgicos:\n`;
    out += resumenProtocoloAnestesico(t.procedimientosQuirurgicos);
    Object.entries(t.procedimientosQuirurgicos).filter(([k])=>!CLAVES_NO_SISTEMA_QX.includes(k)).forEach(([k,v])=>{ if(v && v.texto) out += `  Sistema intervenido: ${k} (caravana ${v.caravana||'—'})\n    Qué se hizo: ${campoResumen(v)}\n`; });
    out += resumenPatologiasPodales(t.procedimientosQuirurgicos);
  }
  if(t.sanidad && hasData(t.sanidad)){
    out += `\nSanidad:\n`;
    if(t.sanidad.individual) Object.entries(t.sanidad.individual).forEach(([k,v])=>{ if(hasData(v)) out += `  Individual - ${k}: ${campoResumen(v)}\n`; });
    if(t.sanidad.masivo) Object.entries(t.sanidad.masivo).forEach(([k,v])=>{
      if(k==='vacunacion' && v && v.grupos && v.grupos.length){
        v.grupos.forEach(g=>{
          out += `  Vacuna: ${labelVacunaGrupo(g)}\n`;
          if(g.dosis) out += `    Dosis: ${g.dosis}\n`;
          if(g.repetir) out += `    ⚠️ REPETIR: ${g.repetir}\n`;
          out += `    Animales tratados: ${g.animales.length}\n`;
          g.animales.forEach(a=> out += `      ${a.caravana} - ${a.categoria}\n`);
        });
      } else if(v && v.filas && v.filas.length){
        out += `  Masivo - ${k}: ${v.filas.length} animales\n`;
      }
    });
  }
  if(t.tratamiento && hasData(t.tratamiento)){
    out += `\nTratamiento:\n`;
    if(hasData(t.tratamiento.individual)) out += `  Individual: ${campoResumen(t.tratamiento.individual)}\n`;
    if(t.tratamiento.masivo && t.tratamiento.masivo.grupos && t.tratamiento.masivo.grupos.length){
      t.tratamiento.masivo.grupos.forEach(g=>{
        out += `  Tratamiento utilizado: ${g.descripcion}\n`;
        out += `    Animales tratados: ${g.animales.length}\n`;
        g.animales.forEach(a=> out += `      ${a.caravana} - ${a.categoria}${a.observacion?' — '+a.observacion:''}\n`);
      });
    }
  }
  out += resumenNecropsia(t.necropsia);
  out += resumenNutricion(t.nutricion);
  if(hasData(t.otroProcedimiento)) out += `\nOtro procedimiento: ${campoResumen(t.otroProcedimiento)}\n`;
  if(hasData(t.observacionesFinales)) out += `\nObservaciones: ${campoResumen(t.observacionesFinales)}\n`;
  return out;
}

function viewInformesRapida(){

}
function ejecutarBusquedaInformesRapida(){
  const q = document.getElementById('inf_rapida_q').value.trim();

  const base = trabajos.filter(t=>t.estado===estadoInformes());
  const resultados = (q ? base.filter(t=>trabajoMatchesQuery(t,q)) : base).sort((a,b)=>(b.fechaInicio||'').localeCompare(a.fechaInicio||''));
  cont.innerHTML = renderResultadosInformes(resultados);
}
function viewInformesAvanzada(){
  return `

    <label>Especie</label>
    <select id="inf_av_especie">
      <option value="">Todas</option>
      <option>Equino</option><option>Bovino</option><option>Canino</option><option>Felino</option><option>Otros</option>
    </select>
    <label>Fecha (desde)</label>
    <input type="date" id="inf_av_fecha">
    <button class="btn btn-teal" style="margin-top:16px;" onclick="ejecutarBusquedaInformesAvanzada()">Buscar</button>
    <div id="infAvanzadaResultados"></div>
  `;
}
function ejecutarBusquedaInformesAvanzada(){
  const clienteQ = document.getElementById('inf_av_cliente').value.trim().toLowerCase();
  const especieQ = document.getElementById('inf_av_especie').value;
  const fechaQ = document.getElementById('inf_av_fecha').value;
  const resultados = trabajos.filter(t=>{
    if(t.estado!==estadoInformes()) return false;
    if(especieQ && t.especie!==especieQ) return false;
    if(fechaQ && (!t.fechaInicio || t.fechaInicio<fechaQ)) return false;
    if(clienteQ){
      const cliente = t.clienteId?clienteById(t.clienteId):null;
      if(!(cliente && clienteNombreCompleto(cliente).toLowerCase().includes(clienteQ))) return false;
    }
    return true;
  }).sort((a,b)=>(b.fechaInicio||'').localeCompare(a.fechaInicio||''));
  document.getElementById('infAvanzadaResultados').innerHTML = renderResultadosInformes(resultados);
}
function renderResultadosInformes(resultados){
  if(!resultados.length) return '<div class="empty">No se encontraron resultados.</div>';
  return `<div class="sectiontitle">${resultados.length} resultado${resultados.length===1?'':'s'}</div>` + resultados.map(renderInformeListCard).join('');
}
function renderInformeListCard(t){
  const cliente = t.clienteId?clienteById(t.clienteId):null;
  const nombrePaciente = (t.datosPaciente&&t.datosPaciente.nombre)||(t.informacionGeneral&&t.informacionGeneral.paciente&&t.informacionGeneral.paciente.nombre)||'';
  if(t.estado==='finalizado'){
    return `<div class="listcard" style="cursor:default;">
      <div onclick="abrirInformeCompleto('${t.id}')" style="cursor:pointer;">
        <div class="top"><div class="name">${cliente?escapeHtml(clienteNombreCompleto(cliente)):'Sin cliente'}</div><div class="date">${fmtFecha(t.fechaInicio)}</div></div>
        <div class="meta">${t.especie}${nombrePaciente?' · '+escapeHtml(nombrePaciente):''}</div>
      </div>
      <div class="facturacionRow">
        <button class="factbtn ${t.facturado?'on':''}" onclick="toggleFacturado('${t.id}', this)">${t.facturado?'✓ ':''}Facturado</button>
        <button class="factbtn ${t.cobrado?'on':''}" onclick="toggleCobrado('${t.id}', this)">${t.cobrado?'✓ ':''}Cobrado</button>
      </div>
    </div>`;
  }
  return `<div class="listcard" onclick="retomarTrabajo('${t.id}')">
    <div class="top"><div class="name">${cliente?escapeHtml(clienteNombreCompleto(cliente)):'Sin cliente'}</div><div class="date">${fmtFecha(t.fechaInicio)}</div></div>
    <div class="meta">${t.especie}${nombrePaciente?' · '+escapeHtml(nombrePaciente):''}</div>
    <span class="tag parcial">En curso · tocá para continuar</span>
  </div>`;
}
function toggleFacturado(id, btn){
  const t=trabajos.find(x=>x.id===id); if(!t) return;
  t.facturado=!t.facturado; updateTrabajoDoc(id, {facturado:t.facturado});
  btn.classList.toggle('on', t.facturado);
  btn.textContent = (t.facturado?'✓ ':'')+'Facturado';
}
function toggleCobrado(id, btn){
  const t=trabajos.find(x=>x.id===id); if(!t) return;
  t.cobrado=!t.cobrado; updateTrabajoDoc(id, {cobrado:t.cobrado});
  btn.classList.toggle('on', t.cobrado);
  btn.textContent = (t.cobrado?'✓ ':'')+'Cobrado';
}

function recolectarFotos(obj, acc){
  acc = acc || [];
  if(!obj) return acc;
  if(Array.isArray(obj)){ obj.forEach(o=>recolectarFotos(o,acc)); return acc; }
  if(typeof obj==='object'){
    if(Array.isArray(obj.fotos)) acc.push(...obj.fotos);
    Object.entries(obj).forEach(([k,v])=>{ if(k!=='fotos') recolectarFotos(v,acc); });
  }
  return acc;
}
function renderInformeHTML(t, cliente){
  let html = '';
  html += `<div style="margin-bottom:14px;">`;
  html += `<b style="font-size:15px;">${fmtFecha(t.fechaInicio)}</b>`;
  html += `<div style="font-weight:700; font-size:13.5px; margin-top:2px;">${cliente?escapeHtml(clienteNombreCompleto(cliente)):'Sin cliente asociado'}</div>`;
  if(cliente && cliente.establecimientos && cliente.establecimientos.length){
    const estab = t.establecimientoId ? cliente.establecimientos.find(e=>e.id===t.establecimientoId) : null;
    if(estab){
      html += `<div class="fieldnote">${escapeHtml(estab.nombre)}${estab.renspa?' · RENSPA '+escapeHtml(estab.renspa):''}${estab.ubicacion?' · '+escapeHtml(estab.ubicacion):''}</div>`;
    } else {
      html += `<div class="fieldnote">${cliente.establecimientos.map(e=>escapeHtml(e.nombre)).join(' · ')}</div>`;
    }
  }
  html += `</div>`;

  if(t.especie==='Bovino' && t.exploracionReproductiva && t.exploracionReproductiva.diagnosticoGestacion){
    const regs = t.exploracionReproductiva.diagnosticoGestacion.registros||[];
    if(regs.length){
      const pren = regs.filter(x=>x.resultado==='Preñada').length;
      const vac = regs.filter(x=>x.resultado==='Vacía').length;
      const pct = Math.round((pren/regs.length)*100);
      const cab = regs.filter(x=>x.subresultado==='Cabeza').length;
      const cue = regs.filter(x=>x.subresultado==='Cuerpo').length;
      const col = regs.filter(x=>x.subresultado==='Cola').length;
      html += `<div style="margin-bottom:16px;">
        <b>Diagnóstico de gestación — ${regs.length} animales</b>
        <div style="display:flex; height:22px; border-radius:5px; overflow:hidden; margin-top:8px;">
          <div style="width:${pct}%; background:var(--green);"></div>
          <div style="width:${100-pct}%; background:var(--line);"></div>
        </div>
        <div class="fieldnote">Preñadas: ${pren} (${pct}%) · Vacías: ${vac} (${100-pct}%)</div>
        ${pren?`<div class="fieldnote">De las preñadas — Cabeza: ${cab} · Cuerpo: ${cue} · Cola: ${col}</div>`:''}
      </div>`;
    }
  }

  html += `<div style="white-space:pre-wrap; font-size:12.5px; line-height:1.6;">${escapeHtml(resumenTrabajo(t))}</div>`;

  const fotos = recolectarFotos(t);
  if(fotos.length){
    html += `<div style="margin-top:14px;"><b>Fotos (${fotos.length})</b><div class="fotogrid" style="margin-top:8px;">${fotos.map(f=>`<div class="fotothumb" style="width:80px;height:80px;"><img src="${f}"></div>`).join('')}</div></div>`;
  }
  return html;
}
function textoCompartible(t){
  const cliente = t.clienteId?clienteById(t.clienteId):null;
  return `INFORME VETERINARIO\n${cliente?clienteNombreCompleto(cliente):'Sin cliente'}\n${fmtFecha(t.fechaInicio)} · ${t.especie}\n\n${resumenTrabajo(t)}`;
}
function compartirWhatsapp(id){
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  window.open(`https://wa.me/?text=${encodeURIComponent(textoCompartible(t))}`, '_blank');
}
function compartirMail(id){
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  const cliente = t.clienteId?clienteById(t.clienteId):null;
  const asunto = encodeURIComponent(`Informe veterinario - ${cliente?clienteNombreCompleto(cliente):''} - ${fmtFecha(t.fechaInicio)}`);
  window.location.href = `mailto:?subject=${asunto}&body=${encodeURIComponent(textoCompartible(t))}`;
}
function copiarInformeTexto(id){
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  navigator.clipboard.writeText(textoCompartible(t)).then(()=>showToast('Informe copiado')).catch(()=>showToast('No se pudo copiar'));
}
function eliminarInforme(id){
  if(!confirm('¿Eliminar este informe? Esta acción no se puede deshacer.')) return;
  trabajos = trabajos.filter(t=>t.id!==id);
  deleteTrabajoDoc(id);
  informeVerId=null;
  navigate('informes');
}

let calMes = null; // 'YYYY-MM'
let calDiaSeleccionado = null; // 'YYYY-MM-DD'
function mesActualISO(){ return hoyISO().slice(0,7); }
function diasDelMes(mesISO){
  const [y,m] = mesISO.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function primerDiaSemanaDelMes(mesISO){
  const [y,m] = mesISO.split('-').map(Number);
  return new Date(y, m-1, 1).getDay();
}
function eventosDelDia(fecha){ return eventos.filter(e=>e.fecha===fecha); }
function viewCalendario(){
  if(!calMes) calMes = mesActualISO();
  if(calDiaSeleccionado) return viewCalendarioDia();
  const numDias = diasDelMes(calMes);
  const primerDia = primerDiaSemanaDelMes(calMes);
  const [y,m] = calMes.split('-');
  const nombreMes = new Date(Number(y), Number(m)-1, 1).toLocaleDateString('es-AR',{month:'long', year:'numeric'});
  let celdas = [];
  for(let i=0;i<primerDia;i++) celdas.push('');
  for(let d=1; d<=numDias; d++) celdas.push(d);
  return `
    <button class="backbtn" onclick="calMes=null; calDiaSeleccionado=null; navigate('home')">‹ Inicio</button>
    <div class="sectiontitle">Calendario</div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <button class="backbtn" style="margin:0;" onclick="calMesAnterior()">‹</button>
      <div style="font-weight:700; text-transform:capitalize;">${escapeHtml(nombreMes)}</div>
      <button class="backbtn" style="margin:0;" onclick="calMesSiguiente()">›</button>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:11px; color:var(--ink-soft); margin-bottom:4px;">
      ${['D','L','M','M','J','V','S'].map(d=>`<div>${d}</div>`).join('')}
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px;">
      ${celdas.map(d=>{
        if(!d) return `<div></div>`;
        const fecha = `${calMes}-${String(d).padStart(2,'0')}`;
        const tieneEventos = eventosDelDia(fecha).length>0;
        const esHoy = fecha===hoyISO();
        return `<div onclick="calDiaSeleccionado='${fecha}'; render()" style="aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:7px; cursor:pointer; font-size:13px; background:${esHoy?'var(--teal)':'var(--card)'}; color:${esHoy?'#08181A':'var(--ink)'}; border:1px solid var(--line); position:relative;">
          ${d}${tieneEventos?`<span style="position:absolute; bottom:3px; width:5px; height:5px; border-radius:50%; background:${esHoy?'#08181A':'var(--amber)'};"></span>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
}
function calMesAnterior(){
  const [y,m] = calMes.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  calMes = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function calMesSiguiente(){
  const [y,m] = calMes.split('-').map(Number);
  const d = new Date(y, m, 1);
  calMes = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function viewCalendarioDia(){
  const fecha = calDiaSeleccionado;
  const evs = eventosDelDia(fecha);
  return `
    <button class="backbtn" onclick="calDiaSeleccionado=null; render()">‹ Calendario</button>
    <div class="sectiontitle">${fmtFecha(fecha)}</div>
    <label>Nueva nota</label>
    <textarea id="cal_nota_nueva" placeholder="Ej: ir a tal campo..."></textarea>
    <button class="btn btn-teal" onclick="agregarEventoDia()">+ Agregar</button>
    ${evs.length ? `<div class="sectiontitle">Notas de este día</div>` + evs.map(e=>`
      <div class="listcard" style="cursor:default;">
        <div class="meta">${escapeHtml(e.nota)}</div>
        <div class="twobtn" style="margin-top:8px;">
          <button class="btn btn-outline" style="margin-top:0; padding:8px;" onclick="agregarEventoICS('${e.fecha}', ${escapeHtml(JSON.stringify(e.nota))})">📅 Agregar a mi calendario</button>
          <button class="btn btn-danger" style="margin-top:0; padding:8px;" onclick="eliminarEventoCal('${e.id}')">Eliminar</button>
        </div>
      </div>
    `).join('') : '<div class="fieldnote">Todavía no hay notas para este día.</div>'}
  `;
}
function agregarEventoDia(){
  const texto = document.getElementById('cal_nota_nueva').value.trim();
  if(!texto) return;
  const nuevo = {id:uid(), fecha: calDiaSeleccionado, nota:texto, creado: new Date().toISOString()};
  eventos.push(nuevo);
  saveEventoDoc(nuevo);
  render();
}
function eliminarEventoCal(id){
  eventos = eventos.filter(e=>e.id!==id);
  deleteEventoDoc(id);
  render();
}
function generarICS(fecha, nota){
  const dt = fecha.replace(/-/g,'');
  const now = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//IntegralVet//ES\r\nBEGIN:VEVENT\r\nUID:${uid()}@integralvet\r\nDTSTAMP:${now}\r\nDTSTART;VALUE=DATE:${dt}\r\nDTEND;VALUE=DATE:${dt}\r\nSUMMARY:${(nota||'Evento').replace(/\r?\n/g,' ')}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
}
function agregarEventoICS(fecha, nota){
  const ics = generarICS(fecha, nota);
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'evento.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------------- INIT ----------------
view = 'cargando';
render();
fbAuth.onAuthStateChanged(function(user){
  if(user){
    auth = {usuario: user.email};
    sesionActiva = true;
    attachListeners();
    navigate('home');
  } else {
    auth = null;
    sesionActiva = false;
    clientes = []; trabajos = []; eventos = [];
    detachListeners();
    navigate('login');
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){ console.warn('SW no registrado', err); });
  });
}
</script>
