function resumenTrabajoMascota(t){
  let out = `Especie: ${t.especie}\n`;
  const g = t.informacionGeneral;
  if(g && hasData(g)){
    const p = g.propietario||{}, pa = g.paciente||{};
    out += `\nPropietario: ${[p.nombre,p.apellido].filter(Boolean).join(' ')||'—'}${p.telefono?' · '+p.telefono:''}${p.direccion?' · '+p.direccion:''}\n`;
    out += `Paciente: ${pa.nombre||'—'} · ${pa.raza||''} · ${pa.sexo||''} · ${pa.edad||''}\n`;
  }
  if(t.exploracionClinica && hasData(t.exploracionClinica)){
    out += `\nExploración clínica:\n`;
    if(t.exploracionClinica.estadoGeneral) out += `  Estado general: ${t.exploracionClinica.estadoGeneral}\n`;
    if(t.exploracionClinica.condicionCorporal) out += `  Condición corporal: ${t.exploracionClinica.condicionCorporal}\n`;
    if(t.exploracionClinica.temperatura) out += `  Temperatura: ${t.exploracionClinica.temperatura}\n`;
    Object.entries(t.exploracionClinica.examenClinico||{}).forEach(([k,v])=>{ if(hasData(v)) out += `  Sistema explorado: ${k}\n    Comentario: ${campoResumen(v)}\n`; });
  }
  if(t.examenesComplementarios && hasData(t.examenesComplementarios)){
    out += `\nExámenes complementarios:\n`;
    const etiquetasCompM = {radiografia:'radiografía', ecografia:'ecografía', sangrado:'análisis de sangre', otros:'otros'};
    Object.entries(t.examenesComplementarios).filter(([k])=>k!=='tomaMuestra' && k!=='radiografiaDetalle' && k!=='ecografiaDetalle').forEach(([k,v])=>{ if(hasData(v)) out += `  ${etiquetasCompM[k]||k}: ${campoResumen(v)}\n`; });
    out += resumenTomaMuestra(t.examenesComplementarios.tomaMuestra);
    out += resumenExamenImagen('radiografia', t.examenesComplementarios.radiografiaDetalle);
    out += resumenExamenImagen('ecografia', t.examenesComplementarios.ecografiaDetalle);
  }
  if(t.procedimientosQuirurgicos && hasData(t.procedimientosQuirurgicos)){
    out += `\nProcedimientos quirúrgicos:\n`;
    out += resumenProtocoloAnestesico(t.procedimientosQuirurgicos);
    Object.entries(t.procedimientosQuirurgicos).filter(([k])=>!CLAVES_NO_SISTEMA_QX.includes(k)).forEach(([k,v])=>{ if(hasData(v)) out += `  Sistema intervenido: ${k}\n    Qué se hizo: ${campoResumen(v)}\n`; });
    out += resumenSeguimientoCirugia(t.procedimientosQuirurgicos);
  }
  if(t.sanidad && hasData(t.sanidad)){
    out += `\nSanidad:\n`;
    const lista = listaVacunasPara(t.especie);
    if(lista && t.sanidad.vacuna && typeof t.sanidad.vacuna==='object'){
      lista.forEach(v=>{ if(t.sanidad.vacuna[v.key]) out += `  ${v.label}: aplicada ${fmtFecha(t.sanidad.vacuna[v.key].fecha)}, próxima ${fmtFecha(t.sanidad.vacuna[v.key].proxima)}${t.sanidad.vacuna[v.key].observaciones?' — '+t.sanidad.vacuna[v.key].observaciones:''}\n`; });
    } else if(hasData(t.sanidad.vacuna)) out += `  Vacuna: ${campoResumen(t.sanidad.vacuna)}\n`;
    if(hasData(t.sanidad.desparasitaciones)) out += `  Desparasitaciones: ${campoResumen(t.sanidad.desparasitaciones)}\n`;
    if(hasData(t.sanidad.otros)) out += `  Otros: ${campoResumen(t.sanidad.otros)}\n`;
  }
  if(hasData(t.tratamientos)) out += `\nTratamientos: ${campoResumen(t.tratamientos)}\n`;
  out += resumenNecropsia(t.necropsia);
  out += resumenNutricion(t.nutricion);
  if(hasData(t.otroProcedimiento)) out += `\nOtros procedimientos: ${campoResumen(t.otroProcedimiento)}\n`;
  if(hasData(t.observacionesFinales)) out += `\nObservaciones: ${campoResumen(t.observacionesFinales)}\n`;
  return out;
}

const STAT_COLORS = ['#1D9E75','#378ADD','#D85A30','#C99A3B','#7F77DD','#D4537E','#639922','#E24B4A','#159AA6'];
let statsEstabId = null;   // null = todavía no elegido ('__none__' = trabajos sin establecimiento)
let statsEspecie = null;
function sBar(titulo, items, total){
  items = (items||[]).filter(i=>i && i.n>0);
  if(!items.length) return '';
  const tot = total!==undefined ? total : items.reduce((a,b)=>a+b.n,0);
  const max = Math.max(1, ...items.map(i=>i.n));
  return `<div style="margin:14px 0 6px;"><div class="sectiontitle" style="margin-top:0;">${escapeHtml(titulo)}</div>
    <div style="display:flex; gap:8px; align-items:flex-end;">${items.map((it,k)=>{
      const h = Math.max(6, Math.round(it.n/max*110));
      const pct = tot ? Math.round(it.n/tot*100) : 0;
      return `<div style="flex:1; min-width:0; text-align:center;">
        <div style="height:110px; display:flex; align-items:flex-end;"><div style="width:100%; height:${h}px; background:${STAT_COLORS[k%STAT_COLORS.length]}; border-radius:4px 4px 0 0;"></div></div>
        <div style="font-size:11px; font-weight:600; margin-top:4px; word-break:break-word;">${escapeHtml(String(it.label))}</div>
        <div style="font-size:11px; color:var(--ink-soft);">${it.n} · ${pct}%</div></div>`;

}
function sCards(arr){

}
function sTitulo(t){ return `<div class="sectiontitle">${escapeHtml(t)}</div>`; }
function sLista(lineas){ lineas = lineas.filter(Boolean); return lineas.length ? `<div class="reportbox" style="margin-top:8px;">${escapeHtml(lineas.join('\n'))}</div>` : ''; }
function sCuenta(arr){ const m = {}; arr.forEach(x=>{ if(x===undefined||x===null||x==='') return; m[x]=(m[x]||0)+1; }); return m; }
function sItems(m, orden){ const ks = orden || Object.keys(m); return ks.map(k=>({label:k, n:m[k]||0})); }
function sApi(f){ return f ? fmtFecha(f) : '—'; }

function statsScopeTodos(){

const STATS_CATS = [
  {id:'reproductiva', lab:'Reproductiva', emoji:'🧬'},
  {id:'andrologico', lab:'Andrológico', emoji:'🐂'},
  {id:'quirurgica', lab:'Quirúrgica', emoji:'🔪'},
  {id:'sanitaria', lab:'Sanitaria', emoji:'💉'},
  {id:'complementarios', lab:'Exámenes complementarios', emoji:'🔬'},
  {id:'nutricion', lab:'Nutrición', emoji:'🌾'},
  {id:'otros', lab:'Otros', emoji:'➕'},

function statsHas(t, cat){
  if(cat==='reproductiva'){
    const r = t.exploracionReproductiva; if(!r) return false;
    return !!((r.diagnosticoGestacion&&r.diagnosticoGestacion.registros&&r.diagnosticoGestacion.registros.length) || (r.preservicio&&r.preservicio.registros&&r.preservicio.registros.length) ||
      (r.servicio&&((r.servicio.iatf&&r.servicio.iatf.length)||r.servicio.natural)) || (r.examenGinecologico&&r.examenGinecologico.registros&&r.examenGinecologico.registros.length));
  }
  if(cat==='andrologico') return androToros(t).length>0;
  if(cat==='quirurgica') return cirugiasDeTrabajo(t).length>0;
  if(cat==='sanitaria') return !!((t.sanidad&&hasData(t.sanidad)) || (t.sanidadEquino&&hasData(t.sanidadEquino)) || (t.tratamiento&&hasData(t.tratamiento)) || hasData(t.tratamientos));
  if(cat==='complementarios') return !!(t.examenesComplementarios && hasData(t.examenesComplementarios));
  if(cat==='nutricion') return hasData(t.nutricion);
  if(cat==='otros') return hasData(t.otroProcedimiento) || hasData(t.observacionesFinales) || (t.necropsia && hasData(t.necropsia));
  return false;
}

function statsVolver(){
  const c = clienteById(statsClienteId);

  const multiEsp = statsEspeciesConDatos().length>1;
  if(statsPaso==='resultado') statsPaso='categoria';
  else if(statsPaso==='categoria') statsPaso = multiEsp ? 'especie' : (multiEstab ? 'estab' : 'cliente');
  else if(statsPaso==='especie') statsPaso = multiEstab ? 'estab' : 'cliente';
  else statsPaso='cliente';
  render();
}

function statsHTMLReproductiva(trabs){
  let h = '';
  const diag = [], pres = [], iatf = [], gin = [], ccs = [], aplics = [];
  const porFecha = {};
  trabs.forEach(t=>{
    const r = t.exploracionReproductiva; if(!r) return;
    const f = t.fechaInicio;
    ((r.diagnosticoGestacion||{}).registros||[]).forEach(x=>{ diag.push({...x,f}); });
    ((r.preservicio||{}).registros||[]).forEach(x=>{ pres.push({...x,f}); });
    ((r.servicio||{}).iatf||[]).forEach(x=>{ iatf.push({...x,f}); });
    ((r.examenGinecologico||{}).registros||[]).forEach(x=>{ gin.push({...x,f}); });
  });
  [].concat(diag,pres,iatf,gin).forEach(x=>{ if(x.cc) ccs.push(x.cc); (x.aplicaciones||[]).forEach(a=>aplics.push(a==='Otra'?'Observaciones':a)); });
  if(diag.length){
    const pren = diag.filter(x=>x.resultado==='Preñada'), vac = diag.filter(x=>x.resultado==='Vacía');
    h += sTitulo('Diagnóstico de gestación') + sCards([{n:diag.length, lab:'evaluadas'},{n:pren.length, lab:'preñadas'},{n:vac.length, lab:'vacías'}]);
    h += sBar('Preñadas y vacías', [{label:'Preñadas', n:pren.length},{label:'Vacías', n:vac.length}], diag.length);
    h += sBar('Preñadas: cabeza / cuerpo / cola', sItems(sCuenta(pren.map(x=>x.subresultado)), ['Cabeza','Cuerpo','Cola']), pren.length);
    const cat = sCuenta(diag.map(x=>x.categoria)); if(Object.keys(cat).length) h += sBar('Por categoría', sItems(cat));
    const fechas = {}; diag.forEach(x=>{ const k=x.f||''; fechas[k]=fechas[k]||{t:0,p:0}; fechas[k].t++; if(x.resultado==='Preñada') fechas[k].p++; });
    h += sLista(Object.keys(fechas).sort().map(k=>`${sApi(k)} — ${fechas[k].t} evaluadas, ${fechas[k].p} preñadas (${Math.round(fechas[k].p/fechas[k].t*100)}%)`));
  }
  if(pres.length){
    h += sTitulo('Preservicio') + sCards([{n:pres.length, lab:'animales evaluados'}]);
    h += sBar('GDR (grado de desarrollo reproductivo)', sItems(sCuenta(pres.map(x=>x.gdr)), ['1','2','3','4']).map(i=>({label:'GDR '+i.label, n:i.n})), pres.length);
    const dest = sCuenta(pres.map(x=> (x.destino==='Otro'||x.destino==='Otra') ? 'Otro' : x.destino));
    h += sBar('Destino', sItems(dest, ['IATF','Servicio natural','Descarte','Otro'].filter(k=>dest[k])), pres.length);
    const otros = pres.filter(x=>(x.destino==='Otro'||x.destino==='Otra') && x.destinoOtro).map(x=>`${sApi(x.f)} — caravana ${x.caravana}: ${x.destinoOtro}`);
    h += sLista(otros);
    const cat = sCuenta(pres.map(x=>x.categoria)); if(Object.keys(cat).length) h += sBar('Por categoría', sItems(cat));
  }
  if(iatf.length){
    const col = iatf.filter(x=>x.etapa==='colocacion'), ret = iatf.filter(x=>x.etapa==='retiro'), ia = iatf.filter(x=>x.etapa==='inseminacion'), leg = iatf.filter(x=>!x.etapa);
    h += sTitulo('IATF');
    h += sCards([{n:col.length, lab:'dispositivos colocados'},{n:ret.length, lab:'retirados'},{n:ia.length, lab:'inseminados'}].concat(leg.length?[{n:leg.length, lab:'registros anteriores'}]:[]));
    h += sBar('Retiros', sItems(sCuenta(ret.map(x=>x.conDispositivo)), ['Con dispositivo','Sin dispositivo']), ret.length);
    h += sBar('Celo al inseminar', sItems(sCuenta(ia.map(x=>x.pintada)), ['Pintada','Despintada']), ia.length);
    h += sBar('Inseminaciones por toro', sItems(sCuenta(ia.map(x=>x.toro))), ia.length);
    const porF = {}; iatf.forEach(x=>{ if(!x.etapa) return; const k=(x.fecha||'')+'|'+x.etapa; porF[k]=(porF[k]||0)+1; });
    const ET = {colocacion:'colocados', retiro:'retirados', inseminacion:'inseminados'};
    h += sLista(Object.keys(porF).sort().map(k=>{ const [f,e]=k.split('|'); return `${sApi(f)} — ${porF[k]} ${ET[e]}`; }));
  }
  if(gin.length){
    h += sTitulo('Examen ginecológico') + sCards([{n:gin.length, lab:'animales'}]);
    h += sLista(gin.map(x=>`${sApi(x.f)} — caravana ${x.caravana}${x.texto?': '+x.texto:''}`));
  }
  if(ccs.length){
    h += sTitulo('Condición corporal') + sBar('Distribución de CC (1 a 5)', sItems(sCuenta(ccs.map(String)), ['1','2','3','4','5']).map(i=>({label:'CC '+i.label, n:i.n})), ccs.length);
  }
  if(aplics.length) h += sBar('Aplicaciones', sItems(sCuenta(aplics)).sort((a,b)=>b.n-a.n), aplics.length);
  return h;
}

// ---- Quirúrgica ----
function cirugiasDeTrabajo(t){
  const pq = t.procedimientosQuirurgicos;
  if(!pq || !hasData(pq)) return [];
  const porAnimal = {};
  const gen = segNombrePaciente(t);
  function add(id, unidad){
    const k = id || gen || 'Sin identificar';
    if(!porAnimal[k]) porAnimal[k] = {trabajoId:t.id, fecha:t.fechaInicio, especie:t.especie, animalId:k, unidades:[], seg:(pq.seguimientoAnimales||{})[k]||null};
    porAnimal[k].unidades.push(unidad);
  }
  Object.entries(pq).forEach(([k,v])=>{
    if(k==='patologiasPodales' && v && v.animales){
      v.animales.forEach(a=>{
        if(!a.hallazgos || !a.hallazgos.length) return;
        add(a.caravana, {sistema:'Locomotor (patologías podales)', texto:podalGrupos(a).map(podalGrupoTexto).join(' | '), legacy:a.seguimiento||null, podal:a});
      });
      return;
    }
    if(CLAVES_NO_SISTEMA_QX.includes(k)) return;
    if(!v || !v.texto) return;
    add(v.caravana, {sistema:k, texto:v.texto, legacy:v.seguimiento||null});
  });
  return Object.values(porAnimal);
}
function statsHTMLQuirurgica(trabs){
  const cir = [];

  const tot = cir.length;
  let h = sTitulo('Procedimientos quirúrgicos') + sCards([{n:tot, lab:'animales intervenidos'},{n:alt, lab:'altas'},{n:des, lab:'descartes'},{n:seg, lab:'en seguimiento'}]);
  h += sBar('Resultado (sobre animales intervenidos)', [{label:'Altas', n:alt},{label:'Descartes', n:des},{label:'En seguimiento', n:seg}], tot);
  h += `<div class="fieldnote">% de éxito (altas ÷ intervenidos): <b>${Math.round(alt/tot*100)}%</b>${seg?' — provisorio: hay '+seg+' en seguimiento sin cerrar':''}</div>`;
  const sis = [];
  cir.forEach(c=>c.unidades.forEach(u=>sis.push(u.sistema)));
  h += sBar('Procedimientos por sistema', sItems(sCuenta(sis)).sort((a,b)=>b.n-a.n));
  // podales
  const patol = [], procs = [], miem = [];
  cir.forEach(c=>c.unidades.forEach(u=>{
    if(!u.podal) return;
    podalGrupos(u.podal).forEach(g=>{

      g.hall.forEach(hh=>{
        if(hh.tipo==='otro') return;
        const tp = PODAL_TIPOS.find(x=>x.id===hh.tipo); patol.push(tp?tp.lab:hh.tipo);
        (hh.miembros||[]).forEach(m=>miem.push(m));
        (hh.procedimientos||[]).forEach(p=>{ const b = p.split(' (')[0]; if(!pb.includes(b)) pb.push(b); });
      });
      pb.forEach(b=>procs.push(b));
    });
  }));
  if(patol.length){
    h += sTitulo('Patologías podales') + sCards([{n:patol.length, lab:'hallazgos'}]);
    h += sBar('Hallazgos por patología', sItems(sCuenta(patol)).sort((a,b)=>b.n-a.n));
    h += sBar('Miembros afectados', sItems(sCuenta(miem), ['AI','AD','PI','PD'].filter(k=>miem.includes(k))));
    h += sBar('Procedimientos realizados', sItems(sCuenta(procs)).sort((a,b)=>b.n-a.n));
  }
  h += sLista(cir.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).map(c=>{
    const e = segEstado(c); const s = c.seg||{};
    return `${sApi(c.fecha)} — ${c.animalId}: ${c.unidades.map(u=>u.sistema).join(', ')} — ${e==='alta'?'Alta'+(s.alta?' '+sApi(s.alta.fecha):''):e==='descarte'?'Descarte'+(s.descarte&&s.descarte.motivo?' ('+s.descarte.motivo+')':''):'En seguimiento'}${(s.controles||[]).length?' · '+s.controles.length+' control'+(s.controles.length>1?'es':''):''}`;
  }));
  return h;
}

function statsHTMLSanitaria(trabs){
  const vac = [], desp = [], lineas = [], trat = [];
  let aie = 0, animalesTrat = 0;
  trabs.forEach(t=>{
    const f = t.fechaInicio;
    const s = t.sanidad;
    if(s){
      const gr = s.masivo && s.masivo.vacunacion && s.masivo.vacunacion.grupos;
      (gr||[]).forEach(g=>{
        (g.vacunas||[]).forEach(v=>{ const lab = (v==='Otra'&&g.otraTexto)?'Otra: '+g.otraTexto:v; for(let i=0;i<g.animales.length;i++) vac.push(lab); });
        lineas.push(`${sApi(f)} — Vacuna ${labelVacunaGrupo(g)}: ${g.animales.length} animales (${g.animales.map(a=>a.caravana).join(', ')})${g.dosis?' · dosis '+g.dosis:''}${g.repetir?' · repetir '+g.repetir:''}${g.vet?' · vet. actuante '+g.vet:''}`);
      });
      if(s.masivo) Object.entries(s.masivo).forEach(([k,v])=>{ if(k!=='vacunacion' && v && v.filas && v.filas.length) v.filas.forEach(fl=>{ if(fl.producto) desp.push(fl.producto); }); if(k!=='vacunacion' && v && v.filas && v.filas.length) lineas.push(`${sApi(f)} — Masivo ${k}: ${v.filas.length} animales`); });
      if(s.individual) Object.entries(s.individual).forEach(([k,v])=>{ if(hasData(v)) lineas.push(`${sApi(f)} — Individual ${k}: ${campoResumen(v)}`); });
      VACUNAS.forEach(v=>{ if(s[v.key]){ if(v.key==='aie') aie++; else vac.push(v.label); lineas.push(`${sApi(f)} — ${v.label}`); } });
      const lista = listaVacunasPara(t.especie);
      if(lista && s.vacuna && typeof s.vacuna==='object') lista.forEach(v=>{ if(s.vacuna[v.key]){ vac.push(v.label); lineas.push(`${sApi(f)} — ${v.label}: aplicada ${sApi(s.vacuna[v.key].fecha)}`); } });
      else if(hasData(s.vacuna) && typeof s.vacuna!=='object') lineas.push(`${sApi(f)} — Vacuna: ${campoResumen(s.vacuna)}`);
      if(hasData(s.desparasitaciones)) lineas.push(`${sApi(f)} — Desparasitaciones: ${campoResumen(s.desparasitaciones)}`);
      if(hasData(s.otros)) lineas.push(`${sApi(f)} — Otros: ${campoResumen(s.otros)}`);
      if(s.sanidadMasiva && s.sanidadMasiva.filas) s.sanidadMasiva.filas.forEach(fl=>{ if(fl.tipoVacuna){ vac.push(fl.tipoVacuna); } });
    }
    const se = t.sanidadEquino;
    if(se && hasData(se)){
      const n = se.modo==='masivo' ? ((se.animalesIndividuales||[]).length || 1) : 1;
      const cant = id => (se.modo==='masivo' && se.dosis && Number(se.dosis[id])) ? Number(se.dosis[id]) : n;
      const v = se.vacunacion;
      if(v && v.seleccionadas) v.seleccionadas.forEach(id=>{ if(!v.aplicadaHoy[id]) return; const lab = id==='otra' ? 'Otra'+(v.otraTexto?': '+v.otraTexto:'') : SANIDAD_VACUNAS_EQUINO.find(x=>x.id===id).lab; for(let i=0;i<cant(id);i++) vac.push(lab); lineas.push(`${sApi(f)} — Vacuna ${lab}: ${cant(id)}`); });
      const d = se.desparasitacion;
      if(d && d.seleccionadas) d.seleccionadas.forEach(id=>{ if(!d.aplicadaHoy[id]) return; const lab = id==='otro' ? 'Otro'+(d.otroTexto?': '+d.otroTexto:'') : SANIDAD_DESPARASITANTES_EQUINO.find(x=>x.id===id).lab; for(let i=0;i<cant(id);i++) desp.push(lab); lineas.push(`${sApi(f)} — Desparasitación ${lab}: ${cant(id)}`); });
      if(se.aie && se.aie.tomada){ const c = cant('aie'); aie += c; lineas.push(`${sApi(f)} — Toma de muestra AIE: ${c}`); }
    }
    if(t.tratamiento && hasData(t.tratamiento)){
      if(hasData(t.tratamiento.individual)) lineas.push(`${sApi(f)} — Tratamiento individual: ${campoResumen(t.tratamiento.individual)}`);
      if(t.tratamiento.masivo && t.tratamiento.masivo.grupos) t.tratamiento.masivo.grupos.forEach(g=>{ animalesTrat += g.animales.length; trat.push(g.descripcion); lineas.push(`${sApi(f)} — Tratamiento: ${g.descripcion} — ${g.animales.length} animales${g.vet?' · vet. actuante '+g.vet:''}`); });
    }
    if(hasData(t.tratamientos)) lineas.push(`${sApi(f)} — Tratamiento: ${campoResumen(t.tratamientos)}`);
  });
  let h = sCards([{n:vac.length, lab:'vacunas aplicadas'},{n:desp.length, lab:'desparasitaciones'}].concat(aie?[{n:aie, lab:'tomas AIE'}]:[]).concat(animalesTrat?[{n:animalesTrat, lab:'animales tratados'}]:[]));
  h += sBar('Vacunas por tipo (animales)', sItems(sCuenta(vac)).sort((a,b)=>b.n-a.n));
  h += sBar('Desparasitaciones por producto', sItems(sCuenta(desp)).sort((a,b)=>b.n-a.n));
  h += sLista(lineas);
  return h;
}

function statsRegionesImagen(det){
  const out = [];
  if(!det || !hasData(det)) return out;
  if(det.abdominal && hasData(det.abdominal)) out.push('Abdominal');
  if(det.locomotor && hasData(det.locomotor)){
    RE_MIEMBROS.forEach(m=>{ ((det.locomotor.miembros||{})[m.id]||[]).forEach(z=>out.push(z.zona)); });
    if(det.locomotor.columna) out.push('Columna');
    if(det.locomotor.cadera && hasData(det.locomotor.cadera)) out.push('Cadera');
  }
  if(det.cadera && hasData(det.cadera)) out.push('Cadera');
  if(det.cabeza && hasData(det.cabeza)) out.push('Cabeza');
  if(det.otra && hasData(det.otra)) out.push('Otra');
  return out;
}
function statsHTMLComplementarios(trabs){
  const rx = [], eco = [], muestras = [], lineas = [];
  let sangreGrupal = 0;
  trabs.forEach(t=>{
    const ex = t.examenesComplementarios; if(!ex) return;
    const f = t.fechaInicio;
    const a = statsRegionesImagen(ex.radiografiaDetalle), b = statsRegionesImagen(ex.ecografiaDetalle);
    a.forEach(x=>rx.push(x)); b.forEach(x=>eco.push(x));
    if(a.length) lineas.push(`${sApi(f)} — Radiografía: ${a.join(', ')}`);
    if(b.length) lineas.push(`${sApi(f)} — Ecografía: ${b.join(', ')}`);
    if(ex.tomaMuestra && ex.tomaMuestra.tipos) ex.tomaMuestra.tipos.forEach(id=>{ const m = MUESTRA_TIPOS.find(x=>x.id===id); muestras.push(m?m.lab:id); });
    if(ex.tomaMuestra && ex.tomaMuestra.tipos && ex.tomaMuestra.tipos.length) lineas.push(`${sApi(f)} — Toma de muestra: ${ex.tomaMuestra.tipos.map(id=>{const m=MUESTRA_TIPOS.find(x=>x.id===id); return m?m.lab:id;}).join(', ')}`);

    ['radiografia','ecografia','sangrado','otro','otros'].forEach(k=>{ if(hasData(ex[k])) lineas.push(`${sApi(f)} — ${k}: ${campoResumen(ex[k])}`); });
  });
  let h = sCards([{n:rx.length, lab:'radiografías (regiones)'},{n:eco.length, lab:'ecografías (regiones)'},{n:muestras.length, lab:'tomas de muestra'}].concat(sangreGrupal?[{n:sangreGrupal, lab:'tubos de sangre'}]:[]));

    const conGdp = pes.filter(p=>p.gdp!==undefined);

      h += sBar('Ganancia diaria promedio por categoría (g/día)', Object.keys(porCatG).map(k=>({label:k, n:Math.max(0,Math.round(porCatG[k].reduce((a,b)=>a+b,0)/porCatG[k].length*1000))})), 1).replace(/ · \d+%/g,'');

function pacTrabajos(){

function pacProcedimientos(t){

  if(hasData(t.registro)) l.push('Registro');

  if(t.exploracionReproductiva && statsHas(t,'reproductiva')) l.push('Reproductiva');
  if(androToros(t).length) l.push('Andrológico');
  if(hasData(t.examenesComplementarios)) l.push('Complementarios');
  if(cirugiasDeTrabajo(t).length) l.push('Quirúrgico');
  if(hasData(t.tratamiento) || hasData(t.tratamientos)) l.push('Tratamiento');
  if(hasData(t.sanidad) || hasData(t.sanidadEquino)) l.push('Sanidad');
  if(hasData(t.necropsia)) l.push('Necropsia');
  if(hasData(t.nutricion)) l.push('Nutrición');

  return l;

function pacLineasIdent(t){
  const lineas = resumenTrabajo(t).split('\n');
  const re = new RegExp('(^|[^0-9a-zA-ZáéíóúñÁÉÍÓÚÑ])'+pacIdent.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^0-9a-zA-ZáéíóúñÁÉÍÓÚÑ]|$)','i');
  const out = []; let sec = '';
  const sangria = l => (l.match(/^\s*/)||[''])[0].length;
  for(let i=0;i<lineas.length;i++){
    const l = lineas[i];
    if(l && !/^\s/.test(l)) sec = l;
    if(re.test(l)){
      if(sec && !out.includes(sec) && l!==sec) out.push(sec);
      out.push(l);
      const base = sangria(l);
      // si es un encabezado del animal, incluir lo que está más adentro
      if(/:\s*$/.test(l) || !/ — /.test(l)){
        let j = i+1;
        while(j<lineas.length && lineas[j].trim() && sangria(lineas[j])>base){ out.push(lineas[j]); j++; }
        i = j-1;
      }
    }
  }
  return out.join('\n');
}

// --- Búsqueda profunda: recorre todo el trabajo (y el cliente asociado) buscando el texto ---
function textoIndexable(obj, profundidad){
  profundidad = profundidad || 0;
  if(obj==null || profundidad>8) return '';
  if(typeof obj==='string') return obj;
  if(typeof obj==='number') return String(obj);
  if(Array.isArray(obj)) return obj.map(o=>textoIndexable(o,profundidad+1)).join(' ');
  if(typeof obj==='object'){
    return Object.entries(obj).filter(([k])=>k!=='fotos').map(([,v])=>textoIndexable(v,profundidad+1)).join(' ');
  }
  return '';
}
function trabajoMatchesQuery(t, q){
  const cliente = t.clienteId ? clienteById(t.clienteId) : null;
  let texto = trabajosDeCadena(cadenaIdDe(t)).map(x=>textoIndexable(x)).join(' ');
  if(cliente) texto += ' ' + textoIndexable(cliente);
  return texto.toLowerCase().includes(q.toLowerCase());
}

    if(especieQ && t.especie!==especieQ) return false;
    if(fechaQ && (!t.fechaInicio || t.fechaInicio < fechaQ)) return false;
    const cliente = t.clienteId ? clienteById(t.clienteId) : null;
    if(clienteQ && !(cliente && clienteNombreCompleto(cliente).toLowerCase().includes(clienteQ))) return false;
    if(estabQ || renspaQ){
      const propios = t.establecimientoId ? ((cliente&&cliente.establecimientos)||[]).filter(e=>e.id===t.establecimientoId) : ((cliente&&cliente.establecimientos)||[]);
      if(estabQ && !propios.some(e=>(e.nombre||'').toLowerCase().includes(estabQ))) return false;
      if(renspaQ && !propios.some(e=>(e.renspa||'').toLowerCase().includes(renspaQ))) return false;
    }
    return true;
  });
  resultados = cadenasUnicas(resultados).sort((a,b)=>(b.fechaInicio||'').localeCompare(a.fechaInicio||''));
  document.getElementById('histAvanzadaResultados').innerHTML = renderResultadosHistorial(resultados);
}

function campoResumen(v){
  if(!v) return '';
  if(typeof v==='string') return v;
  let s = v.texto||'';
  if(v.fotos && v.fotos.length) s += ` [${v.fotos.length} foto${v.fotos.length===1?'':'s'}]`;
  return s;
}
const CLAVES_NO_SISTEMA_QX = ['protocoloAnestesico','patologiasPodales','locomotorModo','seguimientoAnimales','veterinarioActuante'];
function qxVetGuardar(){
  const v = vetLeer('qx');
  const pq = trabajoActual.procedimientosQuirurgicos;
  if(!pq) return;
  const hayOtros = Object.keys(pq).some(k=>k!=='veterinarioActuante' && hasData(pq[k]));
  if(v && hayOtros) pq.veterinarioActuante = v; else delete pq.veterinarioActuante;
}
function resumenSeguimientoCirugia(pq){
  const seg = pq && pq.seguimientoAnimales;
  let out = '';
  if(pq && pq.veterinarioActuante) out += `  Médico veterinario actuante: ${pq.veterinarioActuante}\n`;
  if(!seg) return out;
  Object.entries(seg).forEach(([animal, s])=>{
    const lineas = [];
    (s.controles||[]).forEach(k=> lineas.push(`Control ${fmtFecha(k.fecha)}${k.texto?': '+k.texto:''}${k.proximo?' (próximo control '+fmtFecha(k.proximo)+')':''}`));
    if(s.alta) lineas.push(`Alta ${fmtFecha(s.alta.fecha)}`);
    if(s.descarte) lineas.push(`Descarte ${fmtFecha(s.descarte.fecha)}${s.descarte.motivo?': '+s.descarte.motivo:''}`);
    if(lineas.length) out += `  Seguimiento de cirugía — ${animal}:\n` + lineas.map(l=>`    ${l}\n`).join('');
  });
  return out;
}
function resumenProtocoloAnestesico(pq){
  const drogas = (pq && pq.protocoloAnestesico && pq.protocoloAnestesico.drogas) || [];
  return drogas.length ? `  Protocolo anestésico utilizado: ${drogas.join(', ')}\n` : '';
}
function resumenTrabajo(t){
  if(t.especie==='Bovino') return resumenTrabajoBovino(t);
  if(t.especie==='Canino'||t.especie==='Felino'||t.especie==='Otros') return resumenTrabajoMascota(t);
  let out = `Especie: ${t.especie}\n`;
  if(t.datosPaciente && hasData(t.datosPaciente)) out += `\nPaciente: ${t.datosPaciente.nombre||'—'} · ${t.datosPaciente.pelaje||''} · ${t.datosPaciente.edad||''} · ${t.datosPaciente.sexo||''}\n`;
  if(t.exploracionClinica && hasData(t.exploracionClinica)){
    out += `\nExploración clínica:\n`;
    if(t.exploracionClinica.estadoGeneral) out += `  Estado general: ${t.exploracionClinica.estadoGeneral}\n`;
    if(t.exploracionClinica.condicionCorporal) out += `  Condición corporal: ${t.exploracionClinica.condicionCorporal}\n`;
    if(t.exploracionClinica.temperatura) out += `  Temperatura: ${t.exploracionClinica.temperatura}\n`;
    Object.entries(t.exploracionClinica.examenClinico||{}).forEach(([k,v])=>{ if(hasData(v)) out += `  Sistema explorado: ${k}\n    Comentario: ${campoResumen(v)}\n`; });
  }
  if(t.exploracionReproductiva && hasData(t.exploracionReproductiva)){
    const r = t.exploracionReproductiva;
    out += `\nExploración reproductiva: ${r.estadoGestacional||''}\n`;
    if(r.observaciones) out += `  Observaciones: ${r.observaciones}\n`;
    if(r.edadGestacional) out += `  Edad gestacional: ${r.edadGestacional}\n`;
    if(r.examenReproductivo) out += `  Examen: ${r.examenReproductivo}\n`;
  }
  if(t.examenesComplementarios && hasData(t.examenesComplementarios)){
    out += `\nExámenes complementarios:\n`;
    const etiquetasComp = {radiografia:'radiografía', ecografia:'ecografía', sangrado:'análisis de sangre', otros:'otros'};
    ['radiografia','ecografia','sangrado','otros'].forEach(k=>{ if(hasData(t.examenesComplementarios[k])) out += `  ${etiquetasComp[k]}: ${campoResumen(t.examenesComplementarios[k])}\n`; });
    const sm = t.examenesComplementarios.sangradoMasivo;
    if(sm && sm.tubos && sm.tubos.length){
      out += `  Análisis de sangre grupal: ${sm.tubos.length} animales\n`;
      sm.tubos.forEach((tb,i)=>{ const d=[tb.nombre,tb.edad,tb.pelaje,tb.sexo].filter(Boolean).join(', '); if(d) out += `    Tubo N°${i+1}: ${d}\n`; });
      if(sm.observaciones) out += `    Observaciones: ${sm.observaciones}\n`;
    }
    out += resumenTomaMuestra(t.examenesComplementarios.tomaMuestra);
    out += resumenExamenImagen('radiografia', t.examenesComplementarios.radiografiaDetalle);
    out += resumenExamenImagen('ecografia', t.examenesComplementarios.ecografiaDetalle);
  }
  if(t.procedimientosQuirurgicos && hasData(t.procedimientosQuirurgicos)){
    out += `\nProcedimientos quirúrgicos:\n`;
    out += resumenProtocoloAnestesico(t.procedimientosQuirurgicos);
    Object.entries(t.procedimientosQuirurgicos).filter(([k])=>!CLAVES_NO_SISTEMA_QX.includes(k)).forEach(([k,v])=>{ if(hasData(v)) out += `  Sistema intervenido: ${k}\n    Qué se hizo: ${campoResumen(v)}\n`; });
    out += resumenSeguimientoCirugia(t.procedimientosQuirurgicos);
  }
  if(hasData(t.tratamiento)) out += `\nTratamiento: ${campoResumen(t.tratamiento)}\n`;
  if(t.sanidad && hasData(t.sanidad)){
    out += `\nSanidad:\n`;
    VACUNAS.forEach(v=>{ if(t.sanidad[v.key]) out += `  ${v.label}: aplicada ${fmtFecha(t.sanidad[v.key].fecha)}, próxima ${fmtFecha(t.sanidad[v.key].proxima)}${t.sanidad[v.key].observaciones?' — '+t.sanidad[v.key].observaciones:''}\n`; });
    if(t.sanidad.sanidadMasiva && t.sanidad.sanidadMasiva.filas && t.sanidad.sanidadMasiva.filas.length){
      const fl = t.sanidad.sanidadMasiva.filas.filter(f=>f.nombre||f.tipoVacuna||f.edad||f.pelaje||f.sexo);
      out += `  Sanidad masiva: ${t.sanidad.sanidadMasiva.filas.length} animales\n`;
      fl.forEach(f=>{ out += `    ${[f.nombre,f.tipoVacuna,f.edad,f.pelaje,f.sexo].filter(Boolean).join(' · ')}\n`; });
    }
  }
  out += resumenSanidadEquino(t);
  out += resumenNecropsia(t.necropsia);
  out += resumenNutricion(t.nutricion);
  if(hasData(t.otroProcedimiento)) out += `\nOtro procedimiento: ${campoResumen(t.otroProcedimiento)}\n`;
  if(hasData(t.observacionesFinales)) out += `\nObservaciones: ${campoResumen(t.observacionesFinales)}\n`;
  return out;
}
function resumenTrabajoBovino(t){

          });
        }
        if(_et.length){

          _et.slice().sort((a,b)=> String(a.caravana).localeCompare(String(b.caravana), undefined, {numeric:true}) || (IATF_ORDEN[a.etapa]-IATF_ORDEN[b.etapa])).forEach(x=>{
            out += `    Caravana ${x.caravana||'—'} — ${IATF_PASOS[x.etapa]} (${fmtFecha(x.fecha)}): ${iatfDetalle(x)}\n`;
          });
        }
      }
      if(r.servicio.natural) out += `  Servicio natural: ${r.servicio.natural}\n`;
    }
    if(r.examenGinecologico && r.examenGinecologico.registros && r.examenGinecologico.registros.length){

      });

      if(a.cc) out += `  Condición corporal: ${a.cc}\n`;
      if(a.locomotor) out += `  Ap. locomotor: ${a.locomotor}\n`;
      if(a.vision) out += `  Ap. visión: ${a.vision}\n`;
      if(a.tonoTesticular) out += `  Tono testicular: ${a.tonoTesticular}\n`;
      if(a.glandulasAnexas) out += `  Exploración de glándulas anexas: ${a.glandulasAnexas}${a.glandulasAnexasObs?' — '+a.glandulasAnexasObs:''}\n`;
      if(hasData(a.circunferencia)) out += `  Circunferencia escrotal: ${campoResumen(a.circunferencia)}\n`;
      if(hasData(a.ecografia)) out += `  Ecografía testicular: ${campoResumen(a.ecografia)}\n`;
      if(hasData(a.calidadSeminal)) out += `  Calidad seminal: ${campoResumen(a.calidadSeminal)}\n`;
      if(a.raspaje==='Sí') out += `  Raspaje: ${a.raspajeTubo?'tubo '+a.raspajeTubo:'sí'}\n`;
      if(a.sangrado==='Sí') out += `  Sangrado: ${a.sangradoTubo?'tubo '+a.sangradoTubo:'sí'}\n`;
    });
  }
  if(t.examenesComplementarios && hasData(t.examenesComplementarios)){

          g.animales.forEach(a=> out += `      ${a.caravana}${bovColorSufijo(a)} - ${a.categoria}\n`);
        });
      } else if(v && v.filas && v.filas.length){
        out += `  Masivo - ${k}: ${v.filas.length} animales\n`;
        v.filas.forEach(f=>{ if(f.caravana||f.producto) out += `    Caravana ${f.caravana||'—'}${bovColorSufijo(f)}${f.producto?': '+f.producto:''}${f.dosis?', dosis '+f.dosis:''}${f.repetir?', repetir '+f.repetir:''}\n`; });
        if(v.observaciones) out += `    Observaciones: ${v.observaciones}\n`;
      }
    });
  }
  if(t.tratamiento && hasData(t.tratamiento)){
    out += `\nTratamiento:\n`;

    if(t.tratamiento.masivo && t.tratamiento.masivo.grupos && t.tratamiento.masivo.grupos.length){

        out += `    Animales tratados: ${g.animales.length}\n`;
        g.animales.forEach(a=> out += `      ${a.caravana}${bovColorSufijo(a)} - ${a.categoria}${a.observacion?' — '+a.observacion:''}\n`);

  out += resumenNecropsia(t.necropsia);
  out += resumenNutricion(t.nutricion);
  if(hasData(t.otroProcedimiento)) out += `\nOtro procedimiento: ${campoResumen(t.otroProcedimiento)}\n`;
  if(hasData(t.observacionesFinales)) out += `\nObservaciones: ${campoResumen(t.observacionesFinales)}\n`;
  return out;

function ejecutarBusquedaInformesAvanzada(){

    if(fechaQ && (!t.fechaInicio || t.fechaInicio<fechaQ)) return false;
    if(clienteQ){
      const cliente = t.clienteId?clienteById(t.clienteId):null;
      if(!(cliente && clienteNombreCompleto(cliente).toLowerCase().includes(clienteQ))) return false;
    }
    return true;
  }).sort((a,b)=>(b.fechaInicio||'').localeCompare(a.fechaInicio||''));
  document.getElementById('infAvanzadaResultados').innerHTML = renderResultadosInformes(resultados);
}
function renderResultadosInformes(resultados){
  if(!resultados.length) return '<div class="empty">No se encontraron resultados.</div>';
  return `<div class="sectiontitle">${resultados.length} resultado${resultados.length===1?'':'s'}</div>` + resultados.map(renderInformeListCard).join('');
}
function renderInformeListCard(t){
  const cliente = t.clienteId?clienteById(t.clienteId):null;
  const nombrePaciente = (t.datosPaciente&&t.datosPaciente.nombre)||(t.informacionGeneral&&t.informacionGeneral.paciente&&t.informacionGeneral.paciente.nombre)||'';
  if(t.estado==='finalizado'){
    return `<div class="listcard" style="cursor:default;">
      <div onclick="abrirInformeCompleto('${t.id}')" style="cursor:pointer;">
        <div class="top"><div class="name">${cliente?escapeHtml(clienteNombreCompleto(cliente)):'Sin cliente'}</div><div class="date">${fmtFecha(t.fechaInicio)}</div></div>
        <div class="meta">${t.especie}${nombrePaciente?' · '+escapeHtml(nombrePaciente):''}${etiquetaCadena(t)}${etiquetaEstablecimiento(t)}</div>
      </div>
      <div class="facturacionRow">
        <button class="factbtn ${t.facturado?'on':''}" onclick="toggleFacturado('${t.id}', this)">${t.facturado?'✓ ':''}Facturado</button>
        <button class="factbtn ${t.cobrado?'on':''}" onclick="toggleCobrado('${t.id}', this)">${t.cobrado?'✓ ':''}Cobrado</button>
      </div>
    </div>`;
  }
  return `<div class="listcard" onclick="retomarTrabajo('${t.id}')">
    <div class="top"><div class="name">${cliente?escapeHtml(clienteNombreCompleto(cliente)):'Sin cliente'}</div><div class="date">${fmtFecha(t.fechaInicio)}</div></div>
    <div class="meta">${t.especie}${nombrePaciente?' · '+escapeHtml(nombrePaciente):''}${etiquetaCadena(t)}${etiquetaEstablecimiento(t)}</div>
    <span class="tag parcial">En curso · tocá para continuar</span>
  </div>`;
}
function toggleFacturado(id, btn){
  const t=trabajos.find(x=>x.id===id); if(!t) return;
  t.facturado=!t.facturado; updateTrabajoDoc(id, {facturado:t.facturado});
  btn.classList.toggle('on', t.facturado);
  btn.textContent = (t.facturado?'✓ ':'')+'Facturado';
}
function toggleCobrado(id, btn){
  const t=trabajos.find(x=>x.id===id); if(!t) return;
  t.cobrado=!t.cobrado; updateTrabajoDoc(id, {cobrado:t.cobrado});
  btn.classList.toggle('on', t.cobrado);
  btn.textContent = (t.cobrado?'✓ ':'')+'Cobrado';
}

function recolectarFotos(obj, acc){
  acc = acc || [];
  if(!obj) return acc;
  if(Array.isArray(obj)){ obj.forEach(o=>recolectarFotos(o,acc)); return acc; }
  if(typeof obj==='object'){
    if(Array.isArray(obj.fotos)) acc.push(...obj.fotos);
    Object.entries(obj).forEach(([k,v])=>{ if(k!=='fotos') recolectarFotos(v,acc); });
  }
  return acc;
}
function renderInformeHTML(t, cliente, opts){
  opts = opts || {};
  let html = '';
  if(opts.sinCabecera){
    html += `<div style="margin-bottom:10px;"><b style="font-size:15px;">${escapeHtml(opts.titulo||fmtFecha(t.fechaInicio))}</b></div>`;
  } else {
  html += `<div style="margin-bottom:14px;">`;
  html += `<b style="font-size:15px;">${opts.titulo?escapeHtml(opts.titulo):fmtFecha(t.fechaInicio)}</b>`;
  html += `<div style="font-weight:700; font-size:13.5px; margin-top:2px;">${cliente?escapeHtml(clienteNombreCompleto(cliente)):'Sin cliente asociado'}</div>`;
  if(cliente && cliente.establecimientos && cliente.establecimientos.length){
    const estab = t.establecimientoId ? cliente.establecimientos.find(e=>e.id===t.establecimientoId) : null;
    if(estab){
      html += `<div class="fieldnote">${escapeHtml(estab.nombre)}${estab.renspa?' · RENSPA '+escapeHtml(estab.renspa):''}${estab.ubicacion?' · '+escapeHtml(estab.ubicacion):''}</div>`;
    } else {
      html += `<div class="fieldnote">${cliente.establecimientos.map(e=>escapeHtml(e.nombre)).join(' · ')}</div>`;
    }
  }
  html += `</div>`;
  }

  if(t.especie==='Bovino' && t.exploracionReproductiva && t.exploracionReproductiva.diagnosticoGestacion){
    const regs = t.exploracionReproductiva.diagnosticoGestacion.registros||[];
    if(regs.length){
      const pren = regs.filter(x=>x.resultado==='Preñada').length;
      const vac = regs.filter(x=>x.resultado==='Vacía').length;
      const pct = Math.round((pren/regs.length)*100);
      const cab = regs.filter(x=>x.subresultado==='Cabeza').length;
      const cue = regs.filter(x=>x.subresultado==='Cuerpo').length;
      const col = regs.filter(x=>x.subresultado==='Cola').length;
      html += `<div style="margin-bottom:16px;">
        <b>Diagnóstico de gestación — ${regs.length} animales</b>
        <div style="display:flex; height:22px; border-radius:5px; overflow:hidden; margin-top:8px;">
          <div style="width:${pct}%; background:var(--green);"></div>
          <div style="width:${100-pct}%; background:var(--line);"></div>
        </div>
        <div class="fieldnote">Preñadas: ${pren} (${pct}%) · Vacías: ${vac} (${100-pct}%)</div>
        ${pren?`<div class="fieldnote">De las preñadas — Cabeza: ${cab} · Cuerpo: ${cue} · Cola: ${col}</div>`:''}
      </div>`;
    }
  }

  html += `<div style="white-space:pre-wrap; font-size:12.5px; line-height:1.6;">${escapeHtml(resumenTrabajo(t))}</div>`;

  const fotos = recolectarFotos(t);
  if(fotos.length){
    html += `<div style="margin-top:14px;"><b>Fotos (${fotos.length})</b><div class="fotogrid" style="margin-top:8px;">${fotos.map(f=>`<div class="fotothumb" style="width:80px;height:80px;"><img src="${f}"></div>`).join('')}</div></div>`;
  }
  return html;
}
function textoCompartible(t){
  const cliente = t.clienteId?clienteById(t.clienteId):null;
  const ses = trabajosDeCadena(cadenaIdDe(t));
  const estab = establecimientoNombreDe(t.clienteId, t.establecimientoId);
  let out = `INFORME VETERINARIO\n${cliente?clienteNombreCompleto(cliente):'Sin cliente'}${estab?' · '+estab:''}\n${t.especie}\n`;
  if(ses.length<=1) return out + `${fmtFecha(t.fechaInicio)}\n\n${resumenTrabajo(t)}`;
  ses.forEach((x,i)=>{ out += `\n===== ${fmtFecha(x.fechaInicio)} =====\n${resumenTrabajo(x)}`; });
  return out;
}
function compartirWhatsapp(id){
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  window.open(`https://wa.me/?text=${encodeURIComponent(textoCompartible(t))}`, '_blank');
}
function compartirMail(id){
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  const cliente = t.clienteId?clienteById(t.clienteId):null;
  const asunto = encodeURIComponent(`Informe veterinario - ${cliente?clienteNombreCompleto(cliente):''} - ${fmtFecha(t.fechaInicio)}`);
  window.location.href = `mailto:?subject=${asunto}&body=${encodeURIComponent(textoCompartible(t))}`;
}
function copiarInformeTexto(id){
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  navigator.clipboard.writeText(textoCompartible(t)).then(()=>showToast('Informe copiado')).catch(()=>showToast('No se pudo copiar'));
}
function eliminarInforme(id){
  if(!confirm('¿Eliminar este informe? Esta acción no se puede deshacer.')) return;
  trabajos = trabajos.filter(t=>t.id!==id);
  deleteTrabajoDoc(id);
  informeVerId=null;
  navigate('informes');
}

// ================= CALENDARIO =================
let calMes = null; // 'YYYY-MM'
let calDiaSeleccionado = null; // 'YYYY-MM-DD'
function mesActualISO(){ return hoyISO().slice(0,7); }
function diasDelMes(mesISO){
  const [y,m] = mesISO.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function primerDiaSemanaDelMes(mesISO){
  const [y,m] = mesISO.split('-').map(Number);
  return new Date(y, m-1, 1).getDay();
}
function eventosDelDia(fecha){ return eventos.filter(e=>e.fecha===fecha); }
function viewCalendario(){
  if(!calMes) calMes = mesActualISO();
  if(calDiaSeleccionado) return viewCalendarioDia();
  const numDias = diasDelMes(calMes);
  const primerDia = primerDiaSemanaDelMes(calMes);
  const [y,m] = calMes.split('-');
  const nombreMes = new Date(Number(y), Number(m)-1, 1).toLocaleDateString('es-AR',{month:'long', year:'numeric'});
  let celdas = [];
  for(let i=0;i<primerDia;i++) celdas.push('');
  for(let d=1; d<=numDias; d++) celdas.push(d);
  return `
    <button class="backbtn" onclick="calMes=null; calDiaSeleccionado=null; navigate('home')">‹ Inicio</button>
    <div class="sectiontitle">Calendario</div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <button class="backbtn" style="margin:0;" onclick="calMesAnterior()">‹</button>
      <div style="font-weight:700; text-transform:capitalize;">${escapeHtml(nombreMes)}</div>
      <button class="backbtn" style="margin:0;" onclick="calMesSiguiente()">›</button>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:11px; color:var(--ink-soft); margin-bottom:4px;">
      ${['D','L','M','M','J','V','S'].map(d=>`<div>${d}</div>`).join('')}
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px;">
      ${celdas.map(d=>{
        if(!d) return `<div></div>`;
        const fecha = `${calMes}-${String(d).padStart(2,'0')}`;
        const tieneEventos = eventosDelDia(fecha).length>0;
        const esHoy = fecha===hoyISO();
        return `<div onclick="calDiaSeleccionado='${fecha}'; render()" style="aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:7px; cursor:pointer; font-size:13px; background:${esHoy?'var(--teal)':'var(--card)'}; color:${esHoy?'#08181A':'var(--ink)'}; border:1px solid var(--line); position:relative;">
          ${d}${tieneEventos?`<span style="position:absolute; bottom:3px; width:5px; height:5px; border-radius:50%; background:${esHoy?'#08181A':'var(--amber)'};"></span>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
}
function calMesAnterior(){
  const [y,m] = calMes.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  calMes = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function calMesSiguiente(){
  const [y,m] = calMes.split('-').map(Number);
  const d = new Date(y, m, 1);
  calMes = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function viewCalendarioDia(){
  const fecha = calDiaSeleccionado;
  const evs = eventosDelDia(fecha);
  return `
    <button class="backbtn" onclick="calDiaSeleccionado=null; render()">‹ Calendario</button>
    <div class="sectiontitle">${fmtFecha(fecha)}</div>
    <label>Nueva nota</label>
    <textarea id="cal_nota_nueva" placeholder="Ej: ir a tal campo..."></textarea>
    <button class="btn btn-teal" onclick="agregarEventoDia()">+ Agregar</button>
    ${evs.length ? `<div class="sectiontitle">Notas de este día</div>` + evs.map(e=>`
      <div class="listcard" style="cursor:default;">
        <div class="meta">${escapeHtml(e.nota)}</div>
        <div class="twobtn" style="margin-top:8px;">
          <button class="btn btn-outline" style="margin-top:0; padding:8px;" onclick="agregarEventoICS('${e.fecha}', ${escapeHtml(JSON.stringify(e.nota))})">📅 Agregar a mi calendario</button>
          <button class="btn btn-danger" style="margin-top:0; padding:8px;" onclick="eliminarEventoCal('${e.id}')">Eliminar</button>
        </div>
      </div>
    `).join('') : '<div class="fieldnote">Todavía no hay notas para este día.</div>'}
  `;
}
function agregarEventoDia(){
  const texto = document.getElementById('cal_nota_nueva').value.trim();
  if(!texto) return;
  const nuevo = {id:uid(), fecha: calDiaSeleccionado, nota:texto, creado: new Date().toISOString()};
  eventos.push(nuevo);
  saveEventoDoc(nuevo);
  render();
}
function eliminarEventoCal(id){
  eventos = eventos.filter(e=>e.id!==id);
  deleteEventoDoc(id);
  render();
}
function generarICS(fecha, nota){
  const dt = fecha.replace(/-/g,'');
  const now = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//IntegralVet//ES\r\nBEGIN:VEVENT\r\nUID:${uid()}@integralvet\r\nDTSTAMP:${now}\r\nDTSTART;VALUE=DATE:${dt}\r\nDTEND;VALUE=DATE:${dt}\r\nSUMMARY:${(nota||'Evento').replace(/\r?\n/g,' ')}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
}
function agregarEventoICS(fecha, nota){
  const ics = generarICS(fecha, nota);
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'evento.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ================= CADENAS DE TRABAJO (reabrir por sesiones) =================
function cadenaIdDe(t){ return t.cadenaId || t.id; }
function trabajosDeCadena(cid){
  return trabajos.filter(x=>cadenaIdDe(x)===cid).sort((a,b)=>(a.fechaInicio||'').localeCompare(b.fechaInicio||'') || (a.creado||'').localeCompare(b.creado||''));
}
function ultimoDeCadena(cid){ const l = trabajosDeCadena(cid); return l[l.length-1]; }
function cadenasUnicas(lista){
  const vistos = {}, out = [];
  lista.forEach(t=>{ const cid = cadenaIdDe(t); if(vistos[cid]) return; vistos[cid]=1; const u = ultimoDeCadena(cid); if(u) out.push(u); });
  return out;
}
function trabajosParaLista(estado){
  return cadenasUnicas(trabajos).filter(t=>t.estado===estado);
}
function etiquetaCadena(t){
  const n = trabajosDeCadena(cadenaIdDe(t)).length;
  return n>1 ? ` · ${n} sesiones` : '';
}
function etiquetaEstablecimiento(t){
  const e = establecimientoNombreDe(t.clienteId, t.establecimientoId);
  return e ? ' · '+escapeHtml(e) : '';
}
function resumenCadenaTexto(t){
  const ses = trabajosDeCadena(cadenaIdDe(t));
  if(ses.length<=1) return resumenTrabajo(t);
  return ses.map(x=>`===== ${fmtFecha(x.fechaInicio)} =====\n${resumenTrabajo(x)}`).join('\n');
}
function renderInformeCadenaHTML(t, cliente){
  const ses = trabajosDeCadena(cadenaIdDe(t));
  if(ses.length<=1) return renderInformeHTML(t, cliente);
  let html = '';
  ses.forEach((x,i)=>{
    const titulo = `Sesión ${i+1} — ${fmtFecha(x.fechaInicio)}`;
    html += `<div style="${i>0?'border-top:2px solid var(--line); margin-top:16px; padding-top:12px;':''}">`;
    html += renderInformeHTML(x, cliente, i===0 ? {titulo:fmtFecha(x.fechaInicio)+' · sesión 1'} : {sinCabecera:true, titulo});
    html += `</div>`;
  });
  return html;
}
function botonesSesionesInforme(t){
  const ses = trabajosDeCadena(cadenaIdDe(t));
  const ultimo = ses[ses.length-1];
  let h = '';
  if(ultimo.estado==='parcial') h += `<button class="btn btn-teal" onclick="retomarTrabajo('${ultimo.id}')">Continuar este trabajo (en curso)</button>`;
  else h += `<button class="btn btn-teal" onclick="continuarEnNuevaSesion('${ultimo.id}')">+ Agregar datos a este trabajo (nueva sesión)</button>`;
  if(ses.length>1) h += ses.map((x,i)=>`<button class="btn btn-outline" onclick="retomarTrabajo('${x.id}')">Reabrir y editar sesión ${i+1} (${fmtFecha(x.fechaInicio)})</button>`).join('');
  else h += `<button class="btn btn-outline" onclick="retomarTrabajo('${t.id}')">Reabrir y editar</button>`;
  return h;
}
function selectorAsignarEstablecimiento(t){
  const c = t.clienteId ? clienteById(t.clienteId) : null;
  if(!c || !c.establecimientos || c.establecimientos.length<2 || t.establecimientoId) return '';
  return `<div class="listcard" style="cursor:default; margin-top:12px;">
    <div class="meta"><b>Este trabajo no tiene establecimiento asignado.</b></div>
    <select onchange="asignarEstablecimientoTrabajo('${t.id}', this.value)">
      <option value="">Elegí el establecimiento...</option>
      ${c.establecimientos.map(e=>`<option value="${e.id}">${escapeHtml(e.nombre)}</option>`).join('')}
    </select></div>`;
}
function asignarEstablecimientoTrabajo(id, estabId){
  if(!estabId) return;
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  trabajosDeCadena(cadenaIdDe(t)).forEach(x=>{ x.establecimientoId = estabId; updateTrabajoDoc(x.id, {establecimientoId: estabId}); });
  showToast('Establecimiento asignado');
  render();
}
function trabajoPerteneceAEstab(t, clienteId, estabId){
  if(t.clienteId!==clienteId) return false;
  if((t.establecimientoId||null)===(estabId||null)) return true;
  const c = clienteById(clienteId);
  return !t.establecimientoId && c && (c.establecimientos||[]).length<=1;
}
let continuarEspecie = null;
function trabajosAnterioresDeContexto(especie){
  if(!clienteContexto) return [];
  return cadenasUnicas(trabajos.filter(t=>t.especie===especie && trabajoPerteneceAEstab(t, clienteContexto, clienteEstablecimientoContexto)))
    .sort((a,b)=>(b.fechaInicio||'').localeCompare(a.fechaInicio||''));
}
function iniciarEspecieConChequeo(esp){
  if(trabajosAnterioresDeContexto(esp).length){ continuarEspecie = esp; navigate('continuarAnterior'); return; }
  iniciarEspecieNuevo(esp);
}
function iniciarEspecieNuevo(esp){
  continuarEspecie = null;
  if(esp==='Equino') iniciarEquino();
  else if(esp==='Bovino') iniciarBovino();
  else iniciarMascota(esp);
}
function viewContinuarAnterior(){

  const lista = esp ? trabajosAnterioresDeContexto(esp) : [];
  const estabTxt = establecimientoNombreDe(clienteContexto, clienteEstablecimientoContexto);
  return `
    <button class="backbtn" onclick="continuarEspecie=null; navigate('nuevoTrabajoEspecie')">‹ Volver</button>
    <div class="sectiontitle">${cliente?escapeHtml(clienteNombreCompleto(cliente)):''}${estabTxt?' · '+escapeHtml(estabTxt):''}</div>
    <div class="fieldnote" style="margin-bottom:10px;">${emojiEspecie(esp)} ${esp}: ya hay trabajos anteriores. ¿Querés continuar uno o empezar uno nuevo?</div>
    <button class="btn btn-green" onclick="iniciarEspecieNuevo('${esp}')">+ Empezar un trabajo nuevo</button>
    <div class="sectiontitle" style="margin-top:16px;">Continuar uno anterior</div>
    ${lista.map(t=>{
      const nombre = (t.datosPaciente&&t.datosPaciente.nombre) || (t.informacionGeneral&&t.informacionGeneral.paciente&&t.informacionGeneral.paciente.nombre) || '';
      const accion = t.estado==='parcial' ? `retomarTrabajo('${t.id}')` : `continuarEnNuevaSesion('${t.id}')`;
      return `<div class="listcard" onclick="${accion}">
        <div class="top"><div class="name">${nombre?escapeHtml(nombre):esp}</div><div class="date">${fmtFecha(t.fechaInicio)}</div></div>
        <div class="meta">${t.estado==='parcial'?'En curso — seguir cargando':'Finalizado — agregar datos en una nueva sesión'}${etiquetaCadena(t)}</div>
      </div>`;
    }).join('')}
  `;
}
function continuarEnNuevaSesion(id){
  const base = trabajos.find(x=>x.id===id); if(!base) return;
  clienteContexto = base.clienteId; clienteEstablecimientoContexto = base.establecimientoId || null;
  iniciarEspecieNuevo(base.especie);
  const nuevo = trabajoActual;
  nuevo.cadenaId = cadenaIdDe(base);
  if(base.especie==='Equino' && base.datosPaciente) nuevo.datosPaciente = JSON.parse(JSON.stringify(base.datosPaciente));
  if(base.informacionGeneral && nuevo.informacionGeneral) nuevo.informacionGeneral = JSON.parse(JSON.stringify(base.informacionGeneral));
  render();
  showToast('Nueva sesión: '+fmtFecha(hoyISO()));
}

// ---------------- INIT ----------------
view = 'cargando';
render();
fbAuth.onAuthStateChanged(function(user){
  if(user){
    auth = {usuario: user.email};
    sesionActiva = true;
    attachListeners();
    navigate('home');
  } else {
    auth = null;
    sesionActiva = false;
    clientes = []; trabajos = []; eventos = [];
    detachListeners();
    navigate('login');
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){ console.warn('SW no registrado', err); });
  });
}
</script>
