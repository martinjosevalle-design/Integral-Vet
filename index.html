<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Integral Vet</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Integral Vet">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg: #10151B;
    --bg2: #161D25;
    --card: #1B232C;
    --card2: #212B36;
    --line: #2C3844;
    --ink: #ECEFF2;
    --ink-soft: #8B96A3;
    --teal: #159AA6;
    --teal-dk: #12444A;
    --green: #3F8F5F;
    --green-dk: #1E3A29;
    --purple: #6C5CA6;
    --purple-dk: #2E2748;
    --blue: #3568B0;
    --blue-dk: #1B2C49;
    --amber: #C99A3B;
    --red: #B5482A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  #app{max-width:460px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}
  header.topbar{
    background: var(--bg2); padding:16px 20px 14px; position:sticky; top:0; z-index:5;
    border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
  }
  header.topbar .brand{font-size:16.5px; font-weight:800; letter-spacing:0.3px;}
  header.topbar .brand span{color:var(--teal);}
  header.topbar .who{font-size:11px; color:var(--ink-soft); text-align:right;}
  .backbtn{background:none; border:none; color:var(--teal); font-size:14.5px; font-weight:700; cursor:pointer; padding:0; margin-bottom:14px;}
  main{flex:1; padding:18px 18px 78px; display:flex; flex-direction:column;}

  /* LOGIN */
  .splash{text-align:center; padding:60px 24px 24px; position:relative;}
  .selloMV{position:absolute; top:8px; right:14px; width:100px; height:100px; opacity:0.95;}
  .splash h1{font-size:26px; font-weight:800; margin:0;}
  .splash h1 span{color:var(--teal);}
  .splash p{font-size:12.5px; color:var(--ink-soft); margin-top:4px; letter-spacing:0.5px;}
  .splash .wm{font-size:11px; color:#3A4552; margin-top:30px; line-height:1.6;}
  .loginbox{margin-top:14px; text-align:left;}
  .remember{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12.5px; color:var(--ink-soft);}
  .remember input{width:auto;}

  label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:14px 0 6px;}
  label:first-of-type{margin-top:4px;}
  input[type=text], input[type=password], input[type=date], input[type=number], select, textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:14.5px; background:var(--card); color:var(--ink); font-family:inherit;
  }
  textarea{min-height:90px; resize:vertical; line-height:1.4;}
  input::placeholder, textarea::placeholder{color:#5A6472;}
  .btn{display:block; width:100%; padding:13px; border:none; border-radius:7px; font-size:14.5px; font-weight:700; cursor:pointer; margin-top:14px; font-family:inherit;}
  .btn-teal{background:var(--teal); color:#08181A;}
  .btn-green{background:var(--green); color:#08170F;}
  .btn-amber{background:var(--amber); color:#2A1E05;}
  .btn-outline{background:none; color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:none; color:var(--red); border:1px solid var(--red);}

  /* HOME GRID */
  .grid2{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px; margin-top:6px; flex:1; min-height:250px; max-height:340px;}
  .tile{border:none; border-radius:16px; padding:16px 14px; text-align:left; cursor:pointer; height:100%; display:flex; flex-direction:column; justify-content:space-between; color:#fff;}
  .tile .icon{font-size:28px;}
  .tile .label{font-weight:800; font-size:16.5px; margin-top:10px;}
  .tile .desc{font-size:12.5px; opacity:0.85; margin-top:3px; line-height:1.35;}
  .tile.teal{background:linear-gradient(160deg, var(--teal), var(--teal-dk));}
  .tile.green{background:linear-gradient(160deg, var(--green), var(--green-dk));}
  .tile.purple{background:linear-gradient(160deg, var(--purple), var(--purple-dk));}
  .tile.blue{background:linear-gradient(160deg, var(--blue), var(--blue-dk));}
  .tile:active{opacity:0.88;}

  .sectiontitle{font-size:12px; font-weight:700; color:var(--ink-soft); margin:22px 0 8px;}

  /* LISTS / CARDS */
  .searchbar{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; font-size:14px; background:var(--card); color:var(--ink); margin-bottom:10px;}
  .listcard{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:13px 14px; margin-bottom:9px; cursor:pointer;}
  .listcard .top{display:flex; justify-content:space-between; align-items:baseline;}
  .listcard .name{font-weight:700; font-size:14.5px;}
  .listcard .date{font-size:11px; color:var(--ink-soft);}
  .listcard .meta{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .tag{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:20px; margin-top:6px; margin-right:5px;}
  .tag.parcial{background:#3A2E14; color:var(--amber);}
  .tag.finalizado{background:var(--green-dk); color:#8FD9AA;}
  .empty{text-align:center; padding:40px 16px; color:var(--ink-soft); font-size:13.5px; line-height:1.5;}
  .twobtn{display:flex; gap:10px;}
  .twobtn .btn{flex:1;}

  /* Species picker */
  .speciesgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px;}
  .speciesbtn{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 10px; text-align:center; cursor:pointer; color:var(--ink);}
  .speciesbtn .emoji{font-size:34px; display:block;}
  .speciesbtn .lab{font-weight:700; font-size:13.5px; margin-top:8px; display:block;}
  .speciesbtn.disabled{opacity:0.4;}

  /* category menu */
  .catlist .cattile{
    display:flex; align-items:center; justify-content:space-between; background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:14px 15px; margin-bottom:9px; cursor:pointer;
  }
  .cattile .left{display:flex; align-items:center; gap:12px;}
  .cattile .emoji{font-size:19px;}
  .cattile .lab{font-weight:700; font-size:14px;}
  .cattile .check{color:#8FD9AA; font-size:16px;}
  .statusbar{display:flex; justify-content:space-between; align-items:center; background:var(--card2); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:12px; color:var(--ink-soft);}

  /* option buttons (Regular/Bueno/Malo etc) */
  .optrow{display:flex; gap:8px; margin-bottom:4px;}
  .optbtn{flex:1; padding:11px 4px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-size:13px; font-weight:700; cursor:pointer; text-align:center;}
  .optbtn.selected{background:var(--teal); border-color:var(--teal); color:#08181A;}

  .sublist .subtile{
    display:flex; align-items:center; justify-content:space-between; background:var(--card);
    border:1px solid var(--line); border-radius:7px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-size:13.5px;
  }
  .subtile .check{color:#8FD9AA;}

  .animalrow{display:flex; gap:6px; align-items:center; margin-bottom:8px; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:8px;}
  .animalrow .tubolab{font-size:11px; font-weight:700; color:var(--ink-soft); width:38px; flex-shrink:0;}
  .animalrow input, .animalrow select{flex:1; padding:8px; font-size:12.5px;}
  .removeanimal{background:none; border:none; color:var(--red); font-size:17px; cursor:pointer; padding:0 3px;}
  .addanimalbtn{background:none; border:1px dashed var(--line); color:var(--ink-soft); width:100%; padding:9px; border-radius:7px; font-size:13px; cursor:pointer; margin-bottom:10px;}

  .vacrow{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:13px 14px; margin-bottom:9px;}
  .vacrow .top{display:flex; justify-content:space-between; align-items:center;}
  .vacrow .lab{font-weight:700; font-size:13.5px;}
  .vacrow .prox{font-size:11.5px; color:var(--amber); margin-top:5px;}
  .vacbtn{background:var(--green-dk); color:#8FD9AA; border:none; border-radius:6px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer;}
  .vacbtn.done{background:var(--green); color:#08170F;}

  .estabcard{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px;}
  .estabcard .esth{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .estabcard .esth b{font-size:13px;}
  .removeestab{background:none; border:none; color:var(--red); font-size:12px; cursor:pointer;}
  .addestabbtn{background:none; border:1px dashed var(--line); color:var(--ink-soft); width:100%; padding:9px; border-radius:7px; font-size:13px; cursor:pointer; margin:6px 0 4px;}

  nav.bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px; background:var(--bg2); border-top:1px solid var(--line); display:flex; z-index:10;}
  nav.bottomnav button{flex:1; background:none; border:none; padding:9px 2px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;}
  nav.bottomnav .navicon{font-size:18px; opacity:0.5;}
  nav.bottomnav .navlab{font-size:9.5px; color:var(--ink-soft); font-weight:600;}
  nav.bottomnav button.active .navicon{opacity:1;}
  nav.bottomnav button.active .navlab{color:var(--teal);}

  .reportbox{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; font-size:12.5px; line-height:1.6; white-space:pre-wrap; margin-top:14px;}
  .reportWatermark{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); opacity:0.07; text-align:center; pointer-events:none; z-index:0; width:100%;}
  .reportWatermark img{width:130px; height:130px; display:block; margin:6px auto;}
  .reportWatermark .wmLine{font-weight:800; font-size:13px; letter-spacing:1.5px; text-transform:uppercase;}
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#000; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:30; opacity:0; transition:opacity 0.25s;}
  .toast.show{opacity:0.92;}
  .fieldnote{font-size:11px; color:var(--ink-soft); margin-top:5px; line-height:1.4;}
  .fotogrid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .fotothumb{position:relative; width:64px; height:64px; border-radius:7px; overflow:hidden; border:1px solid var(--line); flex-shrink:0;}
  .fotothumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .fotoremove{position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.65); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; cursor:pointer; line-height:1; padding:0;}
  .fotoaddbtn{display:inline-block; margin-top:6px; padding:8px 14px; border:1px dashed var(--line); border-radius:7px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;}
  .alertcard{background:#3A2E14; border-left:3px solid var(--amber); padding:10px 12px; border-radius:6px; font-size:12.5px; margin-bottom:8px; color:var(--ink);}
  .alertcard b{display:block; font-size:13px; margin-bottom:2px;}
  .factbtn{padding:9px 12px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink-soft); font-size:12.5px; font-weight:700; cursor:pointer; flex:1;}
  .factbtn.on{background:var(--green-dk); color:#8FD9AA; border-color:var(--green);}
  .facturacionRow{display:flex; gap:8px; margin-top:10px;}
  .placeholder-note{background:var(--card2); border:1px dashed var(--line); border-radius:8px; padding:18px; font-size:13px; color:var(--ink-soft); text-align:center; margin-top:16px;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar" style="display:none;">
    <div class="brand">INTEGRAL <span>VET</span></div>

  </header>
  <main id="main"></main>
  <nav class="bottomnav" id="bottomnav" style="display:none;"></nav>
  <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
// ---------------- FIREBASE ----------------
const firebaseConfig = {
  apiKey: "AIzaSyA46A-OgUjghFBI5KSCQxzTfgSg42egNZY",
  authDomain: "integral-vet-562c9.firebaseapp.com",
  projectId: "integral-vet-562c9",
  storageBucket: "integral-vet-562c9.firebasestorage.app",
  messagingSenderId: "559439940184",
  appId: "1:559439940184:web:b27e177314622401ebd82d"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(err){
  console.warn('No se pudo fijar persistencia de sesión:', err.code);
});
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(function(err){
  console.warn('Persistencia offline no disponible:', err.code);
});

// ---------------- STATE ----------------
let clientes = [];
let trabajos = [];
let eventos = [];
let auth = null;          // {usuario}
let sesionActiva = false;
let view = 'login';
let editingId = null;
let trabajoActual = null;
let historialFiltro = 'todos';
let historialBusqueda = '';
let clienteBusqueda = '';
let clienteContexto = null; // clienteId preseleccionado al iniciar un trabajo
let clienteEstablecimientoContexto = null; // establecimientoId preseleccionado al iniciar un trabajo

const SISTEMAS = ['Respiratorio','Digestivo','Circulatorio','Locomotor','Urogenital','Neurológico','Tegumentario','Sentidos especiales'];
const ANESTESICOS_INDIVIDUALES = ['Acepromazina','Tramadol','Butorfanol','Xilacina','Ketamina','Diazepam','Lidocaína'];
const ANESTESICOS_COMBINACIONES = ['Xilacina + Butorfanol','Ketamina + Xilacina','Ketamina + Diazepam'];
const PODAL_TIPOS = [
  {id:'sobrecrecimiento', lab:'Sobrecrecimiento'},
  {id:'callo', lab:'Callo interdigital'},
  {id:'ulcera', lab:'Úlcera'},
  {id:'dobleSuela', lab:'Doble suela'},
  {id:'otro', lab:'Observaciones'},
];
const PODAL_MIEMBROS = [
  {id:'AI', lab:'Miembro anterior izquierdo'},
  {id:'AD', lab:'Miembro anterior derecho'},
  {id:'PI', lab:'Miembro posterior izquierdo'},
  {id:'PD', lab:'Miembro posterior derecho'},
];
const PODAL_PROCEDIMIENTOS_FULL = ['Desvasado funcional','Lavaje','Amputación','Cauterización','Colocación de sulfato de cobre','Vendaje','Antibiótico terapia','Antiinflamatorio'];
const PODAL_ANTIBIOTICOS = ['Ceftiofur','Ceftiofur LA','Tilmicosina'];
const PODAL_ANTIINF = ['Flunixin','Dexametasona','Ketoprofeno'];
const SANIDAD_CATEGORIAS_BOVINO = ['Toro','Vaca','Vaquillona','Torito','Novillo','Ternero','Ternera'];
const SANIDAD_VACUNAS_BOVINO = ['Complejo respiratorio y queratoconjuntivitis','Clostridiales','Neonatal','Reproductiva','Diarrea viral bovina','Triple','Otra'];
const MUESTRA_TIPOS = [
  {id:'sangre', lab:'Sangre'},
  {id:'orina', lab:'Orina'},
  {id:'materiaFecal', lab:'Materia fecal'},
  {id:'tejido', lab:'Tejido'},
  {id:'exudado', lab:'Exudado'},
  {id:'medulaOsea', lab:'Médula ósea'},
  {id:'liquidoCefalorraquideo', lab:'Líquido cefalorraquídeo'},
  {id:'otro', lab:'Otro'},
];
const MUESTRA_ANALISIS_VENOPUNCION = ['Hemograma completo','Proteínas totales','Urea/Creatinina','Perfil hepático','Perfil renal','Ácidos grasos','Triglicéridos','Glucemia','Hemocultivo','Perfil de rendimiento','Minerales','Enfermedades venéreas','Bilirrubina','Otros'];
const MUESTRA_MINERALES = ['Calcio','Fósforo','Magnesio','Hierro','Cobre','Selenio','Otro'];
const MUESTRA_VENEREAS = ['P.I. común','Brucela','Neospora','Otro'];
const MUESTRA_ANALISIS_ORINA = ['Células','Sedimento','Cultivo','Glucosa','Cuerpos cetónicos','Pigmento','Otro'];
const MUESTRA_TECNICAS = {
  sangre: ['Venopunción','Punción'],
  orina: ['Sondaje','Punción'],
  materiaFecal: ['Directa','Indirecta'],
  tejido: ['Biopsia','Contacto','Hisopado','PAF','PAAF'],
  exudado: ['Contacto','Hisopado'],
  medulaOsea: ['Punción','Aspiración'],
  liquidoCefalorraquideo: ['Punción'],
};
const SISTEMA_ICONOS = {'Respiratorio':'🫁','Digestivo':'🍽️','Circulatorio':'🫀','Locomotor':'🦴','Urogenital':'💧','Neurológico':'🧠','Tegumentario':'🩹','Sentidos especiales':'👁️'};
function iconoSistema(s){
  if(s==='Digestivo'){
    const esp = trabajoActual ? trabajoActual.especie : null;
    if(esp==='Canino'||esp==='Felino') return '🍖';
    if(esp==='Equino'||esp==='Bovino') return '🌿';
    return '🌿';
  }
  return SISTEMA_ICONOS[s];
}
const COMPLEMENTARIO_ICONOS = {radiografia:'🩻', ecografia:'📡', sangrado:'🩸', sangradoMasivo:'🩸🩸', otros:'➕', otro:'➕', datosAnimal:'📋'};
const VACUNAS = [
  {key:'adenitis', label:'Adenitis', dias:365, tipo:'vacuna'},
  {key:'influenza', label:'Influenza', dias:90, tipo:'vacuna'},
  {key:'encefalomielitis', label:'Encefalomielitis', dias:365, tipo:'vacuna'},
  {key:'rabia', label:'Rabia', dias:365, tipo:'vacuna'},
  {key:'antitetanica', label:'Antitetánica', dias:365, tipo:'vacuna'},
  {key:'aie', label:'AIE (Anemia Infecciosa Equina)', dias:60, tipo:'análisis'},
];
const SANIDAD_VACUNAS_EQUINO = [
  {id:'adenitis', lab:'Adenitis', dias:365},
  {id:'influenza', lab:'Influenza', dias:90},
  {id:'encefalomielitis', lab:'Encefalomielitis', dias:365},
  {id:'rabia', lab:'Rabia', dias:365},
  {id:'antitetanica', lab:'Antitetánica', dias:365},
  {id:'otra', lab:'Otra'},
];
const SANIDAD_DESPARASITANTES_EQUINO = [
  {id:'fenbendazol', lab:'Fenbendazol'},
  {id:'mebendazol', lab:'Mebendazol'},
  {id:'praziquantel', lab:'Praziquantel'},
  {id:'pirantel', lab:'Pirantel'},
  {id:'ivermectina', lab:'Ivermectina'},
  {id:'triclorfon', lab:'Triclorfón'},
  {id:'otro', lab:'Otro'},
];

// ---------------- STORAGE (Firebase, offline-first) ----------------
let unsubClientes = null;
let unsubTrabajos = null;
let unsubEventos = null;

function attachListeners(){
  if(unsubClientes) unsubClientes();
  if(unsubTrabajos) unsubTrabajos();
  if(unsubEventos) unsubEventos();
  unsubClientes = db.collection('clientes').onSnapshot(function(snap){
    clientes = snap.docs.map(function(d){ return d.data(); });
    if(sesionActiva) render();
  }, function(err){ console.error('Error sincronizando clientes', err); });
  unsubTrabajos = db.collection('trabajos').onSnapshot(function(snap){
    trabajos = snap.docs.map(function(d){ return d.data(); });
    if(sesionActiva) render();
  }, function(err){ console.error('Error sincronizando trabajos', err); });
  unsubEventos = db.collection('eventos').onSnapshot(function(snap){
    eventos = snap.docs.map(function(d){ return d.data(); });
    if(sesionActiva) render();
  }, function(err){ console.error('Error sincronizando eventos', err); });
}
function detachListeners(){
  if(unsubClientes){ unsubClientes(); unsubClientes=null; }
  if(unsubTrabajos){ unsubTrabajos(); unsubTrabajos=null; }
  if(unsubEventos){ unsubEventos(); unsubEventos=null; }
}
function saveClienteDoc(c){ db.collection('clientes').doc(c.id).set(c).catch(function(err){ console.error(err); }); }
function deleteClienteDoc(id){ db.collection('clientes').doc(id).delete().catch(function(err){ console.error(err); }); }
function saveTrabajoDoc(t){ db.collection('trabajos').doc(t.id).set(t).catch(function(err){ console.error(err); showToast('No se pudo guardar (¿informe muy pesado en fotos?)'); }); }
function updateTrabajoDoc(id, campos){ db.collection('trabajos').doc(id).update(campos).catch(function(err){ console.error(err); }); }
function deleteTrabajoDoc(id){ db.collection('trabajos').doc(id).delete().catch(function(err){ console.error(err); }); }
function saveEventoDoc(e){ db.collection('eventos').doc(e.id).set(e).catch(function(err){ console.error(err); }); }
function deleteEventoDoc(id){ db.collection('eventos').doc(id).delete().catch(function(err){ console.error(err); }); }

window.addEventListener('online', function(){ showToast('Conectado — sincronizando cambios'); });
window.addEventListener('offline', function(){ showToast('Sin conexión — los cambios se guardan en el dispositivo'); });

// ---------------- HELPERS ----------------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function fmtFecha(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function sumarDias(iso, dias){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+dias); return d.toISOString().slice(0,10); }
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ---------------- FOTOS (genérico, se usa en cualquier campo de texto) ----------------
function leerFotoInput(inputEl, callback){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxAncho = 900;
      const escala = Math.min(1, maxAncho / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * escala;
      canvas.height = img.height * escala;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.6));
      inputEl.value = '';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function agregarFotoA(path, dataUrl){
  let obj = trabajoActual;
  for(let i=0;i<path.length-1;i++){ if(!obj[path[i]]) obj[path[i]]={}; obj=obj[path[i]]; }
  const key = path[path.length-1];
  if(!obj[key] || typeof obj[key]!=='object') obj[key] = {texto:'', fotos:[]};
  if(!obj[key].fotos) obj[key].fotos=[];
  obj[key].fotos.push(dataUrl);
}
function quitarFotoDe(path, idx){
  let obj = trabajoActual;
  for(let i=0;i<path.length-1;i++){ obj=obj[path[i]]; }
  const key = path[path.length-1];
  if(obj[key] && obj[key].fotos) obj[key].fotos.splice(idx,1);
  render();
}
function fotosBlock(fotos, path){
  const pathLiteral = `[${path.map(p=>`'${p}'`).join(',')}]`;
  const inputId = 'fotoinput_' + path.join('_').replace(/[^a-zA-Z0-9_]/g,'');
  return `
    <div class="fotogrid">
      ${(fotos||[]).map((f,i)=>`<div class="fotothumb"><img src="${f}"><button class="fotoremove" onclick="quitarFotoDe(${pathLiteral}, ${i})">✕</button></div>`).join('')}
    </div>
    <label class="fotoaddbtn" for="${inputId}">📷 Agregar foto</label>
    <input type="file" accept="image/*" id="${inputId}" style="display:none" onchange="leerFotoInput(this, (data)=>{ agregarFotoA(${pathLiteral}, data); render(); })">
  `;
}
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

function ingresar(){

  });
}
function recuperarPass(){
  const usuario = document.getElementById('loginUsuario').value.trim();
  if(!usuario){ showToast('Escribí tu email arriba primero'); return; }
  fbAuth.sendPasswordResetEmail(usuario).then(function(){
    showToast('Te enviamos un mail para recuperar la contraseña');
  }).catch(function(err){ showToast(mensajeErrorAuth(err)); });
}
function mensajeErrorAuth(err){
  const map = {
    'auth/invalid-email':'Email inválido',
    'auth/user-not-found':'No existe una cuenta con ese email',
    'auth/wrong-password':'Contraseña incorrecta',
    'auth/invalid-credential':'Email o contraseña incorrectos',
    'auth/too-many-requests':'Demasiados intentos, esperá un momento',
    'auth/network-request-failed':'Sin conexión — probá cuando tengas señal',
  };
  return map[err.code] || 'No se pudo ingresar, probá de nuevo';
}

function establecimientoNombreDe(clienteId, establecimientoId){
  const c = clienteId ? clienteById(clienteId) : null;
  if(!c || !establecimientoId || !c.establecimientos) return '';
  const e = c.establecimientos.find(x=>x.id===establecimientoId);
  return e ? (e.nombre||'') : '';
}
function recordatoriosVacunasMasivas(){
  const out = [];
  trabajos.forEach(t=>{
    if(t.especie==='Bovino' && t.sanidad && t.sanidad.masivo && t.sanidad.masivo.vacunacion && t.sanidad.masivo.vacunacion.grupos){
      t.sanidad.masivo.vacunacion.grupos.forEach((g,gi)=>{
        if(g.repetir && !g.repetirHecho){
          out.push({trabajoId:t.id, grupoIndex:gi, clienteId:t.clienteId, establecimientoId:t.establecimientoId, fecha:t.fechaInicio, vacuna:labelVacunaGrupo(g), repetir:g.repetir, animales:g.animales.length});
        }
      });
    }
  });
  out.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  return out;
}
function marcarRecordatorioVacunaHecho(trabajoId, grupoIndex){
  const t = trabajos.find(x=>x.id===trabajoId);
  if(!t) return;
  t.sanidad.masivo.vacunacion.grupos[grupoIndex].repetirHecho = true;
  saveTrabajoDoc(t);
  render();
}
function proximasVacunas(){
  const hoy = hoyISO();
  const limite = sumarDias(hoy, 2);
  const resultado = [];
  trabajos.forEach(t=>{
    if(t.especie==='Equino' && t.sanidad){
      VACUNAS.forEach(v=>{
        const d = t.sanidad[v.key];
        if(d && d.proxima && d.proxima>=hoy && d.proxima<=limite){
          resultado.push({clienteId:t.clienteId, label:v.label, fecha:d.proxima, paciente:(t.datosPaciente&&t.datosPaciente.nombre)||''});
        }
      });
    }
    if((t.especie==='Canino'||t.especie==='Felino') && t.sanidad && t.sanidad.vacuna && typeof t.sanidad.vacuna==='object'){
      const lista = listaVacunasPara(t.especie) || [];
      lista.forEach(v=>{
        const d = t.sanidad.vacuna[v.key];
        if(d && d.proxima && d.proxima>=hoy && d.proxima<=limite){
          resultado.push({clienteId:t.clienteId, label:v.label, fecha:d.proxima, paciente:(t.informacionGeneral&&t.informacionGeneral.paciente&&t.informacionGeneral.paciente.nombre)||''});
        }
      });
    }
  });
  resultado.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return resultado;
}
function recordatoriosSanidadEquino(){
  const hoy = hoyISO();
  const out = [];
  trabajos.forEach(t=>{
    if(t.especie!=='Equino' || !t.sanidadEquino) return;
    const se = t.sanidadEquino;
    const cantidadBase = (se.modo==='masivo' && se.masivoTipo==='individual') ? (se.animalesIndividuales?se.animalesIndividuales.length:0) : null;
    (se.vacunacion.seleccionadas||[]).forEach(id=>{
      if(id==='otra') return;
      if(!se.vacunacion.aplicadaHoy[id] || se.vacunacion.recordatorioHecho[id]) return;
      const proxima = se.vacunacion.proxima[id];
      if(!proxima || hoy < sumarDias(proxima, -5)) return;
      const def = SANIDAD_VACUNAS_EQUINO.find(v=>v.id===id);
      let cantidad = null;
      if(se.modo==='masivo') cantidad = se.masivoTipo==='dosis' ? (se.dosis[id]||0) : cantidadBase;
      out.push({trabajoId:t.id, tipo:'vacuna', key:id, label:def.lab, fecha:proxima, clienteId:t.clienteId, establecimientoId:t.establecimientoId, cantidad});
    });
    if(se.aie && se.aie.tomada && !se.aie.recordatorioHecho && se.aie.proxima && hoy >= sumarDias(se.aie.proxima, -5)){
      let cantidad = null;
      if(se.modo==='masivo') cantidad = se.masivoTipo==='dosis' ? (se.dosis['aie']||0) : cantidadBase;
      out.push({trabajoId:t.id, tipo:'aie', key:'aie', label:'Toma de muestra AIE', fecha:se.aie.proxima, clienteId:t.clienteId, establecimientoId:t.establecimientoId, cantidad});
    }
  });
  out.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  return out;
}
function marcarRecordatorioSanidadEquinoHecho(trabajoId, tipo, key){
  const t = trabajos.find(x=>x.id===trabajoId);
  if(!t || !t.sanidadEquino) return;
  if(tipo==='aie') t.sanidadEquino.aie.recordatorioHecho = true;
  else t.sanidadEquino.vacunacion.recordatorioHecho[key] = true;
  saveTrabajoDoc(t);
  render();
}
function recordatoriosCalendario(){
  const hoy = hoyISO();
  const limite = sumarDias(hoy, 2);
  return eventos.filter(e=>e.fecha && e.fecha>=hoy && e.fecha<=limite).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

function filtrarClientesLive(){
  const el = document.getElementById('buscaCliente');
  const q = (el ? el.value : '').toLowerCase();
  const cont = document.getElementById('listaClientes');
  if(!cont) return;
  const filtrados = clientes.filter(c=>{
    const estabTxt = (c.establecimientos||[]).map(e=>e.nombre+' '+(e.renspa||'')).join(' ').toLowerCase();
    return clienteNombreCompleto(c).toLowerCase().includes(q) || estabTxt.includes(q) || (c.telefono||'').toLowerCase().includes(q);
  });
  if(!filtrados.length){ cont.innerHTML = `<div class="empty">No hay clientes que coincidan.</div>`; return; }
  cont.innerHTML = filtrados.map(c=>{
    const nTrab = trabajos.filter(t=>t.clienteId===c.id).length;
    return `<div class="listcard" onclick="abrirClientePerfil('${c.id}')">
      <div class="top"><div class="name">${escapeHtml(clienteNombreCompleto(c))}</div></div>
      <div class="meta">${(c.establecimientos||[]).map(e=>escapeHtml(e.nombre)).join(', ') || 'Sin establecimientos cargados'}</div>
      <span class="tag finalizado">${nTrab} trabajo${nTrab===1?'':'s'}</span>
    </div>`;
  }).join('');
}

function guardarCliente(irANuevoTrabajo){
  const data = {
    nombre: document.getElementById('f_nombre').value.trim(),
    apellido: document.getElementById('f_apellido').value.trim(),
    telefono: document.getElementById('f_telefono').value.trim(),
    establecimientos: window._establecimientosTmp,
  };
  let id = editingId;
  let clienteFinal;
  if(editingId){
    clienteFinal = Object.assign(clienteById(editingId), data);
  } else {
    id = uid();
    clienteFinal = {id, ...data};
    clientes.push(clienteFinal);
  }
  saveClienteDoc(clienteFinal);
  showToast('Cliente guardado');
  if(irANuevoTrabajo){ clienteContexto = id; clienteEstablecimientoContexto=null; editingId=null; navigate('nuevoTrabajoEspecie'); }
  else { editingId=id; navigate('clientePerfil'); }
}
function eliminarCliente(id){
  if(!confirm('¿Eliminar este cliente? Los trabajos registrados se conservan.')) return;
  clientes = clientes.filter(c=>c.id!==id);
  deleteClienteDoc(id);
  navigate('clientes');
}

function hasData(obj){
  if(!obj) return false;
  if(typeof obj === 'string') return obj.trim().length>0;
  if(Array.isArray(obj)) return obj.length>0;
  if(typeof obj === 'object') return Object.values(obj).some(v=>hasData(v));
  return !!obj;
}

// --- Toma de muestra (compartido entre especies) ---
let muestraContexto = null; // 'equino'|'bovino'|'mascota'
let muestraStep = null; // 'tipos'|'config'|'modo'|'datos'|'observaciones'
let muestraConfigTipo = null;
function iniciarTomaMuestra(contexto, targetKey){
  muestraContexto = contexto;
  const ex = trabajoActual.examenesComplementarios;
  if(!ex[targetKey]) ex[targetKey] = {tipos:[], detalle:{}, modo:null, individual:{}, masivo:{animales:[]}, observaciones:''};
  window._muestraTargetKey = targetKey;
  muestraStep = 'tipos';
  render();
}
function muestraObjetoActual(){ return trabajoActual.examenesComplementarios[window._muestraTargetKey]; }
function volverDesdeMuestra(){
  const volverA = muestraContexto;
  muestraStep = null; muestraContexto = null; muestraConfigTipo=null;
  if(volverA==='equino') navigate('equino-complementarios');
  else if(volverA==='bovino') render();
  else render();
}
function catTomaMuestra(){
  const tm = muestraObjetoActual();
  if(muestraStep==='tipos') return muestraPasoTipos(tm);
  if(muestraStep==='config') return muestraPasoConfig(tm);
  if(muestraStep==='modo') return muestraPasoModo(tm);
  if(muestraStep==='datos') return muestraPasoDatos(tm);
  if(muestraStep==='observaciones') return muestraPasoObservaciones(tm);
  return '';
}
function toggleMuestraTipo(id){
  const tm = muestraObjetoActual();
  const i = tm.tipos.indexOf(id);
  if(i>=0) tm.tipos.splice(i,1); else tm.tipos.push(id);
  render();
}
function muestraPasoTipos(tm){
  return `
    <button class="backbtn" onclick="volverDesdeMuestra()">‹ Exámenes complementarios</button>
    <div class="sectiontitle">Toma de muestra</div>
    <div class="fieldnote" style="margin-bottom:6px;">¿Qué tipo(s) de muestra vas a tomar?</div>
    <div class="optrow" style="flex-wrap:wrap;">${MUESTRA_TIPOS.map(t=>`<div class="optbtn ${tm.tipos.includes(t.id)?'selected':''}" onclick="toggleMuestraTipo('${t.id}')">${t.lab}</div>`).join('')}</div>

}
function muestraTipoConfigurado(tm, tipoId){
  const d = tm.detalle[tipoId];

}
function muestraPasoConfig(tm){

    <div class="sectiontitle">Configurá cada muestra</div>
    <div class="sublist">
      ${tm.tipos.map(id=>{
        const lab = MUESTRA_TIPOS.find(t=>t.id===id).lab;
        return `<div class="subtile" onclick="muestraConfigTipo='${id}'; render()"><span>${lab}</span>${muestraTipoConfigurado(tm,id)?'<span class="check">✓</span>':''}</div>`;

function muestraSetDetalle(tipoId, campo, valor){
  const tm = muestraObjetoActual();

  tm.detalle[tipoId][campo] = valor;

function tm_setModo(m){ muestraObjetoActual().modo = m; render(); }

}
function muestraPasoDatos(tm){
  const especie = trabajoActual.especie;
  if(tm.modo==='masivo'){
    if(especie==='Bovino') return muestraDatosMasivoBovino(tm);
    return muestraDatosMasivoEquino(tm);
  }
  return muestraDatosIndividual(tm, especie);
}
function muestraDatosIndividual(tm, especie){

  const campoLabel = especie==='Bovino' ? 'Caravana' : 'Nombre';
  const volver = (especie==='Canino'||especie==='Felino'||especie==='Otros') ? "muestraStep='config'; muestraConfigTipo=null; render()" : "muestraStep='modo'; render()";

function muestraGuardarIndividual(campoId){
  const tm = muestraObjetoActual();

function muestraAgregarAnimalMasivoEquino(){

  tm.masivo.animales.push({

    raza: document.getElementById('muestra_masivo_raza').value.trim(),
    pelaje: document.getElementById('muestra_masivo_pelaje').value.trim(),
    sexo: document.getElementById('muestra_masivo_sexo').value.trim(),
    edad: document.getElementById('muestra_masivo_edad').value.trim(),

    ['muestra_masivo_raza','muestra_masivo_pelaje','muestra_masivo_sexo','muestra_masivo_edad'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });

function resumenTomaMuestra(tm){
  if(!tm || !tm.tipos || !tm.tipos.length) return '';
  let out = `  Toma de muestra:\n`;
  tm.tipos.forEach(tipoId=>{
    const lab = MUESTRA_TIPOS.find(t=>t.id===tipoId).lab;
    const d = tm.detalle[tipoId] || {};
    if(tipoId==='otro'){
      if(d.texto) out += `    Otro: ${d.texto}\n`;
      return;
    }
    let linea = `    ${lab}`;
    if(d.tecnica) linea += ` (${d.tecnica})`;
    out += linea+'\n';
    if(tipoId==='sangre'){
      if(d.tecnica==='Punción') out += `      Análisis: Frotis\n`;
      else if(d.analisis && d.analisis.length){
        out += `      Análisis: ${d.analisis.map(a=> a==='Otros'&&d.otroTexto ? `Otros: ${d.otroTexto}` : a).join(', ')}\n`;
        if(d.minerales && d.minerales.length) out += `      Minerales: ${d.minerales.join(', ')}\n`;
        if(d.venereas && d.venereas.length) out += `      Enfermedades venéreas: ${d.venereas.join(', ')}\n`;
      }
    } else if(tipoId==='orina' || tipoId==='materiaFecal' || tipoId==='medulaOsea'){
      if(d.analisis && d.analisis.length){
        out += `      Análisis: ${d.analisis.map(a=> (a==='Otro'||a==='Otros')&&d.otroTexto ? `${a}: ${d.otroTexto}` : a).join(', ')}\n`;
      }
    } else if(d.texto){
      out += `      ${d.texto}\n`;
    }
  });
  if(tm.modo==='individual' && tm.individual && hasData(tm.individual)){
    const ind = tm.individual;
    const idCampo = ind.caravana!==undefined ? `Caravana ${ind.caravana||'—'}${bovColorSufijo(ind)}` : `Nombre ${ind.nombre||'—'}`;
    out += `    Paciente: ${idCampo} · ${ind.raza||''} · ${ind.pelaje||''} · ${ind.sexo||''} · ${ind.edad||''}\n`;
  } else if(tm.modo==='masivo' && tm.masivo && tm.masivo.animales && tm.masivo.animales.length){
    out += `    Animales (${tm.masivo.animales.length}):\n`;
    tm.masivo.animales.forEach(a=>{
      if(a.caravana!==undefined) out += `      ${a.caravana}${bovColorSufijo(a)}\n`;
      else out += `      ${a.nombre} · ${a.raza||''} · ${a.pelaje||''} · ${a.sexo||''} · ${a.edad||''}\n`;
    });
  }
  if(tm.observaciones) out += `    Observaciones: ${tm.observaciones}\n`;
  return out;
}

function resumenExamenImagen(tipo, det){
  if(!det || !hasData(det)) return '';
  const nombre = tipo==='radiografia' ? 'Radiografía' : 'Ecografía';
  let out = `  ${nombre}:\n`;
  if(tipo==='ecografia' && det.abdominal && hasData(det.abdominal)) out += `    Abdominal: ${campoResumen(det.abdominal)}\n`;
  if(det.locomotor && hasData(det.locomotor)){
    RE_MIEMBROS.forEach(m=>{
      const lista = det.locomotor.miembros[m.id];
      if(lista && lista.length){
        out += `    ${m.lab}:\n`;
        lista.forEach(z=>{
          out += `      ${z.zona}${z.incidencias&&z.incidencias.length?' — Incidencias: '+z.incidencias.join(', '):''}\n`;
          if(hasData(z.hallazgos)) out += `        Hallazgos: ${campoResumen(z.hallazgos)}\n`;
        });
      }
    });
    if(det.locomotor.columna){
      const c = det.locomotor.columna;
      out += `    Columna (${c.tramos.join(', ')})${c.incidencias&&c.incidencias.length?' — Incidencias: '+c.incidencias.join(', '):''}\n`;
      if(hasData(c.hallazgos)) out += `      Hallazgos: ${campoResumen(c.hallazgos)}\n`;
    }
    if(tipo==='ecografia' && det.locomotor.cadera && hasData(det.locomotor.cadera)) out += `    Cadera: ${campoResumen(det.locomotor.cadera)}\n`;
  }
  if(tipo==='radiografia'){
    if(det.cadera && hasData(det.cadera)) out += `    Cadera${det.cadera.incidencias?' (Incidencias: '+det.cadera.incidencias+')':''}: ${campoResumen(det.cadera.hallazgos)}\n`;
    if(det.cabeza && hasData(det.cabeza)) out += `    Cabeza${det.cabeza.incidencias?' (Incidencias: '+det.cabeza.incidencias+')':''}: ${campoResumen(det.cabeza.hallazgos)}\n`;
  }
  if(det.otra && hasData(det.otra)) out += `    Otra: ${campoResumen(det.otra)}\n`;
  return out;
}

let seguimientoCirugiaActivo = false;
let seguimientoFiltroFecha = '';
let segFecha = '', segSel = null, segForm = null;
function segNombrePaciente(t){
  return (t.datosPaciente&&t.datosPaciente.nombre) || (t.informacionGeneral&&t.informacionGeneral.paciente&&t.informacionGeneral.paciente.nombre) || '';
}
// Todas las cirugías (agrupadas por animal y por trabajo) del cliente + establecimiento + especie del trabajo actual
function listarCirugiasContexto(){
  const t0 = trabajoActual;
  let src = [t0];
  if(t0.clienteId) src = trabajos.filter(x=>x.id!==t0.id && x.especie===t0.especie && trabajoPerteneceAEstab(x, t0.clienteId, t0.establecimientoId)).concat([t0]);
  const out = [];
  src.forEach(t=>cirugiasDeTrabajo(t).forEach(c=>out.push(c)));
  out.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return out;
}
function segEstado(c){
  const s = c.seg || {};
  if(s.descarte) return 'descarte';
  if(s.alta) return 'alta';
  const leg = c.unidades.map(u=>u.legacy).filter(Boolean);
  if(leg.some(l=>l.alta===true)) return 'alta';
  if(leg.some(l=>l.alta===false)) return 'descarte';
  return 'seguimiento';
}
function segTrabajo(id){ return trabajoActual && trabajoActual.id===id ? trabajoActual : trabajos.find(x=>x.id===id); }
function segMut(fn){
  if(!segSel) return;
  const t = segTrabajo(segSel.trabajoId); if(!t) return;
  if(!t.procedimientosQuirurgicos) t.procedimientosQuirurgicos = {};
  const pq = t.procedimientosQuirurgicos;
  if(!pq.seguimientoAnimales) pq.seguimientoAnimales = {};
  if(!pq.seguimientoAnimales[segSel.animalId]) pq.seguimientoAnimales[segSel.animalId] = {controles:[], alta:null, descarte:null};
  fn(pq.seguimientoAnimales[segSel.animalId], t);
  if(!trabajoActual || t.id!==trabajoActual.id) saveTrabajoDoc(t);
  render();
}
function eventoNuevo(fecha, nota, origen, t){
  const ev = {id:uid(), fecha, nota, creado:new Date().toISOString(), origen, clienteId:(t&&t.clienteId)||null, establecimientoId:(t&&t.establecimientoId)||null};
  eventos.push(ev); saveEventoDoc(ev); return ev;
}
function segAbrir(trabajoId, animalId){ segSel = {trabajoId, animalId}; segForm = null; render(); }
function segGuardarControl(){
  const texto = (document.getElementById('seg_c_texto').value||'').trim();
  const fecha = document.getElementById('seg_c_fecha').value || hoyISO();
  const prox = document.getElementById('seg_c_prox').value || '';
  if(!texto && !prox){ showToast('Escribí el control o cargá la fecha del próximo'); return; }
  segMut((seg,t)=>{
    const c = {id:uid(), fecha, texto, proximo:prox||null};
    if(prox){
      const cn = t.clienteId ? clienteNombreCompleto(clienteById(t.clienteId)||{}) : '';
      const en = establecimientoNombreDe(t.clienteId, t.establecimientoId);
      const ev = eventoNuevo(prox, `Control de cirugía — ${segSel.animalId}${[cn,en].filter(Boolean).length?' · '+[cn,en].filter(Boolean).join(' · '):''}`, 'cirugia-control', t);
      c.eventoId = ev.id;
    }
    seg.controles.push(c);
    segForm = null;
  });
}
function segQuitarControl(i){
  if(!confirm('¿Eliminar este control?')) return;
  segMut(seg=>{ const c = seg.controles[i]; if(c && c.eventoId){ eventos = eventos.filter(e=>e.id!==c.eventoId); deleteEventoDoc(c.eventoId); } seg.controles.splice(i,1); });
}
function segAlta(){
  segMut(seg=>{
    if(seg.alta){ if(!confirm('¿Quitar el alta?')) return; seg.alta=null; return; }
    seg.alta = {fecha:hoyISO()}; seg.descarte = null;
  });
}
function segDescarte(){
  const ya = segEstadoActual() === 'descarte';
  if(ya){ if(!confirm('¿Quitar el descarte?')) return; segMut(seg=>{ seg.descarte=null; }); return; }
  const motivo = prompt('Motivo del descarte (opcional)', '');
  if(motivo===null) return;
  segMut(seg=>{ seg.descarte = {fecha:hoyISO(), motivo:motivo.trim()}; seg.alta = null; });
}
function segEstadoActual(){
  if(!segSel) return null;
  const c = listarCirugiasContexto().find(x=>x.trabajoId===segSel.trabajoId && x.animalId===segSel.animalId);
  return c ? segEstado(c) : null;
}
function segTag(e){
  return e==='alta' ? '<span class="tag finalizado">Alta</span>' : e==='descarte' ? '<span class="tag parcial" style="background:#fdeaea; color:#a33;">Descarte</span>' : '<span class="tag parcial">En seguimiento</span>';
}
function segDetalleHTML(c){
  const s = c.seg || {};
  const leg = c.unidades.map(u=>u.legacy).filter(Boolean);
  return `
    ${c.unidades.map(u=>`<div class="listcard" style="cursor:default;"><div class="meta"><b>${escapeHtml(u.sistema)}</b></div><div class="meta" style="white-space:pre-wrap;">${escapeHtml(u.texto)}</div></div>`).join('')}

    ${leg.map(l=> l.alta===true||l.alta===false||l.nota ? `<div class="fieldnote">${l.alta===true?'✅ Alta (registro anterior)':l.alta===false?'⛔ Descarte (registro anterior)':''}${l.nota?' · '+escapeHtml(l.nota):''}</div>`:'').join('')}
  `;
}
function catSeguimientoCirugia(volverJS){
  const todas = listarCirugiasContexto();
  const fecha = segFecha || hoyISO();
  if(segSel){
    const c = todas.find(x=>x.trabajoId===segSel.trabajoId && x.animalId===segSel.animalId);

      return `

          <button class="btn btn-green" style="margin-top:0;" onclick="segAlta()">${est==='alta'?'✓ Alta':'Alta'}</button></div>
          <button class="btn btn-outline" onclick="segDescarte()">${est==='descarte'?'✓ Descarte (tocá para quitar)':'Descarte'}</button>

  const delDia = todas.filter(c=>c.fecha===fecha);

      <div class="listcard" onclick="segAbrir(${JSON.stringify(c.trabajoId).replace(/"/g,'&quot;')}, ${JSON.stringify(c.animalId).replace(/"/g,'&quot;')})">
        <div class="top"><div class="name">${escapeHtml(c.animalId)}</div><div class="date">${segTag(segEstado(c))}</div></div>
        <div class="meta">${c.unidades.map(u=>escapeHtml(u.sistema)).join(' · ')}</div>
        ${c.seg&&c.seg.controles&&c.seg.controles.length?`<div class="meta">${c.seg.controles.length} control${c.seg.controles.length>1?'es':''}</div>`:''}
      </div>`).join('') : `<div class="fieldnote">No hay cirugías cargadas en esa fecha para este ${trabajoActual.clienteId?'cliente y establecimiento':'trabajo'}.</div>`}
  `;
}

let sanidadMasivaActiva = false; // legacy, ya no se usa desde la UI pero se conserva por compatibilidad
let sanidadEquinoSub = null; // null|'vacunacion'|'desparasitacion'|'aie'|'masivoElegir'|'masivoIndividual'|'masivoDosis'
function initSanidadEquino(){
  if(!trabajoActual.sanidadEquino){
    trabajoActual.sanidadEquino = {
      modo: null,
      vacunacion: {seleccionadas:[], serie:{}, otraTexto:'', aplicadaHoy:{}, fecha:{}, proxima:{}, recordatorioHecho:{}},
      desparasitacion: {seleccionadas:[], detalle:{}, otroTexto:'', aplicadaHoy:{}, fecha:{}},
      aie: {tomada:false, fecha:null, proxima:null, recordatorioHecho:false},
      masivoTipo: null,
      animalesIndividuales: [],
      dosis: {}
    };
  }
  return trabajoActual.sanidadEquino;
}
function se_setModo(m){ trabajoActual.sanidadEquino.modo = m; render(); }
function catSanidad(){
  const se = initSanidadEquino();
  if(se.modo===null) return catSanidadElegirModo();
  if(sanidadEquinoSub==='vacunacion') return catSanidadVacunacion(se);
  if(sanidadEquinoSub==='desparasitacion') return catSanidadDesparasitacion(se);
  if(sanidadEquinoSub==='aie') return catSanidadAIE(se);
  if(sanidadEquinoSub==='masivoElegir') return catSanidadMasivoElegir();
  if(sanidadEquinoSub==='masivoIndividual') return catSanidadMasivoIndividual(se);
  if(sanidadEquinoSub==='masivoDosis') return catSanidadMasivoDosis(se);
  return catSanidadMenu(se);
}
function catSanidadElegirModo(){
  return `
    <button class="backbtn" onclick="volverACategorias()">‹ Categorías</button>
    <div class="sectiontitle">Sanidad</div>
    <div class="fieldnote" style="margin-bottom:10px;">¿Es una atención individual o masiva?</div>
    <div class="optrow">
      <div class="optbtn" onclick="se_setModo('individual')">Individual</div>
      <div class="optbtn" onclick="se_setModo('masivo')">Masiva</div>
    </div>
  `;
}
function catSanidadMenu(se){
  const vacOk = se.vacunacion.seleccionadas.length>0;

function resumenSanidadEquino(t){
  const se = t.sanidadEquino;
  if(!se || !hasData(se)) return '';
  let out = `\nSanidad (${se.modo==='individual'?'individual':'masiva'}):\n`;
  if(se.veterinarioActuante) out += `  Médico veterinario actuante: ${se.veterinarioActuante}\n`;
  const vac = se.vacunacion;
  if(vac && vac.seleccionadas && vac.seleccionadas.length){
    vac.seleccionadas.forEach(id=>{
      if(id==='otra'){ if(vac.otraTexto) out += `  Vacuna (otra): ${vac.otraTexto}\n`; return; }
      const def = SANIDAD_VACUNAS_EQUINO.find(v=>v.id===id);
      let linea = `  Vacuna: ${def.lab}`;
      if(vac.serie[id]) linea += ` — serie ${vac.serie[id]}`;
      out += linea+'\n';
      if(vac.aplicadaHoy[id]) out += `    Aplicada: ${fmtFecha(vac.fecha[id])} — Refuerzo: ${fmtFecha(vac.proxima[id])}\n`;
    });
  }
  const desp = se.desparasitacion;
  if(desp && desp.seleccionadas && desp.seleccionadas.length){
    desp.seleccionadas.forEach(id=>{
      if(id==='otro'){ if(desp.otroTexto) out += `  Desparasitación (otro): ${desp.otroTexto}\n`; return; }
      const def = SANIDAD_DESPARASITANTES_EQUINO.find(d=>d.id===id);
      let linea = `  Desparasitación: ${def.lab}`;
      if(desp.detalle[id]) linea += ` — ${desp.detalle[id]}`;
      out += linea+'\n';
      if(desp.aplicadaHoy[id]) out += `    Aplicada: ${fmtFecha(desp.fecha[id])} — Se recomienda desparasitar nuevamente de 90 a 120 días a partir de la fecha\n`;
    });
  }
  if(se.aie && se.aie.tomada) out += `  Toma de muestra AIE: ${fmtFecha(se.aie.fecha)} — Próxima toma de muestra: ${fmtFecha(se.aie.proxima)}\n`;
  if(se.modo==='masivo'){
    if(se.masivoTipo==='individual' && se.animalesIndividuales && se.animalesIndividuales.length){
      out += `  Animales (${se.animalesIndividuales.length}):\n`;
      se.animalesIndividuales.forEach(a=>{ out += `    ${a.nombre} · ${a.raza||''} · ${a.pelaje||''} · ${a.sexo||''} · ${a.edad||''}\n`; });
    } else if(se.masivoTipo==='dosis' && se.dosis && hasData(se.dosis)){
      out += `  Dosis aplicadas:\n`;
      Object.entries(se.dosis).forEach(([id,cant])=>{
        if(!cant) return;
        let lab;
        if(id==='aie') lab='Toma de muestra AIE';
        else { const dv=SANIDAD_VACUNAS_EQUINO.find(v=>v.id===id); const dd=SANIDAD_DESPARASITANTES_EQUINO.find(d=>d.id===id); lab = dv?dv.lab:(dd?dd.lab:id); }
        out += `    ${lab}: ${cant}\n`;
      });
    }
  }
  return out;
}

function fmtNum(n, dec){ return (Math.round(n*Math.pow(10,dec))/Math.pow(10,dec)).toString().replace('.',','); }
function pesadasHistorial(caravana){
  const t = trabajoActual, out = [];
  const src = trabajos.filter(x=>x.id!==t.id && x.especie==='Bovino' && trabajoPerteneceAEstab(x, t.clienteId, t.establecimientoId)).concat([t]);
  src.forEach(x=>{ ((x.nutricion&&x.nutricion.pesadas)||[]).forEach(p=>{ if(String(p.caravana)===String(caravana)) out.push(p); }); });
  return out.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
}
function pesoHintHTML(caravana){
  if(!caravana) return '';
  const h = pesadasHistorial(caravana);
  if(!h.length) return '';
  const u = h[h.length-1];
  return `Último peso: ${fmtNum(u.peso,1)} kg (${fmtFecha(u.fecha)}). Anteriores: ${h.length}`;

function agregarPesada(){
  const d = window._pesoTmp;
  const car = d.caravana.trim();
  const peso = parseFloat(String(d.peso).replace(',','.'));
  if(!car){ showToast('Falta la caravana'); return; }
  if(!d.categoria){ showToast('Elegí la categoría'); return; }
  if(!(peso>0)){ showToast('Falta el peso'); return; }
  const hoy = hoyISO();
  const h = pesadasHistorial(car).filter(x=>x.fecha<hoy);
  const rec = {caravana:car, categoria:d.categoria, peso, fecha:hoy};
  if(d.cc) rec.cc = d.cc;
  if(h.length){
    const prev = h[h.length-1], first = h[0];
    const dias = Math.round((new Date(hoy)-new Date(prev.fecha))/86400000);
    rec.prevPeso = prev.peso; rec.prevFecha = prev.fecha;
    if(dias>0) rec.gdp = (peso-prev.peso)/dias;
    const diasAc = Math.round((new Date(hoy)-new Date(first.fecha))/86400000);
    if(h.length>1 && diasAc>0){ rec.gdpAcum = (peso-first.peso)/diasAc; rec.primerFecha = first.fecha; rec.primerPeso = first.peso; }
  }
  if(!trabajoActual.nutricion) trabajoActual.nutricion = {texto:'', fotos:[]};
  if(!trabajoActual.nutricion.pesadas) trabajoActual.nutricion.pesadas = [];
  trabajoActual.nutricion.pesadas.push(rec);
  window._pesoTmp = {caravana:'', categoria:null, peso:'', cc:null};
  showToast('Peso guardado');
  render();
}
function quitarPesada(i){ if(!confirm('¿Eliminar esta pesada?')) return; trabajoActual.nutricion.pesadas.splice(i,1); render(); }
function pesadaTexto(p){
  let o = `${fmtNum(p.peso,1)} kg`;
  if(p.cc) o += `, CC ${p.cc}`;
  if(p.prevPeso!==undefined){
    const dif = p.peso-p.prevPeso;
    o += ` — anterior ${fmtNum(p.prevPeso,1)} kg (${fmtFecha(p.prevFecha)}), ${dif>=0?'+':''}${fmtNum(dif,1)} kg`;
    if(p.gdp!==undefined) o += `, ganancia diaria ${fmtNum(p.gdp,2)} kg/día`;
    if(p.gdpAcum!==undefined) o += `, acumulada desde ${fmtFecha(p.primerFecha)} ${fmtNum(p.gdpAcum,2)} kg/día`;
  }
  return o;
}

function btnEditarIdent(v, clave){

}
function listaCargadosIdent(regs, detalle){
  if(!regs || !regs.length) return '';
  return `<div class="sectiontitle">Cargados (${regs.length})</div>${regs.map(x=>`
    <div class="listcard" style="cursor:default;"><div class="meta"><b>Caravana ${escapeHtml(x.caravana)}</b>${escapeHtml(bovExtrasLinea(x))} ${btnEditarIdent(x.caravana)}</div>
    <div class="meta">${escapeHtml(detalle(x))}</div></div>`).join('')}`;
}
function reemplazarIdent(obj, clave, viejo, nuevo){
  let n = 0;
  (function walk(o){
    if(!o || typeof o!=='object') return;
    if(Array.isArray(o)){ o.forEach(walk); return; }
    if(typeof o[clave]==='string' || typeof o[clave]==='number'){ if(String(o[clave])===viejo){ o[clave]=nuevo; n++; } }
    Object.keys(o).forEach(k=>{ if(o[k] && typeof o[k]==='object') walk(o[k]); });
  })(obj);
  return n;
}
function corregirIdent(clave, viejo){
  const etiqueta = clave==='caravana' ? 'caravana' : (clave==='nombre' ? 'nombre' : clave);
  const nuevo = prompt('Nueva identificación ('+etiqueta+')', viejo);
  if(nuevo===null) return;
  const v = nuevo.trim();
  if(!v || v===viejo) return;
  const t = trabajoActual;
  // aviso si ya existe en el establecimiento
  const ya = [t].concat(trabajos.filter(x=>x.id!==t.id && x.especie===t.especie && trabajoPerteneceAEstab(x, t.clienteId, t.establecimientoId)))
    .some(x=>{ const c = JSON.stringify(x); return c.includes('"'+clave+'":"'+v.replace(/"/g,'\\"')+'"'); });
  if(ya && !confirm('Ya existe "'+v+'" cargado en este establecimiento. ¿Cambiar igual?')) return;
  let n = reemplazarIdent(t, clave, viejo, v);
  if(typeof podalAnimalActivo!=='undefined' && podalAnimalActivo===viejo) podalAnimalActivo = v;
  trabajos.filter(x=>x.id!==t.id && x.especie===t.especie && trabajoPerteneceAEstab(x, t.clienteId, t.establecimientoId)).forEach(x=>{
    if(reemplazarIdent(x, clave, viejo, v)){ saveTrabajoDoc(x); }
  });
  showToast(n ? 'Identificación actualizada' : 'No se encontró');
  render();
}

// ===== IATF en 3 pasos: colocación → retiro → inseminación =====
let iatfPaso = null, iatfSel = null, iatfBusq = '';
const IATF_PASOS = {colocacion:'Colocación de dispositivo', retiro:'Retiro de dispositivo', inseminacion:'Inseminación artificial'};
function lsGet(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function lsSet(k,v){ try{ if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){} }

// eventos de calendario agrupados (un evento por día/origen/establecimiento)
function eventoAgrupado(origen, fecha, titulo){
  const t = trabajoActual;
  const cn = t.clienteId ? clienteNombreCompleto(clienteById(t.clienteId)||{}) : '';
  const en = establecimientoNombreDe(t.clienteId, t.establecimientoId);
  const sufijo = [cn, en].filter(Boolean).join(' · ');
  let e = eventos.find(x=>x.origen===origen && x.fecha===fecha && x.clienteId===(t.clienteId||null) && x.establecimientoId===(t.establecimientoId||null));
  if(e){ e.n = (e.n||1)+1; }
  else { e = {id:uid(), fecha, creado:new Date().toISOString(), origen, clienteId:t.clienteId||null, establecimientoId:t.establecimientoId||null, n:1}; eventos.push(e); }
  e.nota = `${titulo} — ${e.n} animal${e.n>1?'es':''}${sufijo?' · '+sufijo:''}`;
  saveEventoDoc(e);
  return e;
}
function iatfContexto(){
  const t = trabajoActual, out = [];
  const otros = trabajos.filter(x=>x.id!==t.id && x.especie==='Bovino' && trabajoPerteneceAEstab(x, t.clienteId, t.establecimientoId));
  otros.concat([t]).forEach(x=>{
    const l = (x.exploracionReproductiva && x.exploracionReproductiva.servicio && x.exploracionReproductiva.servicio.iatf) || [];
    l.forEach(r=>{ if(r.etapa) out.push(r); });
  });
  return out;
}
const IATF_ORDEN = {colocacion:1, retiro:2, inseminacion:3};
function iatfPendientes(paso){
  // animales cuya última etapa registrada es la anterior a 'paso'
  const previa = paso==='retiro' ? 'colocacion' : 'retiro';
  const por = {};
  iatfContexto().forEach(r=>{
    const k = r.caravana;
    const ult = por[k];
    if(!ult || (r.fecha||'') > (ult.fecha||'') || ((r.fecha||'')===(ult.fecha||'') && IATF_ORDEN[r.etapa] >= IATF_ORDEN[ult.etapa])) por[k] = r;
  });
  return Object.values(por).filter(r=>r.etapa===previa).sort((a,b)=>String(a.caravana).localeCompare(String(b.caravana), undefined, {numeric:true}));
}
function iatfListaHTML(){
  const q = iatfBusq.trim().toLowerCase();
  const l = iatfPendientes(iatfPaso).filter(r=>!q || String(r.caravana).toLowerCase().includes(q));
  const txt = iatfPaso==='retiro' ? 'colocado' : 'con dispositivo retirado';
  if(!l.length) return `<div class="fieldnote">${q?'Ninguna caravana coincide.':'No hay animales pendientes de este paso.'} Podés agregar uno nuevo con el botón de abajo.</div>`;
  return l.map(r=>`<div class="listcard" onclick="iatfElegir(${JSON.stringify(String(r.caravana)).replace(/"/g,'&quot;')})">
      <div class="meta"><b>Caravana ${escapeHtml(r.caravana)}</b>${r.categoria?' · '+escapeHtml(r.categoria):''}${r.color?' · '+escapeHtml(bovColorTxt(r)):''}</div>
      <div class="meta">${txt} el ${fmtFecha(r.fecha)}</div></div>`).join('');

      <div class="listcard" style="cursor:default;">
        <div class="meta"><b>Caravana ${escapeHtml(x.caravana)}</b> · ${fmtFecha(x.fecha)} <span style="float:right; cursor:pointer;" onclick="corregirCaravana(${JSON.stringify(String(x.caravana)).replace(/"/g,'&quot;')})">✎</span></div>

  } else if(iatfPaso==='inseminacion'){

function iatfDetalle(x){
  const p = [];
  if(x.etapa==='retiro' && x.conDispositivo) p.push(x.conDispositivo.toLowerCase());
  if(x.etapa==='inseminacion'){ if(x.pintada) p.push(x.pintada.toLowerCase()); if(x.toro) p.push('toro '+x.toro); }
  const ex = bovExtrasLinea(x); if(ex) p.push(ex.slice(2));
  if(x.vet) p.push('veterinario actuante: '+x.vet);
  return p.join(', ') || '—';

function agregarIatfRegistro(){
  const it = window._iatfTmp;
  if(!it.categoria){ showToast('Elegí la categoría (Vaca o Vaquillona)'); return; }
  if(!it.caravana || !it.caravana.trim()){ showToast('Falta la caravana'); return; }
  const rec = {etapa:iatfPaso, fecha:hoyISO(), caravana:it.caravana.trim(), categoria:it.categoria, color:it.color, colorOtro:it.colorOtro, cc:it.cc, aplicaciones:it.aplicaciones, aplicOtra:it.aplicOtra};
  if(iatfPaso==='retiro' && it.conDispositivo) rec.conDispositivo = it.conDispositivo;
  if(iatfPaso==='inseminacion'){ if(it.pintada) rec.pintada = it.pintada; if(it.toro){ rec.toro = it.toro; lsSet('iv_toro', it.toro); } }
  const v = vetLeer('iatf'); if(v) rec.vet = v;
  trabajoActual.exploracionReproductiva.servicio.iatf.push(rec);
  if(iatfPaso==='retiro') eventoAgrupado('iatf-ia', sumarDias(rec.fecha,2), 'Inseminación IATF (retiro + 48 hs)');

  const sv = trabajoActual.exploracionReproductiva.servicio;

  if(t.examenAndrologico && hasData(t.examenAndrologico)){

    if(id==='sobrecrecimiento' && !w.procs.includes('Desvasado funcional')) w.procs.push('Desvasado funcional');
  }
  render();
}
function podalToggleMiembro(pat, m){
  const w = podalForm(); const arr = w.sel[pat]; if(!arr) return;
  const i = arr.indexOf(m); if(i>=0) arr.splice(i,1); else arr.push(m);
  render();
}
function podalToggleProc(p){
  const w = podalForm(); const i = w.procs.indexOf(p);
  if(i>=0){ w.procs.splice(i,1); if(p==='Antibiótico terapia') w.antib=[]; if(p==='Antiinflamatorio') w.antiinf=[]; }
  else w.procs.push(p);
  render();
}
function podalToggleSub(campo, v){
  const w = podalForm(); const arr = w[campo]; const i = arr.indexOf(v);
  if(i>=0) arr.splice(i,1); else arr.push(v);
  render();
}
function podalProcsCompuestos(w){
  return w.procs.map(p=>{
    if(p==='Antibiótico terapia' && w.antib.length) return p+' ('+w.antib.join(', ')+')';
    if(p==='Antiinflamatorio' && w.antiinf.length) return p+' ('+w.antiinf.join(', ')+')';
    return p;
  });
}
function guardarPodalPasada(){
  const w = podalForm();
  const q = trabajoActual.procedimientosQuirurgicos;
  const animal = q.patologiasPodales.animales.find(a=>a.caravana===podalAnimalActivo);
  const ids = Object.keys(w.sel);
  const obs = (w.obs||'').trim();
  if(!ids.length && !obs){ showToast('Elegí una patología o escribí una observación'); return; }
  const sinMiembro = ids.find(id=>!w.sel[id].length);
  if(sinMiembro){ showToast('Elegí el miembro de: '+PODAL_TIPOS.find(t=>t.id===sinMiembro).lab); return; }
  const pid = uid(), procs = podalProcsCompuestos(w);
  PODAL_TIPOS.filter(t=>ids.includes(t.id)).forEach(t=>{
    animal.hallazgos.push({tipo:t.id, otroTexto:'', miembros:w.sel[t.id].slice(), procedimientos:procs.slice(), pasadaId:pid});
  });
  if(obs) animal.hallazgos.push({tipo:'otro', otroTexto:obs, miembros:[], procedimientos:[], pasadaId:pid});
  podalWizard = null;
  showToast('Guardado');
  render();
}
function podalGrupos(animal){
  const grupos = [];
  (animal.hallazgos||[]).forEach((h,i)=>{
    const g = grupos.length ? grupos[grupos.length-1] : null;
    if(g && h.pasadaId && g.pasadaId===h.pasadaId){ g.hall.push(h); g.n++; }
    else grupos.push({pasadaId:h.pasadaId||null, desde:i, n:1, hall:[h]});
  });
  return grupos;
}
function podalGrupoTexto(g){
  const pats = [], procs = [], obs = [];
  g.hall.forEach(h=>{
    const tp = PODAL_TIPOS.find(t=>t.id===h.tipo);
    if(h.tipo==='otro'){ if(h.otroTexto) obs.push(h.otroTexto); return; }
    const mi = (h.miembros||[]).join(', ');
    pats.push((tp?tp.lab:h.tipo)+(mi?' ('+mi+')':''));
    (h.procedimientos||[]).forEach(p=>{ if(!procs.includes(p)) procs.push(p); });
  });
  let out = pats.join('; ');
  if(procs.length) out += (out?' — ':'')+'Procedimiento: '+procs.join(', ');
  if(obs.length) out += (out?' — ':'')+'Observaciones: '+obs.join(' / ');
  return out;
}
function quitarGrupoPodal(desde, n){
  const q = trabajoActual.procedimientosQuirurgicos;
  const animal = q.patologiasPodales.animales.find(a=>a.caravana===podalAnimalActivo);
  animal.hallazgos.splice(desde, n);
  render();
}

    ${PODAL_TIPOS.filter(t=>t.id!=='otro').map(t=>`
      <div class="optrow" style="margin-top:8px;"><div class="optbtn ${w.sel[t.id]?'selected':''}" style="flex:1;" onclick="podalTogglePat('${t.id}')">${t.lab}</div></div>
      ${w.sel[t.id] ? `<div class="optrow" style="flex-wrap:wrap; margin-left:12px;">${PODAL_MIEMBROS.map(m=>`<div class="optbtn ${w.sel[t.id].includes(m.id)?'selected':''}" onclick="podalToggleMiembro('${t.id}','${m.id}')">${m.id}</div>`).join('')}</div>
      <div class="fieldnote" style="margin-left:12px;">AI: anterior izq. · AD: anterior der. · PI: posterior izq. · PD: posterior der.</div>` : ''}
    `).join('')}
    <div class="sectiontitle">Procedimientos</div>
    <div class="optrow" style="flex-wrap:wrap;">${PODAL_PROCEDIMIENTOS_FULL.map(p=>`<div class="optbtn ${w.procs.includes(p)?'selected':''}" onclick="podalToggleProc('${p}')">${p}</div>`).join('')}</div>
    ${w.procs.includes('Antibiótico terapia') ? `<div class="fieldnote" style="margin-top:8px;">Antibiótico:</div><div class="optrow" style="flex-wrap:wrap;">${PODAL_ANTIBIOTICOS.map(p=>`<div class="optbtn ${w.antib.includes(p)?'selected':''}" onclick="podalToggleSub('antib','${p}')">${p}</div>`).join('')}</div>` : ''}
    ${w.procs.includes('Antiinflamatorio') ? `<div class="fieldnote" style="margin-top:8px;">Antiinflamatorio:</div><div class="optrow" style="flex-wrap:wrap;">${PODAL_ANTIINF.map(p=>`<div class="optbtn ${w.antiinf.includes(p)?'selected':''}" onclick="podalToggleSub('antiinf','${p}')">${p}</div>`).join('')}</div>` : ''}
    <label>Observaciones (dosis, otros detalles)</label>
    <textarea oninput="podalForm().obs=this.value" placeholder="Opcional">${escapeHtml(w.obs||'')}</textarea>
    <button class="btn btn-green" style="margin-top:12px;" onclick="guardarPodalPasada()">Guardar hallazgos</button>
    ${grupos.length ? `
      <div class="sectiontitle" style="margin-top:16px;">Hallazgos cargados</div>
      ${grupos.map(g=>`<div class="listcard" style="cursor:default;">
          <div class="meta">${escapeHtml(podalGrupoTexto(g))}</div>
          <button class="removeanimal" onclick="quitarGrupoPodal(${g.desde},${g.n})">✕</button>
        </div>`).join('')}
    ` : ''}
    <button class="btn btn-teal" style="margin-top:16px;" onclick="podalAnimalActivo=null; podalWizard=null; render()">Listo, volver</button>
  `;
}
function catPatologiasPodales(){
  const q = trabajoActual.procedimientosQuirurgicos || {};
  const pp = q.patologiasPodales || {animales:[]};
  if(podalAnimalActivo) return catPodalAnimal();
  return `
    <button class="backbtn" onclick="patologiasPodalesActivo=false; render()">‹ Aparato locomotor</button>

    <div class="sublist" style="margin-top:16px;">

        <div class="subtile" onclick="podalAnimalActivo='${a.caravana}'; podalWizard=null; render()">
          <span>🐄 Caravana ${escapeHtml(a.caravana)}${escapeHtml(bovColorSufijo(a))} ${btnEditarIdent(a.caravana)}</span>
          <span class="check">${a.hallazgos.length} hallazgo${a.hallazgos.length===1?'':'s'}</span>
        </div>`).join('') || '<div class="fieldnote">Todavía no agregaste animales.</div>'}
    </div>
  `;
}
function resumenPatologiasPodales(pq){
  const pp = pq && pq.patologiasPodales;
  if(!pp || !pp.animales || !pp.animales.length) return '';
  let out = `  Patologías podales:\n`;
  pp.animales.forEach(a=>{
    if(!a.hallazgos || !a.hallazgos.length) return;
    out += `    Caravana ${a.caravana}${bovColorSufijo(a)}:\n`;
    podalGrupos(a).forEach(g=>{ out += `      ${podalGrupoTexto(g)}\n`; });
  });
  return out;
}

function guardarGrupoVacMasiva(){
  const dosis = document.getElementById('vacm_dosis').value.trim();
  const repetir = document.getElementById('vacm_repetir').value.trim();
  if(!trabajoActual.sanidad) trabajoActual.sanidad = {individual:{},masivo:{}};
  if(!trabajoActual.sanidad.masivo) trabajoActual.sanidad.masivo = {};
  if(!trabajoActual.sanidad.masivo.vacunacion || !trabajoActual.sanidad.masivo.vacunacion.grupos) trabajoActual.sanidad.masivo.vacunacion = {grupos:[]};
  trabajoActual.sanidad.masivo.vacunacion.grupos.push({
    vacunas: vacMasivaWizard.vacunas.slice(),
    otraTexto: vacMasivaWizard.otraTexto,
    animales: vacMasivaWizard.animales.slice(),
    dosis, repetir, repetirHecho: false, vet: vetLeer('vacm')
  });
  vacMasivaWizard = null;
  render();
}
function quitarGrupoVacMasiva(i){
  trabajoActual.sanidad.masivo.vacunacion.grupos.splice(i,1);
  render();
}
function labelVacunaGrupo(g){
  return g.vacunas.map(v=> v==='Otra' && g.otraTexto ? `Otra: ${g.otraTexto}` : v).join(', ');
}
function catVacMasivaWizardView(){
  const w = vacMasivaWizard;

    return `

      <div class="fieldnote" style="margin-bottom:6px;">Podés elegir más de una.</div>

      ${w.vacunas.includes('Otra') ? `<label>¿Cuál?</label><input type="text" id="vacm_otra_texto" placeholder="Especificá la vacuna" value="${escapeHtml(w.otraTexto)}">` : ''}
      <button class="btn btn-teal" style="margin-top:16px;" onclick="avanzarVacMasivaAnimales()" ${w.vacunas.length?'':'disabled'}>Siguiente</button>

  }
  if(w.step==='animales'){
    return `
      <button class="backbtn" onclick="vacMasivaWizard.step='vacunas'; render()">‹ Volver</button>

      <div class="fieldnote" style="margin:6px 0;">Tocá la categoría del animal para guardarlo y pasar al siguiente.</div>
      <div class="optrow" style="flex-wrap:wrap;">${SANIDAD_CATEGORIAS_BOVINO.map(c=>`<div class="optbtn" onclick="agregarAnimalVacMasiva('${c}')">${c}</div>`).join('')}</div>
      <div class="sublist" style="margin-top:12px;">
        ${w.animales.map((a,i)=>`<div class="subtile"><span>🐄 ${escapeHtml(a.caravana)}${escapeHtml(bovColorSufijo(a))} — ${a.categoria}</span><button class="removeanimal" onclick="quitarAnimalVacMasiva(${i})">✕</button></div>`).join('') || '<div class="fieldnote">Todavía no cargaste animales.</div>'}
      </div>
      <button class="btn btn-teal" style="margin-top:16px;" onclick="avanzarVacMasivaFinal()" ${w.animales.length?'':'disabled'}>Siguiente</button>

  }
  return `
    <button class="backbtn" onclick="vacMasivaWizard.step='animales'; render()">‹ Volver</button>

function catVacunacionMasivaBovino(){
  if(vacMasivaWizard) return catVacMasivaWizardView();
  const grupos = (trabajoActual.sanidad && trabajoActual.sanidad.masivo && trabajoActual.sanidad.masivo.vacunacion && trabajoActual.sanidad.masivo.vacunacion.grupos) || [];
  return `
    <button class="backbtn" onclick="sanidadTipoBovino=null; render()">‹ Masivo</button>
    <div class="sectiontitle">Vacunación (masivo)</div>
    <button type="button" class="addanimalbtn" onclick="iniciarVacMasivaWizard()">+ Agregar grupo de vacunación</button>
    ${grupos.length ? grupos.map((g,i)=>`
      <div class="listcard">
        <div class="meta"><b>${labelVacunaGrupo(g)}</b><br>
        Animales: ${g.animales.length} (${g.animales.map(a=>a.caravana+bovColorSufijo(a)+' '+a.categoria).join(', ')})
        ${g.dosis?`<br>Dosis: ${escapeHtml(g.dosis)}`:''}${g.repetir?`<br>⚠️ Repetir: ${escapeHtml(g.repetir)}`:''}</div>
        <button class="removeanimal" onclick="quitarGrupoVacMasiva(${i})">✕</button>
      </div>`).join('') : '<div class="fieldnote">Todavía no cargaste ningún grupo.</div>'}
    <button class="btn btn-teal" style="margin-top:16px;" onclick="sanidadTipoBovino=null; render()">Listo, volver</button>
  `;
}
function catSanidadBovino(){
  const s = trabajoActual.sanidad || {individual:{vacunacion:'',desparasitacion:'',otra:''}, masivo:{vacunacion:{grupos:[]},desparasitacion:{filas:[],observaciones:''},otra:{filas:[],observaciones:''}}};
  const labels={vacunacion:'Vacunación',desparasitacion:'Desparasitación',otra:'Otra'};
  if(sanidadModoBovino && sanidadTipoBovino){
    if(sanidadModoBovino==='individual'){
      const dato = (s.individual||{})[sanidadTipoBovino] || {texto:'', fotos:[]};
      return `
        <button class="backbtn" onclick="sanidadTipoBovino=null; render()">‹ Individual</button>
        <div class="sectiontitle">${labels[sanidadTipoBovino]} (individual)</div>
        <textarea id="san_ind_texto" placeholder="Qué se hizo...">${escapeHtml(dato.texto||'')}</textarea>
        ${fotosBlock(dato.fotos, ['sanidad','individual',sanidadTipoBovino])}
        <button class="btn btn-teal" style="margin-top:16px;" onclick="guardarSanidadIndividualBovino()">Listo, volver</button>
      `;
    } else {
      if(sanidadTipoBovino==='vacunacion'){
        return catVacunacionMasivaBovino();
      }
      const grupo = (s.masivo||{})[sanidadTipoBovino] || {filas:[],observaciones:''};
      window._sanMasivoTmp = grupo.filas && grupo.filas.length ? JSON.parse(JSON.stringify(grupo.filas)) : [{caravana:'',producto:'',dosis:'',repetir:''}];
      return `
        <button class="backbtn" onclick="sanidadTipoBovino=null; render()">‹ Masivo</button>
        <div class="sectiontitle">${labels[sanidadTipoBovino]} (masivo)</div>
        <div id="sanMasivoList"></div>
        <button type="button" class="addanimalbtn" onclick="agregarFilaSanMasivo()">+ Agregar animal</button>
        <label>Observaciones</label>
        <textarea id="san_masivo_obs" placeholder="Detalle general...">${escapeHtml(grupo.observaciones||'')}</textarea>
        <button class="btn btn-teal" onclick="guardarSanidadMasivaBovinoTipo()">Listo, volver</button>
      `;
    }
  }
  if(sanidadModoBovino && !sanidadTipoBovino){
    return `
      <button class="backbtn" onclick="sanidadModoBovino=null; render()">‹ Sanidad</button>
      <div class="sectiontitle">${sanidadModoBovino==='individual'?'Individual':'Masivo'}</div>
      <div class="sublist">
        <div class="subtile" onclick="sanidadTipoBovino='vacunacion'; render()"><span>Vacunación</span></div>
        <div class="subtile" onclick="sanidadTipoBovino='desparasitacion'; render()"><span>Desparasitación</span></div>
        <div class="subtile" onclick="sanidadTipoBovino='otra'; render()"><span>Otra</span></div>
      </div>
    `;
  }
  return `
    <button class="backbtn" onclick="volverACategorias()">‹ Categorías</button>
    <div class="sectiontitle">Sanidad</div>
    <div class="sublist">
      <div class="subtile" onclick="sanidadModoBovino='individual'; render()"><span>Individual</span></div>
      <div class="subtile" onclick="sanidadModoBovino='masivo'; render()"><span>Masivo</span></div>
    </div>
    ${botonGuardarSimple('guardarSanidadBovinoFinal')}
  `;
}
function guardarSanidadIndividualBovino(){
  if(!trabajoActual.sanidad) trabajoActual.sanidad={individual:{},masivo:{}};
  if(!trabajoActual.sanidad.individual) trabajoActual.sanidad.individual={};
  const previo = trabajoActual.sanidad.individual[sanidadTipoBovino] || {fotos:[]};
  trabajoActual.sanidad.individual[sanidadTipoBovino] = {texto: document.getElementById('san_ind_texto').value.trim(), fotos: previo.fotos||[]};
  sanidadTipoBovino=null; render();
}
function renderSanMasivoList(){
  const el = document.getElementById('sanMasivoList'); if(!el) return;
  el.innerHTML = window._sanMasivoTmp.map((f,i)=>`
    <div class="animalrow">
      <input type="text" placeholder="Caravana" value="${escapeHtml(f.caravana)}" onchange="window._sanMasivoTmp[${i}].caravana=this.value">
      ${bovColorSelectFila('window._sanMasivoTmp', i, f)}
      <input type="text" placeholder="Producto" value="${escapeHtml(f.producto)}" onchange="window._sanMasivoTmp[${i}].producto=this.value">
      <input type="text" placeholder="Dosis" value="${escapeHtml(f.dosis)}" onchange="window._sanMasivoTmp[${i}].dosis=this.value">
      <input type="text" placeholder="Repetir" value="${escapeHtml(f.repetir)}" onchange="window._sanMasivoTmp[${i}].repetir=this.value">
      ${window._sanMasivoTmp.length>1 ? `<button class="removeanimal" onclick="quitarFilaSanMasivo(${i})">✕</button>` : ''}
    </div>`).join('');
}
function agregarFilaSanMasivo(){ window._sanMasivoTmp.push({caravana:'',producto:'',dosis:'',repetir:''}); renderSanMasivoList(); }
function quitarFilaSanMasivo(i){ window._sanMasivoTmp.splice(i,1); renderSanMasivoList(); }
function guardarSanidadMasivaBovinoTipo(){
  if(!trabajoActual.sanidad) trabajoActual.sanidad={individual:{},masivo:{}};
  if(!trabajoActual.sanidad.masivo) trabajoActual.sanidad.masivo={};
  trabajoActual.sanidad.masivo[sanidadTipoBovino] = {filas: window._sanMasivoTmp, observaciones: document.getElementById('san_masivo_obs').value.trim()};
  sanidadTipoBovino=null; render();
}
function guardarSanidadBovinoFinal(estado){ finalizarGuardado(estado); }

// hooks for dynamic sub-lists after render
const _origRender = render;
render = function(){
  _origRender();
  if(view==='equino-complementarios' && complementarioActivo==='sangradoMasivo') renderTubosList();
  if(view==='equino-sanidad' && sanidadMasivaActiva) renderSanidadFilas();
  if(view==='bovino-complementarios' && complementarioActivoBovino==='sangradoMasivo') renderTubosBovinoList();
  if(view==='bovino-sanidad' && sanidadModoBovino && sanidadTipoBovino) renderSanMasivoList();
};

let mascotaProcActivo = null, mascotaSistemaClinicoActivo = null, mascotaComplementarioActivo = null,
    mascotaSistemaQuirurgicoActivo = null, mascotaSanidadSub = null;

const VACUNAS_CANINO = [{key:'quintuple', label:'Quíntuple', dias:21}, {key:'antirrabica', label:'Antirrábica', dias:365}];
const VACUNAS_FELINO = [{key:'triple', label:'Triple felina', dias:30}, {key:'antirrabica', label:'Antirrábica', dias:365}];
function listaVacunasPara(especie){
  if(especie==='Canino') return VACUNAS_CANINO;
  if(especie==='Felino') return VACUNAS_FELINO;
  return null;
}
function iniciarMascota(especie){
  trabajoActual = {
    id:null, clienteId:clienteContexto, establecimientoId: clienteEstablecimientoContexto, especie, estado:'parcial', fechaInicio: hoyISO(),
    facturado:false, cobrado:false,
    informacionGeneral: {propietario:{}, paciente:{}},
    exploracionClinica: {examenClinico:{}},
    examenesComplementarios: {},
    procedimientosQuirurgicos: {},
    sanidad: {},
    tratamientos: {texto:'',fotos:[]},
    otroProcedimiento: {texto:'',fotos:[]},
    observacionesFinales: {texto:'',fotos:[]}
  };
  navigate('mascotaCategorias');
}
function iniciarCanino(){ iniciarMascota('Canino'); }
function iniciarFelino(){ iniciarMascota('Felino'); }
function iniciarOtrosEspecie(){ iniciarMascota('Otros'); }
function finalizarGuardadoMascota(estado, volverA){
  guardarTrabajoActual(estado);
  showToast(estado==='finalizado' ? 'Trabajo finalizado' : 'Guardado parcialmente');
  if(estado==='finalizado'){ trabajoActual=null; navigate('home'); }
  else navigate(volverA);
}

  if(mascotaProcActivo==='tratamientos') return catTratamientosMascota();

      <div class="cattile" onclick="mascotaProcActivo='tratamientos'; render()"><div class="left"><span class="emoji">💊</span><span class="lab">Tratamientos</span></div>${hasData(t.tratamientos)?'<span class="check">✓</span>':''}</div>

// --- Exploración clínica ---
function catClinicaMascota(){
  const e = trabajoActual.exploracionClinica || {examenClinico:{}};
  if(mascotaSistemaClinicoActivo){
    const dato = (e.examenClinico||{})[mascotaSistemaClinicoActivo] || {texto:'',fotos:[]};
    return `
      <button class="backbtn" onclick="mascotaSistemaClinicoActivo=null; render()">‹ Exploración clínica</button>
      <div class="sectiontitle">${mascotaSistemaClinicoActivo}</div>
      <label>Maniobras realizadas / hallazgos / tratamiento indicado</label>
      <textarea id="ecm_texto" placeholder="Escribí lo que hiciste o encontraste...">${escapeHtml(dato.texto||'')}</textarea>
      ${fotosBlock(dato.fotos, ['exploracionClinica','examenClinico',mascotaSistemaClinicoActivo])}
      <button class="btn btn-teal" style="margin-top:16px;" onclick="guardarSistemaClinicoMascota()">Listo, volver</button>
    `;
  }
  return `
    <button class="backbtn" onclick="mascotaProcActivo=null; render()">‹ Procedimientos</button>
    <div class="sectiontitle">Estado general</div>
    <div class="optrow">${['Regular','Bueno','Malo'].map(o=>`<div class="optbtn ${e.estadoGeneral===o?'selected':''}" onclick="setClinicaMascota('estadoGeneral','${o}')">${o}</div>`).join('')}</div>
    <div class="sectiontitle">Condición corporal</div>
    <div class="optrow">${['Regular','Buena','Mala'].map(o=>`<div class="optbtn ${e.condicionCorporal===o?'selected':''}" onclick="setClinicaMascota('condicionCorporal','${o}')">${o}</div>`).join('')}</div>
    <div class="sectiontitle">Temperatura corporal${rangoTemperatura(trabajoActual.especie)?` <span style="font-weight:400; color:var(--ink-soft); font-size:12px;">(${rangoTemperatura(trabajoActual.especie)})</span>`:''}</div>
    <input type="text" id="cl_temperatura_m" value="${escapeHtml(e.temperatura||'')}" placeholder="°C tomada" onchange="setClinicaMascota('temperatura', this.value)">
    <div class="sectiontitle">Examen clínico por sistema</div>
    <div class="sublist">
      ${SISTEMAS.map(s=>`<div class="subtile" onclick="mascotaSistemaClinicoActivo='${s}'; render()"><span>${iconoSistema(s)} ${s}</span>${hasData((e.examenClinico||{})[s])?'<span class="check">✓</span>':''}</div>`).join('')}
    </div>
    ${botonGuardarSimple('guardarClinicaMascotaFinal', 'cancelarMascotaProc')}
  `;
}
function setClinicaMascota(campo,valor){
  if(!trabajoActual.exploracionClinica) trabajoActual.exploracionClinica={examenClinico:{}};
  trabajoActual.exploracionClinica[campo]=valor;
  render();
}
function guardarSistemaClinicoMascota(){
  if(!trabajoActual.exploracionClinica.examenClinico) trabajoActual.exploracionClinica.examenClinico={};
  const actual = trabajoActual.exploracionClinica.examenClinico[mascotaSistemaClinicoActivo] || {texto:'',fotos:[]};
  actual.texto = document.getElementById('ecm_texto').value.trim();
  trabajoActual.exploracionClinica.examenClinico[mascotaSistemaClinicoActivo] = actual;
  mascotaSistemaClinicoActivo = null;
