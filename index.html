<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Integral Vet</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Integral Vet">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg: #10151B;
    --bg2: #161D25;
    --card: #1B232C;
    --card2: #212B36;
    --line: #2C3844;
    --ink: #ECEFF2;
    --ink-soft: #8B96A3;
    --teal: #159AA6;
    --teal-dk: #12444A;
    --green: #3F8F5F;
    --green-dk: #1E3A29;
    --purple: #6C5CA6;
    --purple-dk: #2E2748;
    --blue: #3568B0;
    --blue-dk: #1B2C49;
    --amber: #C99A3B;
    --red: #B5482A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  #app{max-width:460px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}
  header.topbar{
    background: var(--bg2); padding:16px 20px 14px; position:sticky; top:0; z-index:5;
    border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
  }
  header.topbar .brand{font-size:16.5px; font-weight:800; letter-spacing:0.3px;}
  header.topbar .brand span{color:var(--teal);}
  header.topbar .who{font-size:11px; color:var(--ink-soft); text-align:right;}
  .backbtn{background:none; border:none; color:var(--teal); font-size:14.5px; font-weight:700; cursor:pointer; padding:0; margin-bottom:14px;}
  main{flex:1; padding:18px 18px 40px;}

  /* LOGIN */
  .splash{text-align:center; padding:60px 24px 24px; position:relative;}
  .selloMV{position:absolute; top:8px; right:14px; width:100px; height:100px; opacity:0.95;}
  .splash h1{font-size:26px; font-weight:800; margin:0;}
  .splash h1 span{color:var(--teal);}
  .splash p{font-size:12.5px; color:var(--ink-soft); margin-top:4px; letter-spacing:0.5px;}
  .splash .wm{font-size:11px; color:#3A4552; margin-top:30px; line-height:1.6;}
  .loginbox{margin-top:14px; text-align:left;}
  .remember{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12.5px; color:var(--ink-soft);}
  .remember input{width:auto;}

  label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:14px 0 6px;}
  label:first-of-type{margin-top:4px;}
  input[type=text], input[type=password], input[type=date], input[type=number], select, textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:14.5px; background:var(--card); color:var(--ink); font-family:inherit;
  }
  textarea{min-height:90px; resize:vertical; line-height:1.4;}
  input::placeholder, textarea::placeholder{color:#5A6472;}
  .btn{display:block; width:100%; padding:13px; border:none; border-radius:7px; font-size:14.5px; font-weight:700; cursor:pointer; margin-top:14px; font-family:inherit;}
  .btn-teal{background:var(--teal); color:#08181A;}
  .btn-green{background:var(--green); color:#08170F;}
  .btn-amber{background:var(--amber); color:#2A1E05;}
  .btn-outline{background:none; color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:none; color:var(--red); border:1px solid var(--red);}

  /* HOME GRID */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .tile{border:none; border-radius:12px; padding:20px 14px; text-align:left; cursor:pointer; min-height:118px; display:flex; flex-direction:column; justify-content:space-between; color:#fff;}
  .tile .icon{font-size:26px;}
  .tile .label{font-weight:800; font-size:15px; margin-top:12px;}
  .tile .desc{font-size:11px; opacity:0.85; margin-top:2px; line-height:1.35;}
  .tile.teal{background:linear-gradient(160deg, var(--teal), var(--teal-dk));}
  .tile.green{background:linear-gradient(160deg, var(--green), var(--green-dk));}
  .tile.purple{background:linear-gradient(160deg, var(--purple), var(--purple-dk));}
  .tile.blue{background:linear-gradient(160deg, var(--blue), var(--blue-dk));}
  .tile:active{opacity:0.88;}

  .sectiontitle{font-size:12px; font-weight:700; color:var(--ink-soft); margin:22px 0 8px;}

  /* LISTS / CARDS */
  .searchbar{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; font-size:14px; background:var(--card); color:var(--ink); margin-bottom:10px;}
  .listcard{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:13px 14px; margin-bottom:9px; cursor:pointer;}
  .listcard .top{display:flex; justify-content:space-between; align-items:baseline;}
  .listcard .name{font-weight:700; font-size:14.5px;}
  .listcard .date{font-size:11px; color:var(--ink-soft);}
  .listcard .meta{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .tag{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:20px; margin-top:6px; margin-right:5px;}
  .tag.parcial{background:#3A2E14; color:var(--amber);}
  .tag.finalizado{background:var(--green-dk); color:#8FD9AA;}
  .empty{text-align:center; padding:40px 16px; color:var(--ink-soft); font-size:13.5px; line-height:1.5;}
  .twobtn{display:flex; gap:10px;}
  .twobtn .btn{flex:1;}

  /* Species picker */
  .speciesgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px;}
  .speciesbtn{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 10px; text-align:center; cursor:pointer; color:var(--ink);}
  .speciesbtn .emoji{font-size:34px; display:block;}
  .speciesbtn .lab{font-weight:700; font-size:13.5px; margin-top:8px; display:block;}
  .speciesbtn.disabled{opacity:0.4;}

  /* category menu */
  .catlist .cattile{
    display:flex; align-items:center; justify-content:space-between; background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:14px 15px; margin-bottom:9px; cursor:pointer;
  }
  .cattile .left{display:flex; align-items:center; gap:12px;}
  .cattile .emoji{font-size:19px;}
  .cattile .lab{font-weight:700; font-size:14px;}
  .cattile .check{color:#8FD9AA; font-size:16px;}
  .statusbar{display:flex; justify-content:space-between; align-items:center; background:var(--card2); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:12px; color:var(--ink-soft);}

  /* option buttons (Regular/Bueno/Malo etc) */
  .optrow{display:flex; gap:8px; margin-bottom:4px;}
  .optbtn{flex:1; padding:11px 4px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-size:13px; font-weight:700; cursor:pointer; text-align:center;}
  .optbtn.selected{background:var(--teal); border-color:var(--teal); color:#08181A;}

  .sublist .subtile{
    display:flex; align-items:center; justify-content:space-between; background:var(--card);
    border:1px solid var(--line); border-radius:7px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-size:13.5px;
  }
  .subtile .check{color:#8FD9AA;}

  .animalrow{display:flex; gap:6px; align-items:center; margin-bottom:8px; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:8px;}
  .animalrow .tubolab{font-size:11px; font-weight:700; color:var(--ink-soft); width:38px; flex-shrink:0;}
  .animalrow input, .animalrow select{flex:1; padding:8px; font-size:12.5px;}
  .removeanimal{background:none; border:none; color:var(--red); font-size:17px; cursor:pointer; padding:0 3px;}
  .addanimalbtn{background:none; border:1px dashed var(--line); color:var(--ink-soft); width:100%; padding:9px; border-radius:7px; font-size:13px; cursor:pointer; margin-bottom:10px;}

  .vacrow{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:13px 14px; margin-bottom:9px;}
  .vacrow .top{display:flex; justify-content:space-between; align-items:center;}
  .vacrow .lab{font-weight:700; font-size:13.5px;}
  .vacrow .prox{font-size:11.5px; color:var(--amber); margin-top:5px;}
  .vacbtn{background:var(--green-dk); color:#8FD9AA; border:none; border-radius:6px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer;}
  .vacbtn.done{background:var(--green); color:#08170F;}

  .estabcard{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px;}
  .estabcard .esth{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .estabcard .esth b{font-size:13px;}
  .removeestab{background:none; border:none; color:var(--red); font-size:12px; cursor:pointer;}
  .addestabbtn{background:none; border:1px dashed var(--line); color:var(--ink-soft); width:100%; padding:9px; border-radius:7px; font-size:13px; cursor:pointer; margin:6px 0 4px;}

  nav.bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px; background:var(--bg2); border-top:1px solid var(--line); display:flex; z-index:10;}
  nav.bottomnav button{flex:1; background:none; border:none; padding:9px 2px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;}
  nav.bottomnav .navicon{font-size:18px; opacity:0.5;}
  nav.bottomnav .navlab{font-size:9.5px; color:var(--ink-soft); font-weight:600;}
  nav.bottomnav button.active .navicon{opacity:1;}
  nav.bottomnav button.active .navlab{color:var(--teal);}

  .reportbox{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; font-size:12.5px; line-height:1.6; white-space:pre-wrap; margin-top:14px;}
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#000; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:30; opacity:0; transition:opacity 0.25s;}
  .toast.show{opacity:0.92;}
  .fieldnote{font-size:11px; color:var(--ink-soft); margin-top:5px; line-height:1.4;}
  .fotogrid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .fotothumb{position:relative; width:64px; height:64px; border-radius:7px; overflow:hidden; border:1px solid var(--line); flex-shrink:0;}
  .fotothumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .fotoremove{position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.65); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; cursor:pointer; line-height:1; padding:0;}
  .fotoaddbtn{display:inline-block; margin-top:6px; padding:8px 14px; border:1px dashed var(--line); border-radius:7px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;}
  .alertcard{background:#3A2E14; border-left:3px solid var(--amber); padding:10px 12px; border-radius:6px; font-size:12.5px; margin-bottom:8px; color:var(--ink);}
  .alertcard b{display:block; font-size:13px; margin-bottom:2px;}
  .factbtn{padding:9px 12px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink-soft); font-size:12.5px; font-weight:700; cursor:pointer; flex:1;}
  .factbtn.on{background:var(--green-dk); color:#8FD9AA; border-color:var(--green);}
  .facturacionRow{display:flex; gap:8px; margin-top:10px;}
  .placeholder-note{background:var(--card2); border:1px dashed var(--line); border-radius:8px; padding:18px; font-size:13px; color:var(--ink-soft); text-align:center; margin-top:16px;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar" style="display:none;">
    <div class="brand">INTEGRAL <span>VET</span></div>
    <div class="who" id="whoLabel"></div>
  </header>
  <main id="main"></main>
  <nav class="bottomnav" id="bottomnav" style="display:none;"></nav>
  <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
// ---------------- FIREBASE ----------------
const firebaseConfig = {
  apiKey: "AIzaSyA46A-OgUjghFBI5KSCQxzTfgSg42egNZY",
  authDomain: "integral-vet-562c9.firebaseapp.com",
  projectId: "integral-vet-562c9",
  storageBucket: "integral-vet-562c9.firebasestorage.app",
  messagingSenderId: "559439940184",
  appId: "1:559439940184:web:b27e177314622401ebd82d"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(function(err){
  console.warn('Persistencia offline no disponible:', err.code);
});

// ---------------- STATE ----------------
let clientes = [];
let trabajos = [];
let auth = null;          // {usuario}
let sesionActiva = false;
let view = 'login';
let editingId = null;
let trabajoActual = null;
let historialFiltro = 'todos';
let historialBusqueda = '';
let clienteBusqueda = '';
let clienteContexto = null; // clienteId preseleccionado al iniciar un trabajo
let clienteEstablecimientoContexto = null; // establecimientoId preseleccionado al iniciar un trabajo

const SISTEMAS = ['Respiratorio','Digestivo','Circulatorio','Locomotor','Urogenital','Neurológico','Tegumentario','Sentidos especiales'];
const SISTEMA_ICONOS = {'Respiratorio':'🫁','Digestivo':'🍽️','Circulatorio':'🫀','Locomotor':'🦴','Urogenital':'💧','Neurológico':'🧠','Tegumentario':'🩹','Sentidos especiales':'👁️'};
function iconoSistema(s){
  if(s==='Digestivo'){
    const esp = trabajoActual ? trabajoActual.especie : null;
    if(esp==='Canino'||esp==='Felino') return '🍖';
    if(esp==='Equino'||esp==='Bovino') return '🌿';
    return '🌿';
  }
  return SISTEMA_ICONOS[s];
}
const COMPLEMENTARIO_ICONOS = {radiografia:'🩻', ecografia:'📡', sangrado:'🩸', sangradoMasivo:'🩸🩸', otros:'➕', otro:'➕', datosAnimal:'📋'};
const VACUNAS = [
  {key:'adenitis', label:'Adenitis', dias:365, tipo:'vacuna'},
  {key:'influenza', label:'Influenza', dias:90, tipo:'vacuna'},
  {key:'encefalomielitis', label:'Encefalomielitis', dias:365, tipo:'vacuna'},
  {key:'rabia', label:'Rabia', dias:365, tipo:'vacuna'},
  {key:'antitetanica', label:'Antitetánica', dias:365, tipo:'vacuna'},
  {key:'aie', label:'AIE (Anemia Infecciosa Equina)', dias:60, tipo:'análisis'},
];

// ---------------- STORAGE (Firebase, offline-first) ----------------
let unsubClientes = null;
let unsubTrabajos = null;

function attachListeners(){
  if(unsubClientes) unsubClientes();
  if(unsubTrabajos) unsubTrabajos();
  unsubClientes = db.collection('clientes').onSnapshot(function(snap){
    clientes = snap.docs.map(function(d){ return d.data(); });
    if(sesionActiva) render();
  }, function(err){ console.error('Error sincronizando clientes', err); });
  unsubTrabajos = db.collection('trabajos').onSnapshot(function(snap){
    trabajos = snap.docs.map(function(d){ return d.data(); });
    if(sesionActiva) render();
  }, function(err){ console.error('Error sincronizando trabajos', err); });
}
function detachListeners(){
  if(unsubClientes){ unsubClientes(); unsubClientes=null; }
  if(unsubTrabajos){ unsubTrabajos(); unsubTrabajos=null; }
}
function saveClienteDoc(c){ db.collection('clientes').doc(c.id).set(c).catch(function(err){ console.error(err); }); }
function deleteClienteDoc(id){ db.collection('clientes').doc(id).delete().catch(function(err){ console.error(err); }); }
function saveTrabajoDoc(t){ db.collection('trabajos').doc(t.id).set(t).catch(function(err){ console.error(err); showToast('No se pudo guardar (¿informe muy pesado en fotos?)'); }); }
function updateTrabajoDoc(id, campos){ db.collection('trabajos').doc(id).update(campos).catch(function(err){ console.error(err); }); }
function deleteTrabajoDoc(id){ db.collection('trabajos').doc(id).delete().catch(function(err){ console.error(err); }); }

window.addEventListener('online', function(){ showToast('Conectado — sincronizando cambios'); });
window.addEventListener('offline', function(){ showToast('Sin conexión — los cambios se guardan en el dispositivo'); });

// ---------------- HELPERS ----------------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function fmtFecha(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function sumarDias(iso, dias){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+dias); return d.toISOString().slice(0,10); }
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ---------------- FOTOS (genérico, se usa en cualquier campo de texto) ----------------
function leerFotoInput(inputEl, callback){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxAncho = 900;
      const escala = Math.min(1, maxAncho / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * escala;
      canvas.height = img.height * escala;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.6));
      inputEl.value = '';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function agregarFotoA(path, dataUrl){
  let obj = trabajoActual;
  for(let i=0;i<path.length-1;i++){ if(!obj[path[i]]) obj[path[i]]={}; obj=obj[path[i]]; }
  const key = path[path.length-1];
  if(!obj[key] || typeof obj[key]!=='object') obj[key] = {texto:'', fotos:[]};
  if(!obj[key].fotos) obj[key].fotos=[];
  obj[key].fotos.push(dataUrl);
}
function quitarFotoDe(path, idx){
  let obj = trabajoActual;
  for(let i=0;i<path.length-1;i++){ obj=obj[path[i]]; }
  const key = path[path.length-1];
  if(obj[key] && obj[key].fotos) obj[key].fotos.splice(idx,1);
  render();
}
function fotosBlock(fotos, path){
  const pathLiteral = `[${path.map(p=>`'${p}'`).join(',')}]`;
  const inputId = 'fotoinput_' + path.join('_').replace(/[^a-zA-Z0-9_]/g,'');
  return `
    <div class="fotogrid">
      ${(fotos||[]).map((f,i)=>`<div class="fotothumb"><img src="${f}"><button class="fotoremove" onclick="quitarFotoDe(${pathLiteral}, ${i})">✕</button></div>`).join('')}
    </div>
    <label class="fotoaddbtn" for="${inputId}">📷 Agregar foto</label>
    <input type="file" accept="image/*" id="${inputId}" style="display:none" onchange="leerFotoInput(this, (data)=>{ agregarFotoA(${pathLiteral}, data); render(); })">
  `;
}
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function clienteNombreCompleto(c){ return [c.nombre, c.apellido].filter(Boolean).join(' ') || '(sin nombre)'; }
function clienteById(id){ return clientes.find(c=>c.id===id); }

function navigate(v){ view=v; render(); window.scrollTo(0,0); }
function renderNav(){
  const items = [
    {id:'home', icon:'🏠', lab:'Inicio'},
    {id:'clientes', icon:'👤', lab:'Clientes'},
    {id:'nuevoTrabajoEspecie', icon:'➕', lab:'Nuevo'},
    {id:'historial', icon:'🔍', lab:'Historial'},
    {id:'informes', icon:'📄', lab:'Informes'},
  ];
  const nav = document.getElementById('bottomnav');
  const activeGroup = (v)=> v==='nuevoTrabajoEspecie'||v==='equinoCategorias'||v.startsWith('equino-')||v==='bovinoCategorias'||v.startsWith('bovino-')||v==='mascotaCategorias'||v.startsWith('mascota-') ? 'nuevoTrabajoEspecie' : v;
  nav.innerHTML = items.map(it=>`
    <button class="${activeGroup(view)===it.id?'active':''}" onclick="salirANuevaSeccion('${it.id}')">
      <span class="navicon">${it.icon}</span><span class="navlab">${it.lab}</span>
    </button>`).join('');
}
function salirANuevaSeccion(id){
  editingId=null; trabajoActual=null; clienteContexto=null; clienteEstablecimientoContexto=null; historialModo=null;
  informesModo=null; informesBusquedaModo=null; informeVerId=null;
  navigate(id);
}

// ---------------- ROUTER ----------------
function render(){
  const topbar = document.getElementById('topbar');
  const bottomnav = document.getElementById('bottomnav');
  const showChrome = sesionActiva;
  topbar.style.display = showChrome ? 'flex' : 'none';
  bottomnav.style.display = showChrome ? 'flex' : 'none';
  if(showChrome){ document.getElementById('whoLabel').innerHTML = auth ? `${escapeHtml(auth.usuario)} · <a href="#" style="color:var(--teal)" onclick="cerrarSesion(); return false;">Salir</a>` : ''; renderNav(); }

  const main = document.getElementById('main');
  if(view==='cargando') main.innerHTML = '<div class="empty">Cargando…</div>';
  else if(view==='login') main.innerHTML = viewLogin();
  else if(view==='home') main.innerHTML = viewHome();

function recuperarPass(){

  fbAuth.sendPasswordResetEmail(usuario).then(function(){
    showToast('Te enviamos un mail para recuperar la contraseña');
  }).catch(function(err){ showToast(mensajeErrorAuth(err)); });
}
function mensajeErrorAuth(err){

    'auth/wrong-password':'Contraseña incorrecta',
    'auth/invalid-credential':'Email o contraseña incorrectos',
    'auth/too-many-requests':'Demasiados intentos, esperá un momento',
    'auth/network-request-failed':'Sin conexión — probá cuando tengas señal',
  };
  return map[err.code] || 'No se pudo ingresar, probá de nuevo';
}

function proximasVacunas(){
  const hoy = hoyISO();
  const limite = sumarDias(hoy, 2);
  const resultado = [];
  trabajos.forEach(t=>{
    if(t.especie==='Equino' && t.sanidad){
      VACUNAS.forEach(v=>{
        const d = t.sanidad[v.key];
        if(d && d.proxima && d.proxima>=hoy && d.proxima<=limite){
          resultado.push({clienteId:t.clienteId, label:v.label, fecha:d.proxima, paciente:(t.datosPaciente&&t.datosPaciente.nombre)||''});
        }
      });
    }
    if((t.especie==='Canino'||t.especie==='Felino') && t.sanidad && t.sanidad.vacuna && typeof t.sanidad.vacuna==='object'){
      const lista = listaVacunasPara(t.especie) || [];
      lista.forEach(v=>{
        const d = t.sanidad.vacuna[v.key];
        if(d && d.proxima && d.proxima>=hoy && d.proxima<=limite){
          resultado.push({clienteId:t.clienteId, label:v.label, fecha:d.proxima, paciente:(t.informacionGeneral&&t.informacionGeneral.paciente&&t.informacionGeneral.paciente.nombre)||''});
        }
      });
    }
  });
  resultado.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return resultado;
}

function filtrarClientesLive(){
  const el = document.getElementById('buscaCliente');
  const q = (el ? el.value : '').toLowerCase();
  const cont = document.getElementById('listaClientes');
  if(!cont) return;
  const filtrados = clientes.filter(c=>{
    const estabTxt = (c.establecimientos||[]).map(e=>e.nombre+' '+(e.renspa||'')).join(' ').toLowerCase();
    return clienteNombreCompleto(c).toLowerCase().includes(q) || estabTxt.includes(q) || (c.direccion||'').toLowerCase().includes(q);
  });
  if(!filtrados.length){ cont.innerHTML = `<div class="empty">No hay clientes que coincidan.</div>`; return; }
  cont.innerHTML = filtrados.map(c=>{
    const nTrab = trabajos.filter(t=>t.clienteId===c.id).length;
    return `<div class="listcard" onclick="abrirClientePerfil('${c.id}')">
      <div class="top"><div class="name">${escapeHtml(clienteNombreCompleto(c))}</div></div>

      <span class="tag finalizado">${nTrab} trabajo${nTrab===1?'':'s'}</span>

  }).join('');
}

function guardarCliente(irANuevoTrabajo){
  const data = {
    nombre: document.getElementById('f_nombre').value.trim(),
    apellido: document.getElementById('f_apellido').value.trim(),
    direccion: document.getElementById('f_direccion').value.trim(),
    establecimientos: window._establecimientosTmp,
  };
  let id = editingId;
  let clienteFinal;
  if(editingId){
    clienteFinal = Object.assign(clienteById(editingId), data);
  } else {
    id = uid();
    clienteFinal = {id, ...data};
    clientes.push(clienteFinal);
  }
  saveClienteDoc(clienteFinal);
  showToast('Cliente guardado');
  if(irANuevoTrabajo){ clienteContexto = id; clienteEstablecimientoContexto=null; editingId=null; navigate('nuevoTrabajoEspecie'); }

function guardarTrabajoActual(estadoFinal){
  if(!trabajoActual.id) trabajoActual.id = uid();
  trabajoActual.estado = estadoFinal;
  const idx = trabajos.findIndex(t=>t.id===trabajoActual.id);
  const copia = JSON.parse(JSON.stringify(trabajoActual));
  if(idx>=0) trabajos[idx]=copia; else trabajos.push(copia);
  saveTrabajoDoc(copia);
}

function hasData(obj){
  if(!obj) return false;
  if(typeof obj === 'string') return obj.trim().length>0;
  if(Array.isArray(obj)) return obj.length>0;
  if(typeof obj === 'object') return Object.values(obj).some(v=>hasData(v));
  return !!obj;
}

        <div class="cattile" onclick="navigate('equino-${c.id}')">

          ${c.has ? '<span class="check">✓</span>' : ''}

function salirDeTrabajo(){

    </div>`;

function confirmarAccionGuardado(fnName, accion, cancelFnName){
  const mensajes = {
    parcial: '¿Guardar este informe como parcial? Vas a poder seguir editándolo después.',
    finalizado: '¿Confirmás que finalizaste? Se va a cerrar este trabajo.',
    salir: '¿Salir sin guardar los cambios de esta pantalla?'
  };

  } else {

}

  if(!trabajoActual.sanidad) trabajoActual.sanidad = {sanidadMasiva:{filas:[]}};

  trabajoActual.sanidad[key].observaciones = valor;
}
function marcarVacuna(key){
  const v = VACUNAS.find(x=>x.key===key);
  if(!trabajoActual.sanidad) trabajoActual.sanidad = {sanidadMasiva:{filas:[]}};
  const hoy = hoyISO();
  const previo = trabajoActual.sanidad[key] || {};
  trabajoActual.sanidad[key] = {fecha: hoy, proxima: sumarDias(hoy, v.dias), observaciones: previo.observaciones||''};
  render();
}

function resumenTrabajoMascota(t){
  let out = `Especie: ${t.especie}\nEstado: ${t.estado}\n`;
  const g = t.informacionGeneral;
  if(g && hasData(g)){
    const p = g.propietario||{}, pa = g.paciente||{};
    out += `\nPropietario: ${[p.nombre,p.apellido].filter(Boolean).join(' ')||'—'}${p.telefono?' · '+p.telefono:''}${p.direccion?' · '+p.direccion:''}\n`;
    out += `Paciente: ${pa.nombre||'—'} · ${pa.raza||''} · ${pa.sexo||''} · ${pa.edad||''}\n`;
  }
  if(t.exploracionClinica && hasData(t.exploracionClinica)){
    out += `\nExploración clínica:\n`;
    if(t.exploracionClinica.estadoGeneral) out += `  Estado general: ${t.exploracionClinica.estadoGeneral}\n`;
    if(t.exploracionClinica.condicionCorporal) out += `  Condición corporal: ${t.exploracionClinica.condicionCorporal}\n`;
    Object.entries(t.exploracionClinica.examenClinico||{}).forEach(([k,v])=>{ if(hasData(v)) out += `  ${k}: ${campoResumen(v)}\n`; });
  }
  if(t.examenesComplementarios && hasData(t.examenesComplementarios)){
    out += `\nExámenes complementarios:\n`;
    const etiquetasCompM = {radiografia:'radiografía', ecografia:'ecografía', sangrado:'análisis de sangre', otros:'otros'};
    Object.entries(t.examenesComplementarios).forEach(([k,v])=>{ if(hasData(v)) out += `  ${etiquetasCompM[k]||k}: ${campoResumen(v)}\n`; });
  }
  if(t.procedimientosQuirurgicos && hasData(t.procedimientosQuirurgicos)){
    out += `\nProcedimientos quirúrgicos:\n`;
    Object.entries(t.procedimientosQuirurgicos).forEach(([k,v])=>{ if(hasData(v)) out += `  ${k}: ${campoResumen(v)}\n`; });
  }
  if(t.sanidad && hasData(t.sanidad)){
    out += `\nSanidad:\n`;
    const lista = listaVacunasPara(t.especie);
    if(lista && t.sanidad.vacuna && typeof t.sanidad.vacuna==='object'){
      lista.forEach(v=>{ if(t.sanidad.vacuna[v.key]) out += `  ${v.label}: aplicada ${fmtFecha(t.sanidad.vacuna[v.key].fecha)}, próxima ${fmtFecha(t.sanidad.vacuna[v.key].proxima)}${t.sanidad.vacuna[v.key].observaciones?' — '+t.sanidad.vacuna[v.key].observaciones:''}\n`; });
    } else if(hasData(t.sanidad.vacuna)) out += `  Vacuna: ${campoResumen(t.sanidad.vacuna)}\n`;
    if(hasData(t.sanidad.desparasitaciones)) out += `  Desparasitaciones: ${campoResumen(t.sanidad.desparasitaciones)}\n`;
    if(hasData(t.sanidad.otros)) out += `  Otros: ${campoResumen(t.sanidad.otros)}\n`;
  }
  if(hasData(t.tratamientos)) out += `\nTratamientos: ${campoResumen(t.tratamientos)}\n`;
  if(hasData(t.otroProcedimiento)) out += `\nOtros procedimientos: ${campoResumen(t.otroProcedimiento)}\n`;
  return out;
}

// --- Búsqueda profunda: recorre todo el trabajo (y el cliente asociado) buscando el texto ---
function textoIndexable(obj, profundidad){
  profundidad = profundidad || 0;
  if(obj==null || profundidad>8) return '';
  if(typeof obj==='string') return obj;
  if(typeof obj==='number') return String(obj);
  if(Array.isArray(obj)) return obj.map(o=>textoIndexable(o,profundidad+1)).join(' ');
  if(typeof obj==='object'){
    return Object.entries(obj).filter(([k])=>k!=='fotos').map(([,v])=>textoIndexable(v,profundidad+1)).join(' ');
  }
  return '';
}
function trabajoMatchesQuery(t, q){
  const cliente = t.clienteId ? clienteById(t.clienteId) : null;
  let texto = textoIndexable(t);
  if(cliente) texto += ' ' + textoIndexable(cliente);
  return texto.toLowerCase().includes(q.toLowerCase());
}
function renderResultadosHistorial(resultados){
  if(!resultados.length) return '<div class="empty">No se encontraron resultados.</div>';
  return `<div class="sectiontitle">${resultados.length} resultado${resultados.length===1?'':'s'}</div>` + resultados.map(renderTrabajoListCard).join('');
}

function ejecutarBusquedaAvanzada(){
  const clienteQ = document.getElementById('hist_av_cliente').value.trim().toLowerCase();
  const estabQ = document.getElementById('hist_av_establecimiento').value.trim().toLowerCase();
  const renspaQ = document.getElementById('hist_av_renspa').value.trim().toLowerCase();
  const especieQ = document.getElementById('hist_av_especie').value;
  const fechaQ = document.getElementById('hist_av_fecha').value;
  let resultados = trabajos.filter(t=>{
    if(especieQ && t.especie!==especieQ) return false;
    if(fechaQ && (!t.fechaInicio || t.fechaInicio < fechaQ)) return false;
    const cliente = t.clienteId ? clienteById(t.clienteId) : null;
    if(clienteQ && !(cliente && clienteNombreCompleto(cliente).toLowerCase().includes(clienteQ))) return false;
    if(estabQ){
      const estabs = (cliente&&cliente.establecimientos)||[];
      if(!estabs.some(e=>(e.nombre||'').toLowerCase().includes(estabQ))) return false;
    }
    if(renspaQ){
      const estabs = (cliente&&cliente.establecimientos)||[];
      if(!estabs.some(e=>(e.renspa||'').toLowerCase().includes(renspaQ))) return false;
    }
    return true;
  }).sort((a,b)=>(b.fechaInicio||'').localeCompare(a.fechaInicio||''));
  document.getElementById('histAvanzadaResultados').innerHTML = renderResultadosHistorial(resultados);
}

  const t = trabajos.find(x=>x.id===editingId);
  if(!t) return '<div class="empty">Este registro ya no existe.</div>';

  return `

    <div class="sectiontitle">${cliente?escapeHtml(clienteNombreCompleto(cliente)):'Sin cliente'} · ${fmtFecha(t.fechaInicio)}</div>
    <div class="reportbox">${escapeHtml(resumenTrabajo(t))}</div>
    <button class="btn btn-outline" onclick="retomarTrabajo('${t.id}')">Reabrir y editar</button>
  `;
}
function campoResumen(v){
  if(!v) return '';
  if(typeof v==='string') return v;
  let s = v.texto||'';
  if(v.fotos && v.fotos.length) s += ` [${v.fotos.length} foto${v.fotos.length===1?'':'s'}]`;
  return s;
}
function resumenTrabajo(t){
  if(t.especie==='Bovino') return resumenTrabajoBovino(t);
  if(t.especie==='Canino'||t.especie==='Felino'||t.especie==='Otros') return resumenTrabajoMascota(t);
  let out = `Especie: ${t.especie}\nEstado: ${t.estado}\n`;
  if(t.datosPaciente && hasData(t.datosPaciente)) out += `\nPaciente: ${t.datosPaciente.nombre||'—'} · ${t.datosPaciente.pelaje||''} · ${t.datosPaciente.edad||''} · ${t.datosPaciente.sexo||''}\n`;
  if(t.exploracionClinica && hasData(t.exploracionClinica)){
    out += `\nExploración clínica:\n`;
    if(t.exploracionClinica.estadoGeneral) out += `  Estado general: ${t.exploracionClinica.estadoGeneral}\n`;
    if(t.exploracionClinica.condicionCorporal) out += `  Condición corporal: ${t.exploracionClinica.condicionCorporal}\n`;
    Object.entries(t.exploracionClinica.examenClinico||{}).forEach(([k,v])=>{ if(hasData(v)) out += `  ${k}: ${campoResumen(v)}\n`; });
  }
  if(t.exploracionReproductiva && hasData(t.exploracionReproductiva)){
    const r = t.exploracionReproductiva;
    out += `\nExploración reproductiva: ${r.estadoGestacional||''}\n`;
    if(r.observaciones) out += `  Observaciones: ${r.observaciones}\n`;
    if(r.edadGestacional) out += `  Edad gestacional: ${r.edadGestacional}\n`;
    if(r.examenReproductivo) out += `  Examen: ${r.examenReproductivo}\n`;
  }
  if(t.examenesComplementarios && hasData(t.examenesComplementarios)){
    out += `\nExámenes complementarios:\n`;
    const etiquetasComp = {radiografia:'radiografía', ecografia:'ecografía', sangrado:'análisis de sangre', otros:'otros'};
    ['radiografia','ecografia','sangrado','otros'].forEach(k=>{ if(hasData(t.examenesComplementarios[k])) out += `  ${etiquetasComp[k]}: ${campoResumen(t.examenesComplementarios[k])}\n`; });
    const sm = t.examenesComplementarios.sangradoMasivo;
    if(sm && sm.tubos && sm.tubos.length) out += `  Análisis de sangre grupal: ${sm.tubos.length} animales\n`;
  }
  if(t.procedimientosQuirurgicos && hasData(t.procedimientosQuirurgicos)){
    out += `\nProcedimientos quirúrgicos:\n`;
    Object.entries(t.procedimientosQuirurgicos).forEach(([k,v])=>{ if(hasData(v)) out += `  ${k}: ${campoResumen(v)}\n`; });
  }
  if(hasData(t.tratamiento)) out += `\nTratamiento: ${campoResumen(t.tratamiento)}\n`;
  if(t.sanidad && hasData(t.sanidad)){
    out += `\nSanidad:\n`;
    VACUNAS.forEach(v=>{ if(t.sanidad[v.key]) out += `  ${v.label}: aplicada ${fmtFecha(t.sanidad[v.key].fecha)}, próxima ${fmtFecha(t.sanidad[v.key].proxima)}${t.sanidad[v.key].observaciones?' — '+t.sanidad[v.key].observaciones:''}\n`; });
    if(t.sanidad.sanidadMasiva && t.sanidad.sanidadMasiva.filas && t.sanidad.sanidadMasiva.filas.length) out += `  Sanidad masiva: ${t.sanidad.sanidadMasiva.filas.length} animales\n`;
  }
  if(hasData(t.otroProcedimiento)) out += `\nOtro procedimiento: ${campoResumen(t.otroProcedimiento)}\n`;
  return out;
}
function resumenTrabajoBovino(t){
  let out = `Especie: Bovino\nEstado: ${t.estado}\n`;
  if(t.registro && t.registro.caravana) out += `\nCaravana de registro: ${t.registro.caravana}\n`;
  if(t.exploracionClinica && hasData(t.exploracionClinica)){
    out += `\nExploración clínica:\n`;
    if(t.exploracionClinica.estadoGeneral) out += `  Estado general: ${t.exploracionClinica.estadoGeneral}\n`;
    if(t.exploracionClinica.condicionCorporal) out += `  Condición corporal: ${t.exploracionClinica.condicionCorporal}\n`;
    Object.entries(t.exploracionClinica.examenClinico||{}).forEach(([k,v])=>{ if(hasData(v)) out += `  ${k}: ${campoResumen(v)}\n`; });
  }
  if(t.exploracionReproductiva && hasData(t.exploracionReproductiva)){
    const r = t.exploracionReproductiva;
    out += `\nExploración reproductiva:\n`;
    const dg = r.diagnosticoGestacion;
    if(dg && dg.registros && dg.registros.length){
      const pren = dg.registros.filter(x=>x.resultado==='Preñada').length;
      const vac = dg.registros.filter(x=>x.resultado==='Vacía').length;
      out += `  Diagnóstico de gestación: ${dg.registros.length} animales (${pren} preñadas, ${vac} vacías)\n`;
      if(dg.comentario) out += `    Comentario: ${dg.comentario}\n`;
    }
    if(r.preservicio && r.preservicio.registros && r.preservicio.registros.length) out += `  Preservicio: ${r.preservicio.registros.length} animales\n`;
    if(r.servicio){
      if(r.servicio.iatf && r.servicio.iatf.length) out += `  Servicio IATF: ${r.servicio.iatf.length} animales\n`;
      if(r.servicio.natural) out += `  Servicio natural: ${r.servicio.natural}\n`;
    }
    if(r.examenGinecologico && r.examenGinecologico.registros && r.examenGinecologico.registros.length) out += `  Examen ginecológico: ${r.examenGinecologico.registros.length} animales\n`;
    if(r.observacion) out += `  Observación general: ${r.observacion}\n`;
  }
  if(t.examenAndrologico && hasData(t.examenAndrologico)){
    const a = t.examenAndrologico;
    out += `\nExamen andrológico: caravana ${a.caravana||'—'}, raza ${a.raza||'—'}, edad ${a.edad||'—'}\n`;
    if(a.locomotor) out += `  Ap. locomotor: ${a.locomotor}\n`;
    if(a.vision) out += `  Ap. visión: ${a.vision}\n`;
    if(a.tonoTesticular) out += `  Tono testicular: ${a.tonoTesticular}\n`;
    if(hasData(a.circunferencia)) out += `  Circunferencia escrotal: ${campoResumen(a.circunferencia)}\n`;
    if(hasData(a.ecografia)) out += `  Ecografía testicular: ${campoResumen(a.ecografia)}\n`;
    if(hasData(a.calidadSeminal)) out += `  Calidad seminal: ${campoResumen(a.calidadSeminal)}\n`;
  }
  if(t.examenesComplementarios && hasData(t.examenesComplementarios)){
    const ex = t.examenesComplementarios;
    out += `\nExámenes complementarios:\n`;
    if(ex.datosAnimal && ex.datosAnimal.caravana) out += `  Caravana: ${ex.datosAnimal.caravana}\n`;
    const etiquetasCompB = {ecografia:'ecografía', radiografia:'radiografía', sangrado:'análisis de sangre', otro:'otro'};
    ['ecografia','radiografia','sangrado','otro'].forEach(k=>{ if(hasData(ex[k])) out += `  ${etiquetasCompB[k]}: ${campoResumen(ex[k])}\n`; });
    if(ex.sangradoMasivo && ex.sangradoMasivo.tubos && ex.sangradoMasivo.tubos.length) out += `  Análisis de sangre grupal: ${ex.sangradoMasivo.tubos.length} animales\n`;
  }
  if(t.procedimientosQuirurgicos && hasData(t.procedimientosQuirurgicos)){
    out += `\nProcedimientos quirúrgicos:\n`;
    Object.entries(t.procedimientosQuirurgicos).forEach(([k,v])=>{ if(v && v.texto) out += `  ${k} (caravana ${v.caravana||'—'}): ${campoResumen(v)}\n`; });
  }
  if(t.tratamiento && hasData(t.tratamiento)){
    out += `\nTratamiento:\n`;
    if(hasData(t.tratamiento.individual)) out += `  Individual: ${campoResumen(t.tratamiento.individual)}\n`;
    if(t.tratamiento.masivo && t.tratamiento.masivo.filas && t.tratamiento.masivo.filas.length) out += `  Masivo: ${t.tratamiento.masivo.filas.length} animales\n`;
  }
  if(t.sanidad && hasData(t.sanidad)){
    out += `\nSanidad:\n`;
    if(t.sanidad.individual) Object.entries(t.sanidad.individual).forEach(([k,v])=>{ if(hasData(v)) out += `  Individual - ${k}: ${campoResumen(v)}\n`; });
    if(t.sanidad.masivo) Object.entries(t.sanidad.masivo).forEach(([k,v])=>{ if(v && v.filas && v.filas.length) out += `  Masivo - ${k}: ${v.filas.length} animales\n`; });
  }
  if(hasData(t.otroProcedimiento)) out += `\nOtro procedimiento: ${campoResumen(t.otroProcedimiento)}\n`;
  return out;
}

  const resultados = trabajos.filter(t=>{

function recolectarFotos(obj, acc){
  acc = acc || [];
  if(!obj) return acc;
  if(Array.isArray(obj)){ obj.forEach(o=>recolectarFotos(o,acc)); return acc; }
  if(typeof obj==='object'){
    if(Array.isArray(obj.fotos)) acc.push(...obj.fotos);
    Object.entries(obj).forEach(([k,v])=>{ if(k!=='fotos') recolectarFotos(v,acc); });
  }
  return acc;
}
function renderInformeHTML(t, cliente){
  let html = '';
  html += `<div style="margin-bottom:14px;"><b style="font-size:15px;">${cliente?escapeHtml(clienteNombreCompleto(cliente)):'Sin cliente asociado'}</b>`;
  if(cliente && cliente.establecimientos && cliente.establecimientos.length){
    const estab = t.establecimientoId ? cliente.establecimientos.find(e=>e.id===t.establecimientoId) : null;
    if(estab){
      html += `<div class="fieldnote">${escapeHtml(estab.nombre)}${estab.renspa?' · RENSPA '+escapeHtml(estab.renspa):''}${estab.ubicacion?' · '+escapeHtml(estab.ubicacion):''}</div>`;
    } else {
      html += `<div class="fieldnote">${cliente.establecimientos.map(e=>escapeHtml(e.nombre)).join(' · ')}</div>`;
    }
  }
  html += `<div class="fieldnote">${fmtFecha(t.fechaInicio)} · ${t.especie} · ${t.estado==='finalizado'?'Finalizado':'En curso'}</div></div>`;

  if(t.especie==='Bovino' && t.exploracionReproductiva && t.exploracionReproductiva.diagnosticoGestacion){
    const regs = t.exploracionReproductiva.diagnosticoGestacion.registros||[];
    if(regs.length){
      const pren = regs.filter(x=>x.resultado==='Preñada').length;
      const vac = regs.filter(x=>x.resultado==='Vacía').length;
      const pct = Math.round((pren/regs.length)*100);
      const cab = regs.filter(x=>x.subresultado==='Cabeza').length;
      const cue = regs.filter(x=>x.subresultado==='Cuerpo').length;
      const col = regs.filter(x=>x.subresultado==='Cola').length;
      html += `<div style="margin-bottom:16px;">
        <b>Diagnóstico de gestación — ${regs.length} animales</b>
        <div style="display:flex; height:22px; border-radius:5px; overflow:hidden; margin-top:8px;">
          <div style="width:${pct}%; background:var(--green);"></div>
          <div style="width:${100-pct}%; background:var(--line);"></div>
        </div>
        <div class="fieldnote">Preñadas: ${pren} (${pct}%) · Vacías: ${vac} (${100-pct}%)</div>
        ${pren?`<div class="fieldnote">De las preñadas — Cabeza: ${cab} · Cuerpo: ${cue} · Cola: ${col}</div>`:''}
      </div>`;
    }
  }

  html += `<div style="white-space:pre-wrap; font-size:12.5px; line-height:1.6;">${escapeHtml(resumenTrabajo(t))}</div>`;

  const fotos = recolectarFotos(t);
  if(fotos.length){
    html += `<div style="margin-top:14px;"><b>Fotos (${fotos.length})</b><div class="fotogrid" style="margin-top:8px;">${fotos.map(f=>`<div class="fotothumb" style="width:80px;height:80px;"><img src="${f}"></div>`).join('')}</div></div>`;
  }
  return html;
}
function textoCompartible(t){
  const cliente = t.clienteId?clienteById(t.clienteId):null;
  return `INFORME VETERINARIO\n${cliente?clienteNombreCompleto(cliente):'Sin cliente'}\n${fmtFecha(t.fechaInicio)} · ${t.especie}\n\n${resumenTrabajo(t)}`;
}
function compartirWhatsapp(id){
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  window.open(`https://wa.me/?text=${encodeURIComponent(textoCompartible(t))}`, '_blank');
}
function compartirMail(id){
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  const cliente = t.clienteId?clienteById(t.clienteId):null;
  const asunto = encodeURIComponent(`Informe veterinario - ${cliente?clienteNombreCompleto(cliente):''} - ${fmtFecha(t.fechaInicio)}`);
  window.location.href = `mailto:?subject=${asunto}&body=${encodeURIComponent(textoCompartible(t))}`;
}
function copiarInformeTexto(id){
  const t = trabajos.find(x=>x.id===id); if(!t) return;
  navigator.clipboard.writeText(textoCompartible(t)).then(()=>showToast('Informe copiado')).catch(()=>showToast('No se pudo copiar'));
}
function eliminarInforme(id){
  if(!confirm('¿Eliminar este informe? Esta acción no se puede deshacer.')) return;
  trabajos = trabajos.filter(t=>t.id!==id);
  deleteTrabajoDoc(id);
  informeVerId=null;
  navigate('informes');
}

// ---------------- INIT ----------------
view = 'cargando';
render();
fbAuth.onAuthStateChanged(function(user){
  if(user){
    auth = {usuario: user.email};
    sesionActiva = true;
    attachListeners();
    navigate('home');
  } else {
    auth = null;
    sesionActiva = false;
    clientes = []; trabajos = [];
    detachListeners();
    navigate('login');
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){ console.warn('SW no registrado', err); });
  });
}
</script>
